"e": "ND 필터는 광량을 줄이는 필터로 접사와 직접 관계가 없다. 벨로즈·접사링은 렌즈와 몸체 사이 거리를 늘려 배율을 키운다.", "s": 3, "ch": 4}, {"id": "S3-021", "topic": "조리개", "q": "조리개 수치(f값)에 대한 설명으로 옳은 것은?", "c": ["숫자가 작을수록 조리개가 조여져 어둡다", "f값은 셔터속도를 뜻한다", "f값은 렌즈의 무게를 뜻한다", "숫자가 작을수록 조리개가 크게 열려 밝다"], "a": 4, "e": "f값은 초점거리를 유효 구경으로 나눈 값이라 숫자가 작을수록 구경이 크고 밝다. f/2.8이 f/8보다 3스톱 밝다.", "s": 3, "ch": 4}, {"id": "S3-022", "topic": "조리개", "q": "조리개를 f/5.6에서 f/11로 조였을 때 들어오는 빛의 양은?", "c": ["2배가 된다", "변화가 없다", "1/4로 줄어든다", "1/2로 줄어든다"], "a": 3, "e": "f/5.6 → f/8 → f/11은 2스톱 차이이므로 광량은 1/4이 된다. 조리개 계열은 1, 1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22 순으로 한 단계씩 반씩 줄어든다.", "s": 3, "ch": 4}, {"id": "S3-023", "topic": "심도", "q": "피사계심도가 얕아지는 조건으로 옳은 것은?", "c": ["조리개 값과 심도는 관계가 없다", "조리개를 열고, 망원렌즈로, 피사체에 가까이 갈수록", "조리개를 조이고, 광각렌즈로, 멀리서 찍을수록", "조리개를 조이고, 망원렌즈로 찍을수록"], "a": 2, "e": "심도는 조리개가 열릴수록, 초점거리가 길수록, 촬영거리가 가까울수록 얕아진다. 인물 배경을 날릴 때 쓰는 조합이다.", "s": 3, "ch": 4}, {"id": "S3-024", "topic": "심도", "q": "피사계심도의 분포에 대한 설명으로 옳은 것은?", "c": ["초점거리와 무관하게 일정하다", "초점이 맞은 지점을 기준으로 앞쪽보다 뒤쪽이 더 넓다", "앞쪽이 뒤쪽보다 더 넓다", "앞뒤가 항상 정확히 같다"], "a": 2, "e": "일반적으로 전방 1 대 후방 2의 비율로 알려져 있다. 그래서 심도를 활용하려면 원하는 범위의 앞쪽 1/3 지점에 초점을 맞춘다.", "s": 3, "ch": 4}, {"id": "S3-025", "topic": "심도", "q": "무한대까지 선명하게 담기면서 앞쪽 심도가 가장 넓어지는 초점 거리를 뜻하는 것은?", "c": ["플랜지백", "과초점거리", "최단촬영거리", "초점거리"], "a": 2, "e": "과초점거리에 초점을 맞추면 그 거리의 절반 지점부터 무한대까지 선명해진다. 풍경 촬영에서 심도를 최대로 활용하는 방법이다.", "s": 3, "ch": 4}, {"id": "S3-026", "topic": "조리개", "q": "조리개를 극단적으로 조였을 때(예: f/22 이상) 화질이 오히려 떨어지는 주된 이유는?", "c": ["심도가 얕아지기 때문", "셔터가 느려지기 때문", "회절 현상 때문에 상이 흐려지기 때문", "색수차가 커지기 때문"], "a": 3, "e": "조리개 구멍이 작아질수록 빛이 가장자리에서 휘는 회절이 커져 해상력이 떨어진다. 대부분의 렌즈는 개방에서 2~3스톱 조인 지점이 가장 선예하다.", "s": 3, "ch": 4}, {"id": "S3-027", "topic": "노출", "q": "f/8, 1/125초로 적정 노출을 얻었다. 조리개를 f/4로 바꿀 때 같은 노출을 유지하려면 셔터속도는?", "c": ["1/30초", "1/250초", "1/500초", "1/60초"], "a": 3, "e": "f/8에서 f/4는 2스톱 밝아지므로 셔터속도를 2스톱 빠르게 해야 한다. 1/125 → 1/250 → 1/500초다.", "s": 3, "ch": 8}, {"id": "S3-028", "topic": "노출", "q": "움직이는 피사체를 정지시켜 찍기 위한 조치로 가장 적절한 것은?", "c": ["감도를 낮춘다", "초점거리를 늘린다", "셔터속도를 빠르게 한다", "조리개를 조인다"], "a": 3, "e": "동체를 멈추려면 셔터속도가 관건이다. 셔터를 빠르게 하려면 조리개를 열거나 감도를 올려 노출을 맞춘다.", "s": 3, "ch": 8}, {"id": "S3-029", "topic": "노출", "q": "카메라 흔들림을 막기 위한 최저 셔터속도의 일반적인 기준은?", "c": ["항상 1/30초", "항상 1초 이상", "조리개 값과 같은 수치", "1 나누기 렌즈 초점거리(초)보다 빠르게"], "a": 4, "e": "200mm 렌즈라면 1/200초 이상이 기준이다. 손떨림 보정 기능이 있으면 몇 스톱 여유가 생기지만 원칙은 같다.", "s": 3, "ch": 8}, {"id": "S3-030", "topic": "노출계", "q": "피사체에 도달하는 빛을 직접 재는 방식으로, 피사체 색이나 반사율에 영향을 받지 않는 측광 방식은?", "c": ["반사식 측광", "스포트 측광", "평균 측광", "입사식 측광"], "a": 4, "e": "입사식은 피사체 위치에서 광원 쪽으로 확산판을 향해 재므로 피사체의 밝고 어두움에 좌우되지 않는다. 카메라 내장 노출계는 대부분 반사식이다.", "s": 3, "ch": 4}, {"id": "S3-031", "topic": "노출계", "q": "화면 중앙의 매우 좁은 범위만 정밀하게 측광하는 방식은?", "c": ["중앙부 중점 측광", "다분할 측광", "스포트 측광", "평균 측광"], "a": 3, "e": "스포트 측광은 1~3도 정도의 좁은 각도만 잰다. 역광 인물이나 무대 조명처럼 밝기 차가 큰 장면에서 유용하다.", "s": 3, "ch": 4}, {"id": "S3-032", "topic": "노출계", "q": "반사식 노출계가 기준으로 삼는 표준 반사율은?", "c": ["50%", "90%", "5%", "18%"], "a": 4, "e": "반사식 노출계는 대상을 18% 반사율의 중간 회색으로 가정하고 노출을 계산한다. 그래서 눈밭은 어둡게, 검은 물체는 밝게 찍히므로 보정이 필요하다.", "s": 3, "ch": 4}, {"id": "S3-033", "topic": "노출", "q": "눈 덮인 설경을 카메라 자동 노출로 찍었더니 회색으로 어둡게 나왔다. 올바른 대처는?", "c": ["조리개를 조인다", "노출을 +1~2스톱 보정한다", "노출을 -1~2스톱 보정한다", "감도를 낮춘다"], "a": 2, "e": "노출계가 흰 눈을 18% 회색으로 맞추려 하기 때문에 어두워진다. 밝은 피사체는 플러스 보정, 어두운 피사체는 마이너스 보정이 원칙이다.", "s": 3, "ch": 8}, {"id": "S3-034", "topic": "노출", "q": "같은 장면을 노출을 단계적으로 바꿔 여러 장 찍어 두는 촬영 방법은?", "c": ["다중노출", "솔라리제이션", "브라케팅", "팬닝"], "a": 3, "e": "브라케팅은 적정 노출을 기준으로 ±1/2 또는 ±1스톱씩 더 찍어 실패를 줄이는 방법이다. 관용도가 좁은 리버설 촬영에서 특히 유용하다.", "s": 3, "ch": 8}, {"id": "S3-035", "topic": "필터", "q": "수면이나 유리의 반사를 제거하고 하늘을 진하게 표현할 때 쓰는 필터는?", "c": ["스카이라이트 필터", "편광(PL) 필터", "UV 필터", "ND 필터"], "a": 2, "e": "편광 필터는 회전시켜 특정 방향의 편광을 차단한다. 태양과 90도 방향에서 효과가 가장 크고, 대체로 1~2스톱의 노출 증가가 필요하다.", "s": 3, "ch": 4}, {"id": "S3-036", "topic": "필터", "q": "색과 계조에 영향을 주지 않고 광량만 줄여 밝은 곳에서 조리개를 열거나 장노출을 하게 해 주는 필터는?", "c": ["PL 필터", "UV 필터", "색보정 필터", "ND 필터"], "a": 4, "e": "ND(Neutral Density) 필터는 중성 회색 농도를 가진다. 낮에 흐르는 물을 실크처럼 표현하거나 밝은 곳에서 개방 촬영할 때 쓴다.", "s": 3, "ch": 4}, {"id": "S3-037", "topic": "필터", "q": "흑백 촬영에서 붉은색 필터를 사용했을 때 하늘이 어떻게 표현되는가?", "c": ["푸른 하늘이 어둡게 되어 구름이 강조된다", "하늘이 더 밝게 표현된다", "변화가 없다", "하늘이 붉게 나온다"], "a": 1, "e": "흑백용 컬러 필터는 같은 색을 밝게, 보색을 어둡게 만든다. 붉은 필터는 파란 하늘을 어둡게 눌러 흰 구름을 극적으로 살린다.", "s": 3, "ch": 4}, {"id": "S3-038", "topic": "필터", "q": "텅스텐(3200K) 조명 아래에서 데이라이트용 필름을 쓸 때 필요한 색온도 변환 필터 계열은?", "c": ["청색 계열(80 계통)", "앰버 계열(85 계통)", "녹색 계열", "자외선 차단 계열"], "a": 1, "e": "낮은 색온도의 광원을 데이라이트 필름 기준으로 올려야 하므로 청색 계열 필터를 쓴다. 반대의 경우는 앰버 계열(85)로 색온도를 낮춘다.", "s": 3, "ch": 4}, {"id": "S3-039", "topic": "필터", "q": "필터를 사용할 때 노출 배수(filter factor)가 2라면 필요한 노출 보정량은?", "c": ["보정 불필요", "1스톱 증가", "2스톱 증가", "1스톱 감소"], "a": 2, "e": "노출 배수 2는 빛이 절반으로 줄었다는 뜻이므로 1스톱 더 준다. 배수 4는 2스톱, 8은 3스톱이다.", "s": 3, "ch": 4}, {"id": "S3-040", "topic": "플래시", "q": "가이드넘버(GN)가 40인 플래시로 5m 거리의 피사체를 찍을 때 적절한 조리개 값은?", "c": ["f/4", "f/16", "f/8", "f/2.8"], "a": 3, "e": "조리개 값 = 가이드넘버 ÷ 거리 이므로 40÷5=8, 즉 f/8이다. 가이드넘버는 보통 ISO 100 기준으로 표기한다.", "s": 3, "ch": 5}, {"id": "S3-041", "topic": "플래시", "q": "포컬플레인 셔터 카메라에서 플래시 동조속도보다 빠른 셔터속도로 촬영하면 나타나는 현상은?", "c": ["아무 변화가 없다", "화면의 일부만 노광되고 나머지가 검게 나온다", "전체가 하얗게 날아간다", "색이 푸르게 변한다"], "a": 2, "e": "동조속도보다 빠르면 셔터막이 완전히 열리지 않고 슬릿으로 지나가므로 플래시가 터진 순간 열려 있던 부분만 찍힌다.", "s": 3, "ch": 5}, {"id": "S3-042", "topic": "플래시", "q": "플래시를 천장이나 벽에 반사시켜 부드러운 빛을 얻는 기법은?", "c": ["팬닝", "바운스 플래시", "슬로 싱크로", "다중노출"], "a": 2, "e": "바운스는 광원 면적을 넓혀 그림자를 부드럽게 한다. 다만 광량 손실이 크고 반사면 색이 피사체에 물들 수 있어 흰색 면이 좋다.", "s": 3, "ch": 5}, {"id": "S3-043", "topic": "플래시", "q": "야경을 배경으로 인물을 찍을 때 인물은 플래시로, 배경은 느린 셔터로 함께 살리는 촬영법은?", "c": ["고속동조", "선막동조 고정", "다중측광", "슬로 싱크로"], "a": 4, "e": "셔터를 느리게 열어 배경의 어두운 빛을 담고 플래시로 인물을 밝힌다. 삼각대를 쓰거나 뒷막 동조를 활용하면 자연스럽다.", "s": 3, "ch": 5}, {"id": "S3-044", "topic": "플래시", "q": "낮에 역광으로 인물을 찍을 때 얼굴의 그늘을 없애기 위해 플래시를 터뜨리는 기법은?", "c": ["바운스", "슬로 싱크로", "스트로보 다중발광", "필 인 플래시(일광 동조)"], "a": 4, "e": "주광이 충분한 낮에도 보조광으로 플래시를 써서 그림자를 채운다. 배경과 인물의 밝기 차를 줄이는 것이 목적이다.", "s": 3, "ch": 5}, {"id": "S3-045", "topic": "조명", "q": "인물 촬영에서 피사체의 형태와 밝기를 주로 결정하는 가장 중심이 되는 빛은?", "c": ["역광(back light)", "배경광", "주광(key light)", "보조광(fill light)"], "a": 3, "e": "주광이 형태와 그림자의 방향을 정하고, 보조광이 그림자의 농도를 조절하며, 역광은 피사체와 배경을 분리한다.", "s": 3, "ch": 5}, {"id": "S3-046", "topic": "조명", "q": "주광과 보조광의 밝기 비율을 뜻하는 용어는?", "c": ["연색성", "라이팅 비(조명비)", "가이드넘버", "노출 배수"], "a": 2, "e": "조명비가 클수록 그림자가 짙어 극적이고, 작을수록 평면적이고 부드럽다. 인물 촬영에서는 흔히 2:1~4:1을 쓴다.", "s": 3, "ch": 5}, {"id": "S3-047", "topic": "조명", "q": "소프트박스나 엄브렐러를 사용하는 주된 이유는?", "c": ["광량을 늘리기 위해", "색온도를 낮추기 위해", "심도를 깊게 하기 위해", "광원의 면적을 키워 그림자 경계를 부드럽게 하기 위해"], "a": 4, "e": "광원이 크고 가까울수록 확산광이 되어 그림자가 부드러워진다. 반대로 작은 직사광원은 경계가 뚜렷한 강한 그림자를 만든다.", "s": 3, "ch": 5}, {"id": "S3-048", "topic": "조명", "q": "피사체 뒤쪽에서 비추어 윤곽선을 살리고 배경과 분리시키는 조명은?", "c": ["주광", "보조광", "배경광", "역광(백라이트)"], "a": 4, "e": "역광은 머리카락과 어깨선에 빛의 테두리를 만들어 입체감을 준다. 노출은 얼굴 기준으로 잡아야 실루엣이 되지 않는다.", "s": 3, "ch": 5}, {"id": "S3-049", "topic": "조명", "q": "인물 조명에서 코 옆에 나비 모양 그림자가 생기도록 카메라 위 정면 높은 곳에서 비추는 조명법은?", "c": ["버터플라이(파라마운트) 라이팅", "렘브란트 라이팅", "루프 라이팅", "스플릿 라이팅"], "a": 1, "e": "버터플라이는 얼굴을 매끈하게 보여 주는 조명이다. 렘브란트는 그늘진 뺨에 삼각형 하이라이트가, 스플릿은 얼굴 절반만 밝게 나온다.", "s": 3, "ch": 5}, {"id": "S3-050", "topic": "촬영기법", "q": "움직이는 피사체를 따라 카메라를 돌리며 느린 셔터로 촬영해 배경만 흐르게 하는 기법은?", "c": ["팬닝", "줌 인 아웃", "다중노출", "브라케팅"], "a": 1, "e": "팬닝은 피사체는 선명하고 배경은 흐르게 해 속도감을 표현한다. 대체로 1/30~1/60초 정도의 셔터속도를 쓴다.", "s": 3, "ch": 8}, {"id": "S3-051", "topic": "촬영기법", "q": "한 장의 필름에 두 번 이상 노광을 주어 여러 상을 겹쳐 표현하는 기법은?", "c": ["리터칭", "브라케팅", "다중노출", "솔라리제이션"], "a": 3, "e": "다중노출에서는 각 노광의 합이 적정 노출이 되도록 한 장당 노출을 줄여야 과다 노출을 피할 수 있다.", "s": 3, "ch": 8}, {"id": "S3-052", "topic": "촬영기법", "q": "삼각대를 사용할 때 셔터 버튼을 직접 누르지 않아 흔들림을 줄여 주는 부속은?", "c": ["후드", "컨버터", "데이터 백", "릴리즈"], "a": 4, "e": "케이블 릴리즈나 리모컨을 쓰면 카메라를 건드리지 않고 촬영할 수 있다. SLR에서는 미러 업 기능을 함께 쓰면 더 좋다.", "s": 3, "ch": 8}, {"id": "S3-053", "topic": "뷰카메라", "q": "뷰카메라에서 렌즈판이나 필름면을 위아래로 평행 이동시키는 무브먼트는?", "c": ["라이즈·폴", "스윙", "틸트", "시프트"], "a": 1, "e": "라이즈는 위로, 폴은 아래로의 평행 이동이다. 좌우 평행 이동은 시프트, 수직축 회전은 스윙, 수평축 회전은 틸트다.", "s": 3, "ch": 4}, {"id": "S3-054", "topic": "뷰카메라", "q": "렌즈면·필름면·피사체면이 한 점에서 만나면 화면 전체에 초점이 맞는다는 법칙은?", "c": ["역제곱 법칙", "상반칙", "베버-페히너 법칙", "샤임플러그의 법칙"], "a": 4, "e": "샤임플러그 법칙을 이용하면 조리개를 크게 조이지 않고도 비스듬한 면 전체에 초점을 맞출 수 있다. 틸트 조작의 이론적 근거다.", "s": 3, "ch": 4}, {"id": "S3-055", "topic": "촬영", "q": "제품(정물) 촬영에서 유리컵처럼 반사가 심한 피사체를 찍을 때 가장 적절한 조명은?", "c": ["확산광과 반사판을 이용한 넓은 면광원", "작은 직사 스포트라이트", "카메라 정면의 직사 플래시", "맨 전구 한 개의 직사광"], "a": 1, "e": "반사가 심한 피사체는 광원의 형태가 그대로 비치므로, 넓고 균일한 확산광을 써서 부드러운 하이라이트 띠를 만드는 것이 기본이다.", "s": 3, "ch": 8}, {"id": "S3-056", "topic": "촬영", "q": "인물 상반신 촬영에서 왜곡을 줄이고 자연스러운 얼굴 비례를 얻기에 가장 적합한 렌즈는?", "c": ["어안렌즈", "85~135mm 중망원", "16mm 초광각", "300mm 초망원"], "a": 2, "e": "중망원은 촬영 거리를 확보해 코가 커 보이는 왜곡을 줄이고 배경도 적당히 정리해 준다. 그래서 인물 렌즈로 불린다.", "s": 3, "ch": 8}, {"id": "S3-057", "topic": "촬영", "q": "풍경 사진에서 앞의 꽃부터 먼 산까지 모두 선명하게 담으려 할 때 적절한 조치는?", "c": ["광각렌즈에 조리개를 조이고 과초점거리를 활용한다", "망원렌즈에 조리개를 개방한다", "최단거리에서 개방으로 찍는다", "ND 필터로 심도를 깊게 한다"], "a": 1, "e": "심도를 최대로 얻으려면 짧은 초점거리와 조인 조리개, 그리고 과초점거리 활용이 정석이다. 다만 회절을 고려해 지나치게 조이지는 않는다.", "s": 3, "ch": 8}, {"id": "S3-058", "topic": "촬영", "q": "카메라에 내장된 노출계 중 화면 중앙의 광량에 비중을 두면서 주변도 함께 참고하는 방식은?", "c": ["평균 측광", "다분할 측광", "중앙부 중점 측광", "스포트 측광"], "a": 3, "e": "중앙부 중점 측광은 주 피사체가 대개 가운데 있다는 전제로 중앙에 가중치를 둔다. 다분할 측광은 화면을 여러 구역으로 나눠 종합 판단한다.", "s": 3, "ch": 8}, {"id": "S3-059", "topic": "카메라관리", "q": "카메라와 렌즈 관리 방법으로 옳지 않은 것은?", "c": ["블로어로 먼지를 먼저 날린 뒤 전용 클리너로 닦는다", "장기 보관 시 건조제와 함께 통풍되는 곳에 둔다", "급격한 온도 변화로 생긴 결로는 마를 때까지 기다린다", "렌즈 앞면은 옷소매나 휴지로 힘주어 닦는다"], "a": 4, "e": "거친 재질로 문지르면 코팅에 흠집이 난다. 블로어 → 브러시 → 전용 페이퍼와 클리너 순으로 다뤄야 한다.", "s": 3, "ch": 4}, {"id": "S3-060", "topic": "촬영", "q": "광원에서 피사체까지 거리가 2배로 늘어났을 때 피사체가 받는 빛의 강도 변화로 옳은 것은?", "c": ["1/4로 줄어든다", "1/2로 줄어든다", "1/8로 줄어든다", "1/16으로 줄어든다"], "a": 1, "e": "역제곱 법칙에 따라 거리의 제곱에 반비례한다. 스튜디오에서 조명 거리를 옮길 때 반드시 노출을 다시 계산해야 하는 이유다.", "s": 3, "ch": 8}, {"id": "S3-061", "topic": "광원", "q": "스튜디오 조명에서 지속광(텅스텐·LED)과 비교한 순간광(스트로보)의 장점으로 옳은 것은?", "c": ["색온도가 항상 텅스텐과 같다", "광량이 크고 발열이 적으며 순간적으로 피사체를 정지시킬 수 있다", "조명 효과를 눈으로 그대로 보면서 촬영할 수 있다", "전력 소모가 전혀 없다"], "a": 2, "e": "스트로보는 짧고 강한 빛을 내 발열이 적고 동작을 멈춰 세운다. 대신 결과를 미리 볼 수 없어 모델링 램프로 방향을 확인한다.", "s": 3, "ch": 5}, {"id": "S3-062", "topic": "광원", "q": "일반적인 스튜디오용 스트로보의 색온도로 가장 가까운 것은?", "c": ["약 1800K", "약 3200K", "약 9000K", "약 5500K"], "a": 4, "e": "스트로보는 주광(약 5500K)에 맞춰져 있어 데이라이트 기준으로 촬영한다. 텅스텐 조명은 약 3200K다.", "s": 3, "ch": 5}, {"id": "S3-063", "topic": "조명기구", "q": "빛을 좁은 범위로 모아 특정 부분만 강조할 때 사용하는 조명 액세서리는?", "c": ["디퓨저", "스누트", "소프트박스", "엄브렐러"], "a": 2, "e": "스누트는 원통형으로 빛의 퍼짐을 막아 스포트라이트처럼 쓴다. 소프트박스·엄브렐러·디퓨저는 반대로 빛을 넓고 부드럽게 만든다.", "s": 3, "ch": 5}, {"id": "S3-064", "topic": "조명기구", "q": "빛의 퍼짐 각도를 제한하면서 그림자 경계를 유지하고 싶을 때 조명 앞에 다는 벌집 모양 부속은?", "c": ["허니컴 그리드", "트레이싱지", "반사판", "컬러 젤"], "a": 1, "e": "허니컴 그리드는 빛을 좁혀 배경으로 새는 것을 막는다. 컬러 젤은 조명에 색을 입히거나 색온도를 바꾸는 데 쓴다.", "s": 3, "ch": 5}, {"id": "S3-065", "topic": "조명기구", "q": "주광 반대편에서 그림자 부분에 빛을 되돌려 넣어 밝기 차를 줄이는 데 쓰는 것은?", "c": ["반사판", "스누트", "배경지", "릴리즈"], "a": 1, "e": "반사판은 별도의 전원 없이 조명비를 낮춘다. 흰색은 부드럽게, 은색은 강하게, 금색은 따뜻한 색조를 더한다.", "s": 3, "ch": 5}, {"id": "S3-066", "topic": "라이팅", "q": "인물의 얼굴 절반만 밝고 나머지 절반이 그늘에 들어가도록 옆에서 비추는 조명법은?", "c": ["스플릿 라이팅", "버터플라이 라이팅", "루프 라이팅", "림 라이팅"], "a": 1, "e": "스플릿은 90도 측면광으로 강한 인상을 준다. 루프는 코 그림자가 고리 모양으로 살짝 지는 가장 무난한 인물 조명이다.", "s": 3, "ch": 5}, {"id": "S3-067", "topic": "라이팅", "q": "화면 전체를 밝은 톤으로 채워 부드럽고 경쾌한 느낌을 주는 조명·표현 방식은?", "c": ["백라이트", "하이키", "로키", "실루엣"], "a": 2, "e": "하이키는 밝은 톤 위주로 그림자를 최소화하고, 로키는 어두운 톤과 짙은 그림자로 무겁고 극적인 분위기를 만든다.", "s": 3, "ch": 5}, {"id": "S3-068", "topic": "라이팅", "q": "광고·제품 촬영에서 흔히 쓰는 3점 조명의 구성으로 옳은 것은?", "c": ["역광, 역광, 확산광", "주광, 보조광, 역광(분리광)", "주광, 주광, 주광", "보조광, 배경광, 반사판"], "a": 2, "e": "주광으로 형태를 만들고, 보조광으로 그림자 농도를 조절하며, 역광으로 피사체를 배경에서 떼어 낸다. 여기에 배경광을 더하면 4점이 된다.", "s": 3, "ch": 5}, {"id": "S3-069", "topic": "조명", "q": "광원이 피사체에 가까울수록 나타나는 현상으로 옳은 것은?", "c": ["상대적으로 광원이 커져 그림자가 부드러워지고 광량은 급격히 늘어난다", "그림자가 더 딱딱해진다", "광량 변화가 거의 없다", "색온도가 낮아진다"], "a": 1, "e": "광원의 상대적 크기가 커지므로 그림자 경계가 부드러워진다. 동시에 역제곱 법칙으로 광량이 크게 변해 노출을 다시 재야 한다.", "s": 3, "ch": 5}, {"id": "S3-070", "topic": "조명", "q": "스트로보 촬영에서 노출을 정확히 맞추기 위해 사용하는 측정 도구는?", "c": ["색온도계", "확대기", "그레이카드 없이 육안 판단", "플래시 미터(입사식 노출계)"], "a": 4, "e": "순간광은 카메라 내장 노출계로 미리 잴 수 없다. 플래시 미터를 피사체 위치에 두고 발광시켜 조리개 값을 얻는다.", "s": 3, "ch": 5}, {"id": "S3-071", "topic": "촬영계획", "q": "상업 사진 촬영에서 촬영 전에 구도·조명·소품을 그림으로 미리 계획하는 것은?", "c": ["리터칭", "캘리브레이션", "브라케팅", "콘티(스토리보드) 작성"], "a": 4, "e": "촬영 계획 단계에서 콘티를 그리면 스태프와 의도를 공유할 수 있고, 필요한 장비와 시간을 미리 산정할 수 있다.", "s": 3, "ch": 8}, {"id": "S3-072", "topic": "촬영계획", "q": "야외 촬영 계획을 세울 때 가장 먼저 확인해야 할 사항으로 거리가 먼 것은?", "c": ["촬영 장소의 허가 여부", "인화지의 호수", "촬영 시간대와 태양의 방향", "날씨와 일기예보"], "a": 2, "e": "인화지 선택은 촬영이 끝난 뒤 암실 단계의 문제다. 야외 촬영 계획에서는 빛의 방향, 날씨, 장소 사용 조건이 먼저다.", "s": 3, "ch": 8}, {"id": "S3-073", "topic": "법·윤리", "q": "인물이 식별되는 사진을 광고에 사용할 때 반드시 확보해야 하는 것은?", "c": ["피촬영자의 동의(모델 릴리스)", "촬영 장비의 보증서", "인화지 영수증", "촬영 장소의 지도"], "a": 1, "e": "초상권은 본인의 동의 없이 얼굴이 공표되지 않을 권리다. 상업적 이용에는 서면 동의가 원칙이며, 미성년자는 보호자 동의가 필요하다.", "s": 3, "ch": 8}, {"id": "S3-074", "topic": "법·윤리", "q": "사진 저작권에 대한 설명으로 옳은 것은?", "c": ["피사체의 소유자에게 저작권이 있다", "인화한 사람에게 저작권이 있다", "사진에는 저작권이 발생하지 않는다", "촬영자가 창작한 사진에는 원칙적으로 촬영자에게 저작권이 있다"], "a": 4, "e": "저작권은 창작한 사람에게 생긴다. 다만 업무상 저작물이나 계약으로 권리를 넘긴 경우에는 달라질 수 있다.", "s": 3, "ch": 8}, {"id": "S3-075", "topic": "인물촬영", "q": "증명사진 촬영에서 지켜야 할 조건으로 옳지 않은 것은?", "c": ["배경은 균일하고 단순하게 한다", "좌우 조명을 고르게 하여 그늘을 줄인다", "얼굴에 강한 그림자를 만들어 입체감을 강조한다", "정면을 향하고 얼굴 전체가 가려지지 않게 한다"], "a": 3, "e": "증명사진은 식별이 목적이라 그림자를 최소화하고 얼굴을 고르게 밝혀야 한다. 극적인 조명은 목적에 어긋난다.", "s": 3, "ch": 8}, {"id": "S3-076", "topic": "제품촬영", "q": "금속 제품 촬영에서 표면에 조명과 주변 사물이 그대로 비칠 때의 대처로 가장 적절한 것은?", "c": ["셔터속도를 빠르게 한다", "큰 확산판이나 라이트 텐트로 둘러싸 반사면을 정리한다", "조명을 더 강한 직사광으로 바꾼다", "조리개를 최대로 개방한다"], "a": 2, "e": "금속은 주변을 그대로 반사하므로 무엇이 비치게 할지를 설계해야 한다. 라이트 텐트로 균일한 흰 면을 만들어 주는 것이 기본이다.", "s": 3, "ch": 8}, {"id": "S3-077", "topic": "촬영", "q": "건축물 외부를 촬영할 때 수직선이 위로 갈수록 모이는 것을 줄이는 방법으로 옳은 것은?", "c": ["카메라를 기울이지 않고 수평을 유지한 채 시프트 기능을 쓴다", "광각렌즈로 최대한 올려다보며 찍는다", "조리개를 최대로 개방한다", "셔터속도를 느리게 한다"], "a": 1, "e": "카메라를 위로 기울이면 필름면과 건물면이 어긋나 수직선이 수렴한다. 카메라를 수평으로 두고 렌즈를 위로 평행 이동시키면 해결된다.", "s": 3, "ch": 8}, {"id": "S3-078", "topic": "촬영", "q": "풍경 촬영에서 아침·저녁의 낮은 태양광이 주는 효과로 옳지 않은 것은?", "c": ["측광·사광이 되어 질감이 강조된다", "그림자가 짧아 평면적으로 보인다", "색온도가 낮아 따뜻한 색조를 띤다", "그림자가 길어 입체감이 살아난다"], "a": 2, "e": "그림자가 짧고 평면적으로 보이는 것은 태양이 높은 정오 무렵이다. 촬영에 좋은 시간대를 골든아워라 부르는 이유가 여기 있다.", "s": 3, "ch": 8}, {"id": "S3-079", "topic": "촬영기법", "q": "흐르는 물을 부드럽게 표현하려 할 때의 촬영 조건으로 옳은 것은?", "c": ["삼각대에 고정하고 ND 필터를 써서 느린 셔터속도로 촬영한다", "고감도로 올려 빠른 셔터속도로 촬영한다", "조리개를 개방하고 손으로 들고 찍는다", "플래시를 터뜨려 촬영한다"], "a": 1, "e": "물의 흐름을 담으려면 노출 시간이 길어야 한다. 낮에는 광량이 많아 ND 필터로 빛을 줄이고 삼각대로 흔들림을 막는다.", "s": 3, "ch": 8}, {"id": "S3-080", "topic": "촬영", "q": "스튜디오 인물 촬영에서 배경지와 피사체의 거리를 충분히 띄우는 이유로 가장 옳은 것은?", "c": ["조명의 색온도를 낮추기 위해", "셔터속도를 빠르게 하기 위해", "렌즈의 수차를 줄이기 위해", "피사체의 그림자가 배경에 지는 것을 막고 배경을 흐리게 하기 위해"], "a": 4, "e": "배경이 가까우면 그림자가 그대로 드리운다. 거리를 두면 그림자가 지지 않고 배경 조명을 따로 조절할 수 있다.", "s": 3, "ch": 8}, {"id": "S3-081", "topic": "카메라구조", "q": "미러리스 카메라가 일안 반사식(DSLR)과 다른 점으로 옳은 것은?", "c": ["반사경이 두 개 있다", "렌즈를 교환할 수 없다", "필름을 사용한다", "반사경과 광학 뷰파인더가 없어 센서 상을 화면으로 본다"], "a": 4, "e": "반사경이 없어 몸체가 작고 조용하며, 촬영 결과에 가까운 상을 미리 볼 수 있다. 대신 전자 뷰파인더는 전력을 더 쓴다.", "s": 3, "ch": 4}, {"id": "S3-082", "topic": "카메라구조", "q": "이안 반사식(TLR) 카메라의 특징으로 옳은 것은?", "c": ["보는 렌즈와 찍는 렌즈가 따로 있어 근접 촬영에서 시차가 생긴다", "반사경이 없어 상이 어둡다", "렌즈가 하나뿐이다", "상이 항상 정립으로 보인다"], "a": 1, "e": "위쪽 렌즈로 초점을 보고 아래 렌즈로 촬영한다. 위에서 내려다보는 웨이스트 레벨 파인더가 특징이며 상이 좌우 반대로 보인다.", "s": 3, "ch": 4}, {"id": "S3-083", "topic": "촬영모드", "q": "조리개 우선(A 또는 Av) 모드에 대한 설명으로 옳은 것은?", "c": ["셔터속도를 정하면 조리개를 맞춰 준다", "둘 다 카메라가 정한다", "둘 다 촬영자가 정한다", "조리개를 정하면 카메라가 셔터속도를 맞춰 준다"], "a": 4, "e": "심도를 우선 결정하고 싶을 때 쓴다. 반대로 동체를 멈추거나 흘리려면 셔터 우선(S·Tv)을, 완전히 통제하려면 수동(M)을 쓴다.", "s": 3, "ch": 4}, {"id": "S3-084", "topic": "촬영모드", "q": "움직임이 빠른 스포츠 장면에서 우선 고려해야 할 설정으로 가장 적절한 것은?", "c": ["수동 초점으로 미리 맞춰 두고 느린 셔터를 쓴다", "저감도로 낮추고 삼각대를 쓴다", "셔터 우선으로 빠른 셔터속도를 확보하고 필요하면 감도를 올린다", "조리개 우선으로 최대한 조인다"], "a": 3, "e": "동체 정지가 최우선이므로 셔터속도를 먼저 잡는다. 광량이 모자라면 조리개를 열거나 ISO를 올려 보완한다.", "s": 3, "ch": 4}, {"id": "S3-085", "topic": "초점", "q": "자동초점 방식 중 위상차 검출 방식의 특징으로 옳은 것은?", "c": ["어두운 곳에서만 동작한다", "수동으로만 쓸 수 있다", "초점이 어긋난 방향과 양을 한 번에 알아내 속도가 빠르다", "화면 어디서나 정밀하지만 느리다"], "a": 3, "e": "위상차는 빠르고 움직이는 피사체에 유리하다. 콘트라스트 검출은 대비가 최대가 되는 지점을 찾아가는 방식이라 정밀하지만 느리다.", "s": 3, "ch": 4}, {"id": "S3-086", "topic": "초점", "q": "다가오는 피사체를 계속 따라가며 초점을 맞추는 자동초점 모드는?", "c": ["수동초점(MF)", "고정초점", "연속 자동초점(AF-C, 컨티뉴어스)", "단일 자동초점(AF-S, 원샷)"], "a": 3, "e": "AF-C는 셔터를 반쯤 누른 동안 초점을 계속 갱신한다. 정지한 피사체에는 한 번 맞추고 고정하는 AF-S가 낫다.", "s": 3, "ch": 4}, {"id": "S3-087", "topic": "카메라관리", "q": "삼각대 사용법으로 옳지 않은 것은?", "c": ["높이를 올릴 때 가장 가는 다리 마디부터 먼저 뽑는다", "무게중심을 낮추기 위해 센터 폴은 되도록 늦게 올린다", "다리를 충분히 벌려 안정시킨다", "바람이 강하면 후크에 가방을 걸어 무게를 더한다"], "a": 1, "e": "굵은 마디부터 뽑아야 흔들림이 적다. 센터 폴을 높이 올리는 것은 가장 불안정한 상태다.", "s": 3, "ch": 4}, {"id": "S3-088", "topic": "카메라관리", "q": "추운 겨울철 야외 촬영에서 주의할 점으로 옳지 않은 것은?", "c": ["실내에 들어올 때는 가방에 넣은 채 온도가 오르기를 기다린다", "결로가 생겼다면 마를 때까지 전원을 켜지 않는다", "차가워진 카메라를 실내에 들어오자마자 가방에서 꺼내 바로 사용한다", "배터리 소모가 빨라지므로 여분을 품에 넣어 따뜻하게 둔다"], "a": 3, "e": "찬 기기를 따뜻한 실내에 그대로 노출하면 결로가 생겨 렌즈 내부와 전자부품에 물이 맺힌다. 가방 안에서 서서히 온도를 맞춰야 한다.", "s": 3, "ch": 4}, {"id": "S3-089", "topic": "카메라관리", "q": "장마철 렌즈 보관 방법으로 가장 적절한 것은?", "c": ["비닐로 밀봉해 냉장 보관한다", "방습함이나 건조제와 함께 습도가 낮은 곳에 둔다", "가죽 케이스에 넣어 밀폐된 서랍에 둔다", "베란다처럼 통풍이 되는 야외에 둔다"], "a": 2, "e": "습기가 차면 렌즈 안에 곰팡이가 슬어 되돌릴 수 없다. 40~50% 습도의 방습함 보관이 가장 안전하다.", "s": 3, "ch": 4}, {"id": "S3-090", "topic": "필터", "q": "UV 필터와 스카이라이트 필터에 대한 설명으로 옳은 것은?", "c": ["스카이라이트는 반사를 제거한다", "둘 다 흑백 전용이다", "둘 다 자외선을 줄이며, 스카이라이트는 옅은 분홍빛을 띠어 푸른 기를 덜어 준다", "UV 필터는 노출을 2스톱 늘려야 한다"], "a": 3, "e": "두 필터 모두 노출 보정이 거의 필요 없고 렌즈 보호용으로도 쓰인다. 다만 필터를 겹쳐 끼면 비네팅과 플레어가 생길 수 있다.", "s": 3, "ch": 4}, {"id": "S3-091", "topic": "필터", "q": "야경의 밝은 불빛에 십자 모양 빛줄기를 만들어 주는 필터는?", "c": ["UV 필터", "크로스 필터", "ND 필터", "편광 필터"], "a": 2, "e": "크로스(스타) 필터는 표면의 미세한 홈으로 빛을 갈라 낸다. 소프트 필터는 반대로 하이라이트를 번지게 해 부드러운 인상을 만든다.", "s": 3, "ch": 4}, {"id": "S3-092", "topic": "뷰카메라", "q": "뷰카메라에서 렌즈판을 앞뒤로 기울이는 틸트(tilt) 조작의 효과로 옳은 것은?", "c": ["화각을 넓힌다", "색수차를 없앤다", "초점이 맞는 면을 기울여 비스듬한 피사체 전체를 선명하게 할 수 있다", "화면의 밝기를 높인다"], "a": 3, "e": "샤임플러그 법칙을 이용한 조작이다. 조리개를 크게 조이지 않고도 앞에서 뒤까지 초점을 맞출 수 있다.", "s": 3, "ch": 4}, {"id": "S3-093", "topic": "조명", "q": "광원이 카메라 뒤쪽에서 피사체 정면을 비추는 순광의 특징으로 옳은 것은?", "c": ["색은 선명하지만 그림자가 적어 입체감과 질감이 약하다", "질감이 가장 잘 살아난다", "윤곽선이 강조된다", "실루엣이 만들어진다"], "a": 1, "e": "순광은 노출이 쉽고 색이 잘 나오지만 평면적이다. 질감은 옆에서 비추는 측광, 윤곽은 역광에서 살아난다.", "s": 3, "ch": 5}, {"id": "S3-094", "topic": "조명", "q": "제품 촬영에서 그림자를 없애고 배경과 자연스럽게 이어지게 하려 할 때 쓰는 촬영대는?", "c": ["라이트 테이블(무영 촬영대)", "리플렉터 보드", "배경 스탠드", "트라이포드"], "a": 1, "e": "반투명 아크릴 판 아래에서 빛을 올려 그림자를 지운다. 배경이 흰색으로 이어져 잘라내기도 쉬워진다.", "s": 3, "ch": 5}, {"id": "S3-095", "topic": "조명기구", "q": "카메라 렌즈 둘레에 고리 모양으로 배치해 그림자가 거의 없는 정면광을 주는 조명은?", "c": ["배경광", "헤어라이트", "링 라이트", "스누트"], "a": 3, "e": "접사와 인물 촬영에 쓰이며, 눈동자에 고리 모양 캐치라이트가 생기는 것이 특징이다.", "s": 3, "ch": 5}, {"id": "S3-096", "topic": "광원", "q": "텅스텐 조명을 주광용 설정에 맞추기 위해 조명 앞에 다는 색보정 젤은?", "c": ["CTO(주황 계열) 젤", "ND 젤", "확산 젤", "CTB(청색 계열) 젤"], "a": 4, "e": "CTB는 색온도를 올려 주광에 맞추고, CTO는 반대로 색온도를 낮춰 텅스텐에 맞춘다. 창으로 들어오는 빛과 실내등을 섞을 때 쓴다.", "s": 3, "ch": 5}, {"id": "S3-097", "topic": "라이팅", "q": "주광이 f/11, 보조광이 f/8 로 측정되었다면 조명비는?", "c": ["4:1 이다", "8:1 이다", "보조광이 주광보다 밝아 조명비 설정이 잘못되었다", "1:1 이다"], "a": 3, "e": "f값이 작을수록 밝다. 보조광이 주광보다 한 스톱 밝으면 주광과 보조광의 역할이 뒤바뀐 것이므로 조명 배치를 다시 잡아야 한다.", "s": 3, "ch": 5}, {"id": "S3-098", "topic": "광원", "q": "형광등 아래에서 촬영할 때 나타나기 쉬운 문제로 옳은 것은?", "c": ["그림자가 전혀 생기지 않는다", "녹색 기가 돌고, 빠른 셔터에서는 밝기가 고르지 않게 찍힐 수 있다", "붉은 기가 강하게 돈다", "항상 색온도가 2800K 로 일정하다"], "a": 2, "e": "형광등은 연색성이 낮아 녹색으로 치우치고, 교류 주기 때문에 깜빡인다. 마젠타 계열 보정과 다소 느린 셔터로 완화한다.", "s": 3, "ch": 5}, {"id": "S3-099", "topic": "구도", "q": "피사체를 아래에서 올려다보며 촬영하는 로우 앵글의 일반적인 효과는?", "c": ["색이 선명해진다", "피사체가 크고 위엄 있게 보인다", "피사체가 작고 귀엽게 보인다", "거리감이 사라진다"], "a": 2, "e": "하이 앵글은 반대로 대상을 작고 순해 보이게 한다. 아이 레벨은 가장 중립적이다.", "s": 3, "ch": 8}, {"id": "S3-100", "topic": "구도", "q": "인물 사진에서 가슴 위쪽까지 담는 프레이밍을 뜻하는 것은?", "c": ["니 샷", "익스트림 클로즈업", "바스트 샷", "풀 샷"], "a": 3, "e": "클로즈업은 얼굴, 바스트는 가슴까지, 웨이스트는 허리까지, 니 샷은 무릎까지, 풀 샷은 전신을 담는다.", "s": 3, "ch": 8}, {"id": "S3-101", "topic": "촬영계획", "q": "행사 촬영을 앞두고 준비할 사항으로 가장 거리가 먼 것은?", "c": ["실내 조도를 예상해 감도와 렌즈를 정한다", "현장에서 쓸 인화지의 호수를 미리 정한다", "배터리와 메모리카드를 여분까지 챙긴다", "식순과 주요 인물, 촬영 금지 구역을 확인한다"], "a": 2, "e": "인화지 선택은 암실 단계의 일이다. 행사 촬영은 다시 찍을 수 없으므로 장비 여유와 진행 정보 파악이 핵심이다.", "s": 3, "ch": 8}, {"id": "S3-102", "topic": "법·윤리", "q": "보도사진에서 지켜야 할 원칙으로 옳은 것은?", "c": ["배경의 불필요한 사람은 지워도 무방하다", "연출한 장면도 현장 사진으로 쓸 수 있다", "합성이나 요소의 추가·삭제로 사실을 바꾸어서는 안 된다", "보기 좋게 인물을 옮겨 붙여도 된다"], "a": 3, "e": "보도사진은 사실 기록이 생명이라 내용을 바꾸는 조작은 금지된다. 밝기·색 같은 기본 보정만 허용하는 것이 통례다.", "s": 3, "ch": 8}, {"id": "S3-103", "topic": "카메라구조", "q": "두 개의 렌즈로 시차를 만들어 입체감을 기록할 수 있는 카메라는?", "c": ["스테레오 카메라", "파노라마 카메라", "랜드 카메라", "스피드 그래픽"], "a": 1, "e": "사람의 두 눈처럼 조금 떨어진 두 시점에서 찍어 입체로 본다. 랜드 카메라는 폴라로이드 즉석 카메라를 말한다.", "s": 3, "ch": 4}, {"id": "S3-104", "topic": "카메라구조", "q": "뷰카메라처럼 무브먼트를 쓸 수 있으면서 야외 촬영을 위해 접어서 들고 다닐 수 있게 만든 카메라는?", "c": ["SLR 카메라", "TLR 카메라", "파노라마 카메라", "필드 카메라"], "a": 4, "e": "필드 카메라는 대형 카메라의 무브먼트를 유지하면서 휴대성을 높인 형태다. 스튜디오용 모노레일 뷰카메라보다 조작 범위는 좁다.", "s": 3, "ch": 4}, {"id": "S3-105", "topic": "뷰카메라", "q": "뷰카메라에서 프론트와 백을 연결하며 외부 빛을 차단하는 주름상자 구조는?", "c": ["그라운드글라스", "파인더", "포커싱레일", "벨로우즈"], "a": 4, "e": "벨로우즈는 신축이 자유로워 초점 조절과 접사 배율 확대에 쓰인다. 그라운드글라스는 상을 확인하는 초점판이다.", "s": 3, "ch": 4}, {"id": "S3-106", "topic": "뷰카메라", "q": "뷰카메라의 무브먼트 중 프론트와 백을 수직축을 중심으로 좌우로 비트는 조작은?", "c": ["라이즈(Rise)", "폴(Fall)", "스윙(Swing)", "틸트(Tilt)"], "a": 3, "e": "스윙은 수직축 회전, 틸트는 수평축 회전이다. 라이즈와 폴은 회전이 아니라 위아래 평행 이동이다.", "s": 3, "ch": 4}, {"id": "S3-107", "topic": "렌즈", "q": "렌즈를 통해 만들어지는 선명한 상의 원형 범위를 뜻하는 것은?", "c": ["플랜지백", "이미지 서클", "이미지 센서", "포컬 플레인"], "a": 2, "e": "이미지 서클이 화면보다 충분히 커야 뷰카메라의 무브먼트를 줄 수 있다. 좁으면 화면 모서리가 어두워지거나 잘린다.", "s": 3, "ch": 4}, {"id": "S3-108", "topic": "렌즈", "q": "초점거리를 변경할 수 없는 렌즈는?", "c": ["단렌즈", "줌렌즈", "TS렌즈", "고정조리개 렌즈"], "a": 1, "e": "단렌즈(단초점 렌즈)는 초점거리가 하나로 고정되어 있다. 대신 줌렌즈보다 밝고 화질이 좋은 경우가 많다.", "s": 3, "ch": 4}, {"id": "S3-109", "topic": "렌즈", "q": "색수차 보정을 목적으로 만든 렌즈에 해당하지 않는 것은?", "c": ["UD 렌즈(Ultra-low Dispersion)", "ED 렌즈(Extra-low Dispersion)", "매크로 렌즈(Macro Lens)", "아포크로매틱 렌즈(Apochromatic Lens)"], "a": 3, "e": "매크로는 근접 촬영용 렌즈다. 아포크로매틱·UD·ED는 파장별 굴절률 차이를 줄여 색수차를 억제하기 위한 설계다.", "s": 3, "ch": 4}, {"id": "S3-110", "topic": "조리개", "q": "조리개의 역할로 볼 수 없는 것은?", "c": ["피사계심도를 조절한다", "렌즈를 통과하는 빛의 양을 조절한다", "기록되는 상의 밝기를 균일하게 한다", "피사체의 운동감을 조절하여 동적인 표현을 한다"], "a": 4, "e": "운동감(정지·흐름)을 결정하는 것은 셔터속도다. 조리개는 광량과 심도, 그리고 주변부 화질을 담당한다.", "s": 3, "ch": 4}, {"id": "S3-111", "topic": "필터", "q": "하나의 피사체를 여러 개로 분할해 반복되어 보이게 하는 특수 효과 필터는?", "c": ["센터포커스 필터", "소프트 필터", "크로스 필터", "미라지 필터"], "a": 4, "e": "미라지(멀티이미지) 필터는 표면을 여러 면으로 깎아 상을 분할한다. 센터포커스는 가운데만 선명하게, 소프트는 전체를 부드럽게 만든다.", "s": 3, "ch": 4}, {"id": "S3-112", "topic": "노출계", "q": "TTL 노출 측정 방식에 대한 설명으로 옳은 것은?", "c": ["ND 필터를 사용할 때 필터 계수 값을 따로 계산해 보정해야 한다", "렌즈를 통과한 빛을 직접 측광하며 반사율 18%를 기준으로 한다", "대형 카메라에만 내장된 노출계이다", "피사체로 입사하는 빛의 양을 측정하는 방식이다"], "a": 2, "e": "TTL은 Through The Lens, 즉 촬영 렌즈를 지난 빛을 재는 반사식이다. 필터를 끼워도 그 빛을 그대로 재므로 계수를 따로 계산할 필요가 없다.", "s": 3, "ch": 4}, {"id": "S3-113", "topic": "촬영기법", "q": "소형 카메라에 100mm 망원렌즈를 물리고 패닝 기법으로 달리는 물체를 찍으려 할 때 가장 적절한 방법은?", "c": ["카메라를 피사체와 함께 회전시키며 1/30초로 촬영한다", "카메라를 고정하고 1/1000초로 촬영한다", "카메라를 고정하고 1/30초로 촬영한다", "카메라를 회전시키며 1/500초로 촬영한다"], "a": 1, "e": "패닝은 피사체를 따라 카메라를 돌리면서 느린 셔터를 쓴다. 셔터가 빠르면 배경도 멈춰 속도감이 사라지고, 카메라를 고정하면 피사체가 흐른다.", "s": 3, "ch": 8}, {"id": "S3-114", "topic": "촬영기법", "q": "릴리즈(Release)를 사용하는 주된 목적은?", "c": ["필름을 자동으로 감기 위해", "초점거리를 짧게 하기 위해", "초점거리를 길게 하기 위해", "셔터를 누를 때 생기는 카메라 흔들림을 막기 위해"], "a": 4, "e": "장노출이나 접사에서는 셔터 버튼을 누르는 힘만으로도 상이 흔들린다. 필름을 자동으로 감아 주는 장치는 모터드라이브다.", "s": 3, "ch": 8}, {"id": "S3-115", "topic": "촬영기법", "q": "와인딩 레버를 쓰지 않고 카메라에 장착해 필름을 자동으로 감아 주는 장치는?", "c": ["기어감속 모터", "모터드라이브", "모터 감속기", "모터 정속기"], "a": 2, "e": "모터드라이브는 연속 촬영 속도를 높여 스포츠·보도 촬영에 쓰였다. 디지털 카메라에서는 연사 기능이 그 역할을 한다.", "s": 3, "ch": 8}, {"id": "S3-116", "topic": "구도", "q": "인물 촬영에서 얼굴부터 허리까지를 담아 표정과 분위기를 함께 강조하는 샷은?", "c": ["웨이스트샷", "풀샷", "바스트샷", "니샷"], "a": 1, "e": "허리까지가 웨이스트샷, 가슴까지가 바스트샷, 무릎까지가 니샷, 전신이 풀샷이다. 얼굴을 화면에 가득 채우면 클로즈업이다.", "s": 3, "ch": 8}, {"id": "S3-117", "topic": "광원", "q": "광원에서 나온 빛이 비추는 면의 밝기, 즉 단위면적당 입사하는 광속을 뜻하는 것은?", "c": ["휘도", "광도", "감도", "조도"], "a": 4, "e": "조도는 럭스(lx)로 나타내며 면이 얼마나 밝게 비춰지는가를 말한다. 광도는 광원 자체의 세기, 휘도는 면이 눈에 얼마나 밝게 보이는가다.", "s": 3, "ch": 5}, {"id": "S3-118", "topic": "광원", "q": "전자플래시의 발광관에 주로 봉입되는 가스는?", "c": ["수은", "제논", "산소", "수소"], "a": 2, "e": "제논(크세논) 가스에 고압 방전을 일으켜 순간적으로 강한 빛을 낸다. 색온도가 주광에 가까운 것도 이 때문이다.", "s": 3, "ch": 5}, {"id": "S3-119", "topic": "광원", "q": "전기로 빛을 내는 발광다이오드 소자를 이용한 조명은?", "c": ["스트로보 조명", "HMI 조명", "LED 조명", "텅스텐 조명"], "a": 3, "e": "LED는 소비전력이 낮고 발열이 적으며 수명이 길다. HMI는 금속 증기 방전을 이용한 주광색 조명으로 영화·광고 촬영에 쓰인다.", "s": 3, "ch": 5}, {"id": "S3-120", "topic": "광원", "q": "LED 조명에 대한 설명으로 틀린 것은?", "c": ["조명 수명이 짧다", "전기로 빛을 발하는 발광다이오드 소자를 이용한다", "조명이 확산되어 부드러운 빛을 발산한다", "에너지 절약의 장점이 있다"], "a": 1, "e": "LED의 큰 장점 가운데 하나가 긴 수명이다. 다만 제품에 따라 연색성 차이가 커서 촬영용은 CRI 수치를 확인해야 한다.", "s": 3, "ch": 5}, {"id": "S3-121", "topic": "플래시", "q": "전자플래시 촬영에서 동조(Synchronization)가 뜻하는 것은?", "c": ["플래시의 발광과 동시에 필름이나 센서가 노출되는 것", "수중발레를 촬영한 사진", "사진전구를 쓰기 위한 전원 조절기", "플래시 촬영을 위해 설정한 B셔터"], "a": 1, "e": "셔터가 완전히 열린 순간에 플래시가 터져야 화면 전체가 고르게 노출된다. 이 타이밍을 맞추는 것이 동조다.", "s": 3, "ch": 5}, {"id": "S3-122", "topic": "플래시", "q": "전자플래시를 쓸 때 X접점의 스위치가 연결되는 시점은?", "c": ["셔터가 완전히 닫혔을 때", "셔터가 완전히 열렸을 때", "셔터가 열리기 직전", "셔터가 반 정도 열렸을 때"], "a": 2, "e": "X접점은 발광 지연이 거의 없는 전자플래시용 접점이다. 예열이 필요한 플래시벌브용으로는 M접점을 썼다.", "s": 3, "ch": 5}, {"id": "S3-123", "topic": "플래시", "q": "조명 용어에서 슬레이브(Slave)에 해당하는 것은?", "c": ["깔때기 모양으로 빛을 집중시키기 위한 장치", "광원을 면광원화하기 위한 반사판의 일종", "원격으로 셔터를 작동시키기 위해 카메라에 부착하는 장치", "다른 플래시에서 나오는 섬광을 감지하면 동시에 발광하는 플래시 장치"], "a": 4, "e": "슬레이브는 주 플래시의 발광을 감지해 따라 터진다. 케이블 없이 여러 등을 함께 쓸 때 편리하다.", "s": 3, "ch": 5}, {"id": "S3-124", "topic": "플래시", "q": "무선동조기에 대한 설명으로 옳은 것은?", "c": ["송신부를 Receiver라고 한다", "발신부를 Receiver라고 한다", "수신부를 Transmitter라고 한다", "송신부와 수신부의 채널을 동일하게 설정해야 한다"], "a": 4, "e": "카메라에 다는 쪽이 송신부(Transmitter), 플래시에 다는 쪽이 수신부(Receiver)다. 채널이 다르면 신호가 전달되지 않는다.", "s": 3, "ch": 5}, {"id": "S3-125", "topic": "조명기구", "q": "소형 전자플래시(Electronic Flash Light)의 특징이 아닌 것은?", "c": ["데이라이트 타입 필름용으로 사용할 수 없다", "기동성과 신속성이 좋다", "발광 지속시간이 매우 짧아 상이 흔들리지 않는다", "움직이는 피사체를 정지시켜 촬영할 때 적합하다"], "a": 1, "e": "전자플래시의 색온도는 약 5500K로 데이라이트 필름에 그대로 쓸 수 있다. 발광시간이 매우 짧아 동체를 얼려 세운다.", "s": 3, "ch": 5}, {"id": "S3-126", "topic": "조명기구", "q": "소프트박스에 대한 설명으로 옳은 것은?", "c": ["빛이 강해 강한 콘트라스트를 만든다", "빛을 집중적으로 모을 수 있다", "그림자의 경계를 뚜렷하게 만든다", "대표적인 확산장치이다"], "a": 4, "e": "광원의 면적을 넓혀 그림자를 부드럽게 하는 확산장치다. 빛을 모으는 것은 스누트나 그리드다.", "s": 3, "ch": 5}, {"id": "S3-127", "topic": "조명기구", "q": "여러 개의 등을 조명으로 사용할 때 상호 간섭이나 카메라 렌즈로 직접 들어오는 빛을 막아 주는 차단판은?", "c": ["스누트", "뷰티디시", "고보", "허니콤"], "a": 3, "e": "고보는 빛을 가리는 검은 판으로 플레어를 막는다. 허니콤과 스누트는 빛의 퍼짐 각도를 좁히는 부속, 뷰티디시는 접시형 반사판이다.", "s": 3, "ch": 5}, {"id": "S3-128", "topic": "조명", "q": "광선의 성질에 대한 설명으로 틀린 것은?", "c": ["산란광은 빛을 분산시켜 부드러운 윤곽선을 만든다", "직사광은 강한 하이라이트를 만들 때 효과적이다", "확산광원은 피사체의 크기에 비해 상대적으로 좁다", "직사광은 윤곽이 뚜렷하고 짙은 그림자를 만든다"], "a": 3, "e": "확산광원은 피사체보다 상대적으로 넓어야 그림자가 부드러워진다. 광원이 좁으면 직사광처럼 딱딱한 그림자가 생긴다.", "s": 3, "ch": 5}, {"id": "S3-129", "topic": "조명", "q": "자연광을 사용해 사진 촬영을 할 경우 주의할 사항으로 옳은 것은?", "c": ["같은 시간의 자연광 밝기는 언제나 똑같다", "자연광의 광질은 계절과 무관하다", "자연광은 언제나 같은 콘트라스트를 가진다", "자연광은 시간과 계절에 따라 광질이 변한다"], "a": 4, "e": "태양의 높이와 대기 상태에 따라 밝기·색온도·콘트라스트가 모두 달라진다. 그래서 촬영 시간대를 계획하는 일이 중요하다.", "s": 3, "ch": 5}, {"id": "S3-130", "topic": "조명", "q": "인공광에 대한 설명으로 틀린 것은?", "c": ["조명의 종류와 피사체의 거리에 따라 피사체에 비치는 빛을 조절할 수 있다", "스포트라이트는 방향성을 약화시켜 그림자가 거의 없는 사진을 만든다", "광원이 더 많이 확산될수록 빛은 더욱 부드러워지지 않는다", "피사체를 부드럽게 표현하려면 광원 앞에 흰 천 같은 디퓨저를 설치한다"], "a": 3, "e": "광원이 넓게 확산될수록 빛은 부드러워진다. 또 스포트라이트는 방향성이 강해 짙은 그림자를 만든다. 두 서술 모두 성질과 반대다.", "s": 3, "ch": 5}, {"id": "S3-131", "topic": "라이팅", "q": "인물 촬영에서 얼굴의 넓은 쪽에 빛이 오도록 하여 얼굴이 넓어 보이게 하는 조명 기법은?", "c": ["브로드 라이팅", "쇼트 라이팅", "하드 라이팅", "버터플라이 라이팅"], "a": 1, "e": "브로드는 카메라 쪽으로 향한 넓은 면을 밝혀 얼굴이 넓어 보이고, 쇼트는 반대로 좁은 면을 밝혀 갸름해 보인다.", "s": 3, "ch": 5}, {"id": "S3-132", "topic": "카메라관리", "q": "카메라 손질 방법으로 옳지 않은 것은?", "c": ["포컬플레인 셔터막이나 반사경은 붓솔로 가볍게 닦아 준다", "카메라와 렌즈는 가능한 한 분해하지 않는 것이 좋다", "렌즈 표면에 모래알처럼 커진 부분이 생기면 시너로 조심스럽게 닦는다", "렌즈 표면에 지문이나 기름때가 묻었을 때는 아세톤이나 벤젠으로 닦는다"], "a": 4, "e": "아세톤·벤젠 같은 강한 용제는 코팅과 접합제를 녹인다. 블로어로 먼지를 날린 뒤 전용 클리너와 페이퍼를 써야 한다.", "s": 3, "ch": 4}, {"id": "S3-133", "topic": "라이팅", "q": "인물 사진에서 눈동자에 맺히는 조명의 반사를 뜻하며, 인물을 생기 있어 보이게 하는 것은?", "c": ["캐치라이트", "림라이트", "백라이트", "키라이트"], "a": 1, "e": "캐치라이트가 없으면 눈이 흐리멍덩해 보인다. 반사판이나 링라이트로 만들어 주며 그 형태가 눈동자에 그대로 비친다.", "s": 3, "ch": 5}, {"id": "S3-134", "topic": "조명", "q": "인공조명으로 촬영할 때 피사체를 평면적이지 않게, 입체감 있게 표현하기에 가장 적절한 조명 방향은?", "c": ["바로 위", "45도 측면", "정면", "90도 측면"], "a": 2, "e": "45도 방향은 적당한 그림자로 입체감을 만든다. 정면광은 평면적이고, 90도 측면은 그림자가 지나치게 강해진다.", "s": 3, "ch": 5}, {"id": "S3-135", "topic": "조명", "q": "피사체에 생긴 그림자를 보고 알 수 있는 것으로 옳은 것은?", "c": ["광원의 방향과 높이, 그리고 광질을 짐작할 수 있다", "피사체의 색을 알 수 있다", "렌즈의 초점거리를 알 수 있다", "필름의 감도를 알 수 있다"], "a": 1, "e": "그림자가 지는 방향은 광원의 반대쪽이고, 길이는 광원의 높이를, 경계의 선명함은 광원의 크기와 거리를 알려 준다.", "s": 3, "ch": 5}, {"id": "S3-136", "topic": "조명", "q": "카메라의 색온도를 5500K로 설정하고 실내 백열등 아래에서 촬영했을 때 사진의 분위기로 옳은 것은?", "c": ["색이 빠진 회색 계열이 된다", "붉은 계열의 따뜻한 분위기가 된다", "차가운 푸른색 계열이 된다", "보라색 계열이 된다"], "a": 2, "e": "카메라가 주광을 기준으로 잡았는데 실제 광원은 색온도가 낮으므로 그 차이만큼 붉게 기록된다. 반대 경우에는 푸르게 나온다.", "s": 3, "ch": 5}, {"id": "S3-137", "topic": "카메라구조", "q": "삼각대 촬영에서 반사경이 올라갈 때 생기는 진동을 줄이기 위해 쓰는 기능은?", "c": ["연사", "자동 초점", "미러 업", "라이브 뷰 확대"], "a": 3, "e": "미러 업은 반사경을 먼저 올리고 잠시 뒤 셔터를 연다. 접사나 망원 장노출에서 효과가 크다.", "s": 3, "ch": 4}, {"id": "S3-138", "topic": "초점", "q": "라이브 뷰 화면을 확대해 수동으로 초점을 맞추는 방법이 특히 유용한 상황은?", "c": ["빠르게 움직이는 스포츠 촬영", "어두운 곳의 스냅 촬영", "연사로 찍는 행사 촬영", "삼각대에 고정한 접사나 정물 촬영"], "a": 4, "e": "움직임이 없는 피사체에서는 화면을 확대해 눈으로 확인하는 편이 가장 정확하다. 움직이는 피사체에는 위상차 자동초점이 유리하다.", "s": 3, "ch": 4}, {"id": "S3-139", "topic": "카메라관리", "q": "손떨림 보정 기능에 대한 설명으로 옳은 것은?", "c": ["카메라 흔들림은 줄여 주지만 피사체의 움직임은 멈추지 못한다", "피사체의 움직임까지 정지시켜 준다", "삼각대에 올렸을 때 반드시 켜야 한다", "조리개를 조이는 효과가 있다"], "a": 1, "e": "보정은 카메라 쪽 흔들림만 상쇄한다. 삼각대에서는 오히려 오작동할 수 있어 끄는 것이 권장되는 경우가 많다.", "s": 3, "ch": 4}, {"id": "S3-140", "topic": "카메라관리", "q": "이미지 센서에 먼지가 앉아 사진마다 같은 자리에 검은 점이 나올 때의 조치로 가장 적절한 것은?", "c": ["입으로 세게 불어 낸다", "조리개를 개방해 촬영해 가린다", "카메라의 센서 클리닝 기능을 쓰고, 필요하면 전용 도구나 서비스센터를 이용한다", "면봉에 알코올을 묻혀 문지른다"], "a": 3, "e": "센서는 매우 민감해 잘못 닦으면 코팅이 상한다. 렌즈 교환은 전원을 끄고 마운트를 아래로 향한 채 빠르게 하는 것이 예방책이다.", "s": 3, "ch": 4}, {"id": "S3-141", "topic": "안전·환경", "q": "스튜디오에서 조명 장비를 다룰 때의 안전 수칙으로 옳지 않은 것은?", "c": ["조명 스탠드는 다리를 충분히 벌리고 모래주머니로 고정한다", "문어발식 연결을 피하고 허용 전력을 확인한다", "촬영이 끝나면 뜨거운 등을 바로 손으로 잡아 정리한다", "전원 케이블은 통행로에 늘어놓지 않고 고정한다"], "a": 3, "e": "텅스텐 등은 촬영 직후 매우 뜨거워 화상 위험이 있다. 충분히 식힌 뒤 장갑을 끼고 정리한다.", "s": 3, "ch": 4}, {"id": "S3-142", "topic": "필터", "q": "렌즈 후드의 형태에 대한 설명으로 옳은 것은?", "c": ["후드 모양은 화각과 관계없다", "망원용은 꽃잎 모양이 원칙이다", "광각용은 꽃잎 모양으로 짧게, 망원용은 원통형으로 길게 만든다", "광각용일수록 길게 만든다"], "a": 3, "e": "화각이 넓을수록 후드가 화면에 걸리기 쉬워 짧고 화면 비율에 맞춘 꽃잎형을 쓴다. 화각이 좁은 망원은 길게 만들어 차광 효과를 높인다.", "s": 3, "ch": 4}, {"id": "S3-143", "topic": "촬영", "q": "실내 스포츠 촬영에 가장 적합한 장비와 설정으로 옳은 것은?", "c": ["밝은 망원렌즈에 높은 감도, 빠른 셔터속도와 연속 자동초점", "어두운 표준줌에 낮은 감도, 느린 셔터속도", "광각렌즈에 조인 조리개, 수동 초점 고정", "삼각대에 장노출과 저감도"], "a": 1, "e": "광량이 부족한 실내에서 동체를 멈추려면 밝은 렌즈와 높은 감도가 필요하다. 초점은 움직임을 따라가는 AF-C 로 둔다.", "s": 3, "ch": 8}, {"id": "S3-144", "topic": "촬영", "q": "건축물 외관을 촬영할 때 시간대 선택으로 가장 적절한 것은?", "c": ["해가 낮은 아침·저녁이나 하늘빛과 실내 조명이 균형을 이루는 시간", "해가 가장 높은 정오", "완전히 어두워진 한밤중", "비가 세차게 내리는 시간"], "a": 1, "e": "낮은 태양은 입체감을 만들고, 해 진 직후에는 하늘과 실내등의 밝기가 비슷해져 창이 예쁘게 살아난다.", "s": 3, "ch": 8}, {"id": "S3-145", "topic": "촬영", "q": "패션이나 광고 촬영에서 주로 쓰는 조명 구성으로 가장 적절한 것은?", "c": ["조명 없이 실내등만 사용한다", "카메라 내장 플래시만 사용한다", "조명 하나만 정면에 두고 촬영한다", "의도한 형태와 질감이 나오도록 주광·보조광·배경광을 계획해 배치한다"], "a": 4, "e": "상업 촬영은 결과가 정해져 있어 조명을 설계해 재현한다. 조명비와 배경 분리까지 미리 계산해 두는 것이 보통이다.", "s": 3, "ch": 8}, {"id": "S3-146", "topic": "촬영기법", "q": "슬라이드(리버설) 필름으로 촬영할 때 브라케팅을 특히 권하는 이유로 옳은 것은?", "c": ["현상 시간이 길어서", "감도가 매우 높아서", "색온도가 변하기 때문", "노출 관용도가 좁아 조금만 어긋나도 실패하기 때문"], "a": 4, "e": "리버설은 촬영한 필름이 곧 결과물이라 보정 여지가 없다. 적정 노출을 중심으로 ±1/2스톱씩 더 찍어 실패를 줄인다.", "s": 3, "ch": 8}]}], "chapters": [{"no": 1, "name": "사진의 역사"}, {"no": 2, "name": "광학의 기초"}, {"no": 3, "name": "색채의 기초"}, {"no": 4, "name": "사진장비 및 관리"}, {"no": 5, "name": "사진 조명"}, {"no": 6, "name": "디지털 이미지 프로세싱"}, {"no": 7, "name": "아날로그 사진"}, {"no": 8, "name": "사진 제작 계획과 촬영"}]};</script>

// 가져온 문항도 문제은행과 똑같이 다룰 수 있게 목록에 얹는다
Object.keys(store.imported).forEach(function(id){ BY_ID[id] = store.imported[id]; });
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {wrong:{}, history:[], topic:{}, seen:{}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ /* 저장이 막힌 환경(사생활 보호 모드 등)에서도 풀이는 계속된다 */ }
}

/* ---------- 풀던 시험 이어하기 ---------- */
function saveSession(){
  if(!session) return;
  try{
    localStorage.setItem(KEY_SESSION, JSON.stringify({
      ids: session.qs.map(function(q){ return q.id; }),
      ans: session.ans, flag: session.flag, idx: session.idx,
      mode: session.mode, kind: session.kind, instant: session.instant,
      limit: session.limit, left: session.left, at: today()
    }));
  }catch(e){}
}
function loadSaved(){
  try{
    var raw = localStorage.getItem(KEY_SESSION);
    if(!raw) return null;
    var v = JSON.parse(raw);
    var qs = (v.ids||[]).map(function(id){ return BY_ID[id]; }).filter(Boolean);
    if(qs.length !== (v.ids||[]).length || !qs.length) return null;   // 문제은행이 바뀐 경우
    v.qs = qs;
    return v;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(KEY_SESSION); }catch(e){}
}

/* ---------- 유틸 ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function pickFresh(pool, n){
  // 적게 나온 문제부터 뽑는다. 회차를 거듭하면 문제은행을 한 바퀴 돌게 된다.
  var mixed = shuffle(pool);
  mixed.sort(function(a,b){ return (store.seen[a.id]||0) - (store.seen[b.id]||0); });
  var taken = (n > 0 && n < mixed.length) ? mixed.slice(0, n) : mixed;
  return shuffle(taken);
}
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function today(){
  var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function mmss(sec){
  if(sec<0) sec=0;
  var m=Math.floor(sec/60), s=sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function saveViaLink(name, text){
  var blob = new Blob([text], {type:"text/markdown;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function download(name, text){
  // 파일로 열었을 때는 링크로 바로 내려받고,
  // 웹에 올려 둔 페이지에서는 뷰어에 저장을 요청한다.
  var body = "﻿" + text;
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(d){
      if(!d){ saveViaLink(name, body); return; }
      d.save({filename:name, data:body})["catch"](function(err){
        if(err && err.code === "declined") return;   // 사용자가 취소한 것은 실패가 아니다
        saveViaLink(name, body);
      });
    }, function(){ saveViaLink(name, body); });
    return;
  }
  saveViaLink(name, body);
}
function subjectName(n){
  if(!n) return "가져온 문항";
  var s = DATA.subjects.filter(function(x){ return x.no===n; })[0];
  return s ? s.no+"과목 "+s.name : n+"과목";
}
function chapterName(n){
  if(!n) return "가져온 문항";
  var c = (DATA.chapters||[]).filter(function(x){ return x.no===n; })[0];
  return c ? c.no+"장 "+c.name : n+"장";
}
function chapterQuestions(n){
  return ALL.filter(function(q){ return q.ch===n; });
}

function closeModal(){
  var old = document.querySelector(".overlay");
  if(old) old.remove();
}
function ask(opts){
  // opts: {title, body, actions:[{label, primary, act}], dismiss}
  closeModal();
  var ov = document.createElement("div");
  ov.className = "overlay";
  var box = document.createElement("div");
  box.className = "modal";
  box.setAttribute("role","dialog");
  box.setAttribute("aria-modal","true");
  var h = '<h2>'+esc(opts.title)+'</h2>';
  if(opts.body) h += '<div class="note">'+opts.body+'</div>';
  h += '<div class="actions"></div>';
  box.innerHTML = h;
  var actions = box.querySelector(".actions");
  opts.actions.forEach(function(a){
    var b = document.createElement("button");
    b.textContent = a.label;
    if(a.primary) b.className = "primary";
    b.onclick = function(){ closeModal(); if(a.act) a.act(); };
    actions.appendChild(b);
  });
  ov.appendChild(box);
  ov.onclick = function(e){ if(e.target === ov && opts.dismiss !== false) closeModal(); };
  document.body.appendChild(ov);
  var first = box.querySelector("button");
  if(first) first.focus();
}
function tell(title, body, act){
  ask({title:title, body:body, dismiss:false,
       actions:[{label:"확인", primary:true, act:act}]});
}

/* ---------- 세션 ---------- */
function begin(qs, opts){
  if(!qs.length){ tell("풀 문제가 없습니다", "먼저 문제를 풀어 오답을 쌓아 보세요."); return; }
  session = {
    qs: qs, idx: 0, ans: {}, flag: {},
    mode: opts.mode, kind: opts.kind || "", instant: !!opts.instant,
    limit: opts.limit || 0, left: opts.limit || 0
  };
  clearSession();
  startTimer();
  quiz();
}
function resume(saved){
  session = {
    qs: saved.qs, idx: saved.idx || 0, ans: saved.ans || {}, flag: saved.flag || {},
    mode: saved.mode, kind: saved.kind || "", instant: !!saved.instant,
    limit: saved.limit || 0, left: saved.left || 0
  };
  startTimer();
  quiz();
}

function startMock(kind){
  var qs;
  if(kind === "free"){
    qs = pickFresh(ALL, 60);                       // 과목 구분 없이 60문항
  }else{
    qs = [];
    DATA.subjects.forEach(function(s){             // 실제 시험처럼 과목당 20문항
      qs = qs.concat(pickFresh(s.questions, 20));
    });
  }
  begin(qs, {mode:"실전 모의고사", kind: kind || "exam", limit: MOCK_MIN*60});
}
function startPractice(no, cnt){
  var s = DATA.subjects.filter(function(x){ return x.no===no; })[0];
  begin(pickFresh(s.questions, cnt), {mode: s.no+"과목 연습", instant:true});
}
function startChapter(no, cnt){
  begin(pickFresh(chapterQuestions(no), cnt), {mode: no+"장 연습", instant:true});
}
function startReview(){
  var ids = Object.keys(store.wrong).filter(function(id){ return BY_ID[id]; });
  ids.sort(function(a,b){ return store.wrong[b].count - store.wrong[a].count; });
  begin(ids.map(function(id){ return BY_ID[id]; }).slice(0,40), {mode:"오답 다시 풀기", instant:true});
}

/* ---------- 풀이 화면 ---------- */
function quiz(){
  var q = session.qs[session.idx];
  var picked = session.ans[q.id];
  var revealed = session.instant && picked !== undefined;
  var done = Object.keys(session.ans).length;
  var h = "";

  h += '<div class="bar"><div class="spread" style="align-items:center">';
  h += '<div class="row"><span class="tag now">'+esc(session.mode)+'</span>';
  h += '<span class="tag">'+(session.idx+1)+' / '+session.qs.length+'</span>';
  h += '<span class="tag">'+esc(chapterName(q.ch))+'</span></div>';
  h += '<div class="row">';
  if(session.limit) h += '<span class="timer" id="timer">'+mmss(session.left)+'</span>';
  h += '<button id="btn-submit">채점</button><button id="btn-quit">나가기</button></div>';
  h += '</div><div class="meter"><i style="width:'+Math.round(done/session.qs.length*100)+'%"></i></div></div>';

  h += '<section class="card">';
  h += '<div class="spread" style="align-items:center"><span class="tag">'+esc(q.topic)+'</span>';
  h += '<button id="btn-flag">'+(session.flag[q.id]?"표시 지우기":"나중에 다시 보기")+'</button></div>';
  h += '<p class="qtext">'+esc(q.q)+'</p>';
  h += '<div class="choices">';
  for(var i=0;i<q.c.length;i++){
    var cls = "choice";
    if(revealed){
      if(i === q.a-1) cls += " right";
      else if(i === picked) cls += " wrong";
    }else if(picked === i){ cls += " sel"; }
    h += '<button class="'+cls+'" data-pick="'+i+'"><span class="num">'+CIRCLE[i]+'</span><span>'+esc(q.c[i])+'</span></button>';
  }
  h += '</div>';
  if(revealed){
    h += '<div class="exp"><b>정답 '+CIRCLE[q.a-1]+'</b><br>'+esc(q.e)+'</div>';
  }
  h += '</section>';

  h += '<div class="row">';
  h += '<button id="btn-prev" '+(session.idx===0?'disabled':'')+'>← 이전</button>';
  h += '<button id="btn-next" '+(session.idx===session.qs.length-1?'disabled':'')+'>다음 →</button>';
  h += '<span class="note keyhint">키보드 1~4 로 답 선택, ← → 로 이동</span></div>';

  h += '<section class="card"><div class="stack"><h2>문항 이동</h2>'
     + '<div class="note">푼 문항은 청록, 표시해 둔 문항은 앰버로 나타납니다</div></div>'
     + '<div class="sheet" id="nav"></div></section>';
  el("app").innerHTML = h;

  var out = "";
  session.qs.forEach(function(qq, i){
    var c = "";
    if(session.ans[qq.id] !== undefined) c += " done";
    if(session.flag[qq.id]) c += " flag";
    if(i === session.idx) c += " now";
    out += '<button class="'+c.trim()+'" data-go="'+i+'">'+(i+1)+'</button>';
  });
  var nav = el("nav");
  nav.innerHTML = out;
  nav.onclick = function(e){
    var t = e.target.closest("button[data-go]");
    if(t){ session.idx = parseInt(t.dataset.go,10); quiz(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function(b){
    b.onclick = function(){ pick(parseInt(b.dataset.pick,10)); };
  });
  el("btn-prev").onclick = function(){ if(session.idx>0){ session.idx--; quiz(); } };
  el("btn-next").onclick = function(){ if(session.idx<session.qs.length-1){ session.idx++; quiz(); } };
  el("btn-flag").onclick = function(){
    session.flag[q.id] = !session.flag[q.id]; saveSession(); quiz();
  };
  el("btn-submit").onclick = confirmGrade;
  el("btn-quit").onclick = function(){
    saveSession();
    ask({
      title: "풀던 문제를 어떻게 할까요?",
      body: "지금까지 " + Object.keys(session.ans).length + "문항을 풀었습니다. "
          + "저장해 두면 다음에 이 자리에서 이어서 풀 수 있습니다.",
      actions: [
        {label:"저장하고 나가기", primary:true, act:function(){ stopTimer(); session = null; home(); }},
        {label:"지우고 나가기", act:function(){ clearSession(); stopTimer(); session = null; home(); }},
        {label:"취소"}
      ]
    });
  };
}
function pick(i){
  var q = session.qs[session.idx];
  if(session.instant && session.ans[q.id] !== undefined) return;  // 해설이 보인 뒤에는 바꾸지 않는다
  session.ans[q.id] = i;
  if(!session.instant && session.idx < session.qs.length-1){ session.idx++; }
  saveSession();
  quiz();
}
document.addEventListener("keydown", function(e){
  if(!session) return;
  if(e.key >= "1" && e.key <= "4"){ pick(parseInt(e.key,10)-1); }
  else if(e.key === "ArrowLeft" && session.idx>0){ session.idx--; quiz(); }
  else if(e.key === "ArrowRight" && session.idx<session.qs.length-1){ session.idx++; quiz(); }
});
function confirmGrade(){
  var un = session.qs.length - Object.keys(session.ans).length;
  if(un > 0){
    ask({
      title: "아직 "+un+"문항이 남았습니다",
      body: "고르지 않은 문항은 오답으로 처리됩니다.",
      actions: [
        {label:"그래도 채점하기", primary:true, act:grade},
        {label:"돌아가서 마저 풀기"}
      ]
    });
    return;
  }
  grade();
}

/* ---------- 채점 ---------- */
function grade(){
  stopTimer();
  closeModal();
  clearSession();
  var res = [], correct = 0, perSub = {}, perTopic = {};
  session.qs.forEach(function(q){
    var picked = session.ans[q.id];
    var ok = (picked === q.a-1);
    if(ok) correct++;
    res.push({q:q, picked:picked, ok:ok});

    perSub[q.s] = perSub[q.s] || {c:0,t:0};
    perSub[q.s].t++; if(ok) perSub[q.s].c++;
    perTopic[q.topic] = perTopic[q.topic] || {c:0,t:0};
    perTopic[q.topic].t++; if(ok) perTopic[q.topic].c++;
    store.seen[q.id] = (store.seen[q.id]||0) + 1;
    store.topic[q.topic] = store.topic[q.topic] || {c:0,t:0};
    store.topic[q.topic].t++; if(ok) store.topic[q.topic].c++;

    if(ok){
      if(store.wrong[q.id]) delete store.wrong[q.id];   // 맞히면 오답노트에서 뺀다
    }else{
      var w = store.wrong[q.id] || {count:0, note:""};
      w.count++; w.last = today(); w.picked = picked;
      store.wrong[q.id] = w;
    }
  });
  var score = Math.round(correct / session.qs.length * 100);
  store.history.push({date: today(), mode: session.mode, score: score,
    correct: correct, total: session.qs.length});
  if(store.history.length > 60) store.history = store.history.slice(-60);
  save();
  result(res, correct, score, perSub, perTopic);
}

function result(res, correct, score, perSub, perTopic){
  var isMock = session.mode.indexOf("모의고사") >= 0;
  var passed = score >= PASS_MARK;
  var h = "";

  h += '<section class="card"><div class="spread"><div class="stack">';
  h += '<div class="eyebrow">'+esc(session.mode)+' 결과</div>';
  h += '<div class="score '+(passed?"pass":"fail")+'">'+score+'<span style="font-size:20px">점</span></div>';
  h += '<div class="note">'+session.qs.length+'문항 중 '+correct+'문항 정답</div>';
  if(isMock){
    h += '<div style="margin-top:4px"><span class="verdict '+(passed?"pass":"fail")+'">'
       + (passed ? "합격선 통과" : "합격까지 "+(PASS_MARK-score)+"점")+'</span></div>';
  }
  h += '</div><div class="row"><button class="primary" id="btn-again">한 번 더</button>'
     + '<button id="btn-home">처음으로</button></div></div></section>';

  if(Object.keys(perSub).length > 1){
    h += '<section class="card"><h2>과목별</h2><div class="tablewrap"><table>'
       + '<tr><th>과목</th><th class="n">정답</th><th class="n">정답률</th></tr>';
    Object.keys(perSub).sort().forEach(function(k){
      var v = perSub[k], p = Math.round(v.c/v.t*100);
      h += '<tr><td>'+esc(subjectName(parseInt(k,10)))+'</td><td class="n">'+v.c+' / '+v.t+'</td>'
         + '<td class="n '+(p<60?"fail":(p>=80?"pass":""))+'">'+p+'%</td></tr>';
    });
    h += '</table></div></section>';
  }

  var weak = Object.keys(perTopic).filter(function(k){ return perTopic[k].c < perTopic[k].t; });
  if(weak.length){
    weak.sort(function(a,b){ return (perTopic[a].c/perTopic[a].t) - (perTopic[b].c/perTopic[b].t); });
    h += '<section class="card"><div class="stack"><h2>이번에 약했던 분야</h2>'
       + '<div class="note">'+weak.slice(0,8).map(function(k){
             return esc(k)+" "+perTopic[k].c+"/"+perTopic[k].t; }).join("  ·  ")
       + '</div></div></section>';
  }

  var wrongs = res.filter(function(r){ return !r.ok; });
  h += '<section class="card"><div class="spread" style="align-items:center">'
     + '<h2>틀린 문제 '+wrongs.length+'개</h2>'
     + '<button id="btn-export">오답노트 내보내기</button></div>';
  if(!wrongs.length){
    h += '<div class="note">모두 맞혔습니다.</div>';
  }else{
    wrongs.forEach(function(r, n){
      var q = r.q;
      h += '<div class="wrongitem"><div class="row">'
         + '<span class="tag">'+esc(subjectName(q.s))+'</span>'
         + '<span class="tag">'+esc(chapterName(q.ch))+'</span>'
         + '<span class="tag">'+esc(q.topic)+'</span></div>';
      h += '<div style="font-weight:500">'+(n+1)+'. '+esc(q.q)+'</div><div>';
      for(var i=0;i<q.c.length;i++){
        var cls = "opt";
        var after = "";
        if(i === q.a-1){ cls += " is-right"; after = '<span class="after">정답</span>'; }
        else if(i === r.picked){ cls += " is-picked"; after = '<span class="after">내가 고른 답</span>'; }
        h += '<div class="'+cls+'"><span class="num">'+CIRCLE[i]+'</span>'+esc(q.c[i])+after+'</div>';
      }
      h += '</div>';
      if(r.picked === undefined) h += '<div class="note">답을 고르지 않았습니다.</div>';
      h += '<div class="exp">'+esc(q.e)+'</div></div>';
    });
  }
  h += '</section>';

  el("app").innerHTML = h;
  window.scrollTo(0,0);
  el("btn-home").onclick = home;
  el("btn-again").onclick = function(){
    if(session.mode.indexOf("모의고사")>=0) startMock(session.kind);
    else if(session.mode.indexOf("오답")>=0) startReview();
    else if(session.mode.indexOf("장 연습")>=0) startChapter(session.qs[0].ch, session.qs.length);
    else startPractice(session.qs[0].s, session.qs.length);
  };
  el("btn-export").onclick = function(){ exportNotes(wrongs.map(function(r){ return r.q.id; })); };
}

/* ---------- 오답노트 ---------- */
function notes(){
  stopTimer(); session = null;
  var ids = Object.keys(store.wrong).filter(function(id){ return BY_ID[id]; });
  ids.sort(function(a,b){
    var d = store.wrong[b].count - store.wrong[a].count;
    return d !== 0 ? d : a.localeCompare(b);
  });
  var h = '<header class="spread"><div class="stack"><div class="eyebrow">'+ids.length+'문항</div>'
        + '<h1>오답노트</h1></div><div class="row">'
        + '<button id="btn-import">불러오기(.md)</button>'
        + '<button id="btn-export">내보내기(.md)</button>'
        + '<button id="btn-home">처음으로</button></div></header>';
  h += '<div class="note">오답 다시 풀기에서 맞히면 목록에서 자동으로 빠집니다. '
     + '메모는 이 브라우저에 저장됩니다.<br>'
     + '내보낸 오답노트나 문제집 마크다운 파일을 <b>불러오기</b> 로 넣으면 '
     + '여기에서 보고 그대로 다시 풀 수 있습니다.</div>';
  if(!ids.length){
    h += '<section class="card"><div class="note">아직 틀린 문제가 없습니다.</div></section>';
  }
  ids.forEach(function(id){
    var q = BY_ID[id], w = store.wrong[id];
    h += '<section class="card"><div class="row">'
       + '<span class="tag">'+esc(chapterName(q.ch))+'</span><span class="tag">'+esc(q.topic)+'</span>'
       + '<span class="tag">'+w.count+'번 틀림</span><span class="tag">'+esc(w.last||"")+'</span></div>';
    h += '<div style="font-weight:500">'+esc(q.q)+'</div><div>';
    for(var i=0;i<q.c.length;i++){
      var cls = (i===q.a-1) ? "opt is-right" : "opt";
      var after = (i===q.a-1) ? '<span class="after">정답</span>' : "";
      h += '<div class="'+cls+'"><span class="num">'+CIRCLE[i]+'</span>'+esc(q.c[i])+after+'</div>';
    }
    h += '</div><div class="exp">'+esc(q.e)+'</div>';
    h += '<textarea rows="2" data-note="'+esc(id)+'" placeholder="왜 틀렸는지 내 말로 적어두기">'
       + esc(w.note||"")+'</textarea>';
    h += '<div class="row"><button data-del="'+esc(id)+'">이 문제 지우기</button></div></section>';
  });
  el("app").innerHTML = h;
  el("btn-home").onclick = home;
  el("btn-export").onclick = function(){ exportNotes(ids); };
  el("btn-import").onclick = pickMarkdownFile;
  Array.prototype.forEach.call(document.querySelectorAll("[data-note]"), function(t){
    t.onchange = function(){ store.wrong[t.dataset.note].note = t.value; save(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function(b){
    b.onclick = function(){
      var id = b.dataset.del;
      delete store.wrong[id];
      if(store.imported[id]){ delete store.imported[id]; delete BY_ID[id]; }
      save(); notes();
    };
  });
}

function exportNotes(ids){
  ids = ids.filter(function(id){ return BY_ID[id]; });
  var out = ["# 사진기능사 오답노트", "", "정리한 날짜: "+today(), "", "총 "+ids.length+"문항", ""];
  var bySub = {};
  ids.forEach(function(id){ (bySub[BY_ID[id].s] = bySub[BY_ID[id].s] || []).push(id); });
  Object.keys(bySub).sort().forEach(function(sn){
    out.push("## "+subjectName(parseInt(sn,10)));
    out.push("");
    bySub[sn].forEach(function(id){
      var q = BY_ID[id], w = store.wrong[id] || {};
      out.push("### ["+chapterName(q.ch)+" · "+q.topic+"] "+q.q);
      out.push("");
      q.c.forEach(function(c,i){ out.push("- "+CIRCLE[i]+" "+c+(i===q.a-1?"  **← 정답**":"")); });
      out.push("");
      out.push("> "+q.e);
      out.push("");
      if(w.count) out.push("- 틀린 횟수: "+w.count+"회 (마지막 "+(w.last||"")+")");
      out.push("- 내 메모: "+(w.note ? w.note : ""));
      out.push("- 문항번호: "+q.id);
      out.push("");
    });
  });
  download("사진기능사_오답노트.md", out.join("\n"));
}

/* ---------- 마크다운 불러오기 ---------- */
var CIRCLE_RE = /^[-*]\s*([①②③④]|[1-4][.)])\s*(.+)$/;

function parseMarkdown(text){
  // 내보낸 오답노트와 저장소의 단원별 문제집(.md) 두 형식을 모두 읽는다
  var blocks = text.split(/^###\s+/m).slice(1);
  var out = [];
  blocks.forEach(function(block){
    var lines = block.split(/\r?\n/);
    var head = (lines.shift() || "").trim();
    var topic = "", chapter = 0;

    var meta = head.match(/^\[([^\]]+)\]\s*(.*)$/);   // [4장 사진장비 및 관리 · 안전·환경] 문제
    if(meta){
      var tags = meta[1].split("·");
      var chMatch = (tags[0]||"").match(/(\d+)\s*장/);
      if(chMatch) chapter = parseInt(chMatch[1], 10);
      topic = (tags[1] || "").trim();
      head = meta[2].trim();
    }
    head = head.replace(/^\d+\.\s*/, "");             // "1. 문제" 형태의 번호 제거

    var choices = [], answer = 0, exp = "", note = "", count = 0, id = "";
    var afterAnswerLine = false;

    lines.forEach(function(raw){
      var line = raw.trim();
      if(!line) return;

      var c = line.match(CIRCLE_RE);
      if(c && choices.length < 4){
        var body = c[2];
        if(/←\s*\*{0,2}정답/.test(body) || /\*\*정답\*\*/.test(body)){
          answer = choices.length + 1;
        }
        choices.push(body.replace(/\s*\*{0,2}←?\s*\*{0,2}정답\*{0,2}\s*$/, "").trim());
        return;
      }
      var a = line.match(/\*\*정답\s*([①②③④])\*\*/);   // **정답 ④** 형식
      if(a){
        answer = "①②③④".indexOf(a[1]) + 1;
        var t = line.match(/분야:\s*([^·\s][^·]*)/);
        if(t && !topic) topic = t[1].trim();
        var ch2 = line.match(/(\d+)\s*장/);
        if(ch2 && !chapter) chapter = parseInt(ch2[1], 10);
        var i2 = line.match(/문항번호:\s*([A-Za-z0-9_-]+)/);
        if(i2) id = i2[1];
        afterAnswerLine = true;
        return;
      }
      if(line.indexOf("> ") === 0){ exp = (exp ? exp + " " : "") + line.slice(2).trim(); return; }
      var m;
      if((m = line.match(/^[-*]\s*문항번호:\s*(.+)$/))){ id = m[1].trim(); return; }
      if((m = line.match(/^[-*]\s*내\s*메모:\s*(.*)$/))){ note = m[1].trim(); return; }
      if((m = line.match(/^[-*]\s*틀린\s*횟수:\s*(\d+)/))){ count = parseInt(m[1], 10); return; }
      if(line === "</details>" || line.indexOf("<details") === 0 || line.indexOf("</summary>") >= 0) return;
      if(afterAnswerLine && !exp && line.indexOf("**") !== 0){ exp = line; }
    });

    if(head && choices.length === 4 && answer >= 1){
      out.push({id:id, q:head, c:choices, a:answer, e:exp || "해설이 없는 문항입니다.",
                topic: topic || "가져온 문항", chapter: chapter, note:note, count:count});
    }
  });
  return out;
}

function importMarkdown(text, filename){
  var parsed = parseMarkdown(text);
  if(!parsed.length){
    tell("읽을 수 있는 문항이 없습니다",
         "오답노트 내보내기로 만든 .md 파일이나, 저장소의 단원별 문제집 .md 파일을 넣어 주세요.");
    return;
  }
  var known = 0, added = 0, seq = 1;
  parsed.forEach(function(q){
    var id = q.id;
    if(id && BY_ID[id]){
      known++;                                   // 문제은행에 이미 있는 문항
    }else{
      if(!id || BY_ID[id]){                      // 번호가 없거나 겹치면 새로 붙인다
        while(BY_ID["IMP-" + seq]) seq++;
        id = "IMP-" + seq;
      }
      var item = {id:id, q:q.q, c:q.c, a:q.a, e:q.e, topic:q.topic, s:0, ch:q.chapter || 0};
      store.imported[id] = item;
      BY_ID[id] = item;
      added++;
    }
    var w = store.wrong[id] || {count:0, note:""};
    w.count = Math.max(w.count, q.count || 1);
    if(q.note) w.note = q.note;
    w.last = w.last || today();
    store.wrong[id] = w;
  });
  save();
  tell("불러왔습니다",
       esc(filename) + "<br>모두 " + parsed.length + "문항 · 문제은행에 있던 문항 " + known
       + "개, 새로 추가된 문항 " + added + "개<br>오답노트에 담았으니 바로 다시 풀 수 있습니다.",
       notes);
}

function pickMarkdownFile(){
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".md,.markdown,.txt,text/markdown,text/plain";
  input.onchange = function(){
    var f = input.files && input.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){ importMarkdown(String(reader.result || ""), f.name); };
    reader.onerror = function(){ tell("파일을 읽지 못했습니다", "다른 파일로 다시 시도해 주세요."); };
    reader.readAsText(f, "utf-8");
  };
  input.click();
}

/* ---------- 성적과 취약분야 ---------- */
function stats(){
  stopTimer(); session = null;
  var mocks = store.history.filter(function(r){ return r.mode.indexOf("모의고사")>=0; });
  var h = '<header class="spread"><div class="stack"><div class="eyebrow">기록</div>'
        + '<h1>성적과 취약분야</h1></div><div class="row">'
        + '<button id="btn-reset">기록 초기화</button><button id="btn-home">처음으로</button></div></header>';

  h += '<section class="card"><h2>모의고사</h2>';
  if(!mocks.length){
    h += '<div class="note">아직 모의고사 기록이 없습니다.</div>';
  }else{
    var best = Math.max.apply(null, mocks.map(function(r){ return r.score; }));
    var avg = Math.round(mocks.reduce(function(a,r){ return a+r.score; },0)/mocks.length);
    h += '<div class="note">응시 '+mocks.length+'회 · 평균 '+avg+'점 · 최고 '+best+'점</div>';
    h += '<div class="tablewrap"><table><tr><th>일시</th><th class="n">점수</th><th class="n">정답</th><th>판정</th></tr>';
    mocks.slice().reverse().slice(0,15).forEach(function(r){
      h += '<tr><td>'+esc(r.date)+'</td><td class="n">'+r.score+'</td>'
         + '<td class="n">'+r.correct+'/'+r.total+'</td>'
         + '<td class="'+(r.score>=PASS_MARK?"pass":"fail")+'">'
         + (r.score>=PASS_MARK?"합격권":"불합격")+'</td></tr>';
    });
    h += '</table></div>';
  }
  h += '</section>';

  var keys = Object.keys(store.topic).filter(function(k){ return store.topic[k].t >= 2; });
  keys.sort(function(a,b){ return (store.topic[a].c/store.topic[a].t) - (store.topic[b].c/store.topic[b].t); });
  h += '<section class="card"><div class="stack"><h2>분야별 정답률</h2>'
     + '<div class="note">정답률이 낮은 분야부터 보여 줍니다. 위쪽부터 공략하세요</div></div>';
  if(!keys.length){
    h += '<div class="note">문제를 조금 더 풀면 분야별 정답률이 쌓입니다.</div>';
  }else{
    h += '<div class="tablewrap"><table><tr><th>분야</th><th class="n">정답률</th><th class="n">푼 문항</th></tr>';
    keys.forEach(function(k){
      var v = store.topic[k], p = Math.round(v.c/v.t*100);
      h += '<tr><td>'+esc(k)+'</td><td class="n '+(p<60?"fail":(p>=80?"pass":""))+'">'+p+'%</td>'
         + '<td class="n">'+v.t+'</td></tr>';
    });
    h += '</table></div>';
  }
  h += '</section>';

  el("app").innerHTML = h;
  el("btn-home").onclick = home;
  el("btn-reset").onclick = function(){
    ask({
      title: "기록을 모두 지울까요?",
      body: "오답노트, 점수 기록, 풀어 본 문항 표시가 전부 사라집니다. 되돌릴 수 없습니다.",
      actions: [
        {label:"모두 지우기", primary:true, act:function(){
          Object.keys(store.imported).forEach(function(id){ delete BY_ID[id]; });
          store = {wrong:{}, history:[], topic:{}, seen:{}, imported:{}};
          save(); clearSession(); stats();
        }},
        {label:"취소"}
      ]
    });
  };
}

home();
})();
</script>
