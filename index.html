<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진기능사 문제은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 밝은 테마가 기준값. 다크는 토큰만 다시 정의한다. */
:root{
  --ground:#f1f1ef;        /* 18% 그레이카드에서 온 중립 무채색 */
  --surface:#fbfbfa;
  --raised:#ffffff;
  --line:#d9dad6;
  --line-soft:#e7e8e4;
  --ink:#1a1c1d;
  --ink-dim:#63676b;
  --accent:#0e6f7d;        /* 딥 시안 */
  --accent-ink:#ffffff;
  --accent-soft:#dceef1;
  --mark:#a8650a;          /* 그리스펜슬 앰버 - 나중에 다시 볼 표시 */
  --mark-soft:#f6ecda;
  --ok:#1c7a4d;
  --ok-soft:#dcefe4;
  --bad:#bb392c;
  --bad-soft:#f7e3e1;
  --shadow:0 1px 2px rgba(20,22,24,.06);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16181a;
    --surface:#1d2022;
    --raised:#23262a;
    --line:#33383c;
    --line-soft:#2a2e31;
    --ink:#e7e8e6;
    --ink-dim:#9aa0a4;
    --accent:#4fb3c4;
    --accent-ink:#0d1416;
    --accent-soft:#123037;
    --mark:#dda249;
    --mark-soft:#332a17;
    --ok:#5cc08c;
    --ok-soft:#16301f;
    --bad:#f08376;
    --bad-soft:#37201c;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#16181a; --surface:#1d2022; --raised:#23262a;
  --line:#33383c; --line-soft:#2a2e31;
  --ink:#e7e8e6; --ink-dim:#9aa0a4;
  --accent:#4fb3c4; --accent-ink:#0d1416; --accent-soft:#123037;
  --mark:#dda249; --mark-soft:#332a17;
  --ok:#5cc08c; --ok-soft:#16301f;
  --bad:#f08376; --bad-soft:#37201c;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.7;
}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 72px;display:flex;flex-direction:column;gap:16px}

/* 타이포 */
h1{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.35;margin:0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.note{color:var(--ink-dim);font-size:14px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 골격 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:4px}

/* 컨트롤 */
button{font:inherit;font-family:var(--sans);cursor:pointer;border-radius:4px;
  border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;
  transition:border-color .12s,background .12s}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.42;cursor:default}
button:disabled:hover{border-color:var(--line)}
select{font:inherit;font-family:var(--sans);padding:8px 10px;border-radius:4px;
  border:1px solid var(--line);background:var(--raised);color:var(--ink)}
textarea{width:100%;font:inherit;font-family:var(--sans);font-size:14px;padding:9px 10px;
  border-radius:4px;border:1px solid var(--line);background:var(--ground);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.tag{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:3px;padding:1px 7px;white-space:nowrap;background:var(--raised)}
.tag.now{color:var(--accent);border-color:var(--accent)}

/* 시험 바 */
.bar{position:sticky;top:0;z-index:5;background:var(--ground);
  padding:10px 0 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;
  letter-spacing:.02em;padding:2px 8px;border:1px solid var(--line);border-radius:3px;background:var(--raised)}
.timer.hurry{color:var(--bad);border-color:var(--bad)}
.meter{height:3px;background:var(--line-soft);overflow:hidden;border-radius:2px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* 문제 */
.qtext{font-size:18px;font-weight:500;line-height:1.65;margin:0;white-space:pre-wrap;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:7px}
.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 13px;background:var(--raised);line-height:1.6}
.choice .num{font-family:var(--mono);font-size:14px;color:var(--ink-dim);flex:0 0 auto;padding-top:1px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .num{color:var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .num{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .num{color:var(--bad)}
.exp{border-left:2px solid var(--accent);padding:2px 0 2px 13px;color:var(--ink-dim);font-size:14.5px}
.exp b{color:var(--ink)}

/* 문항 이동 - 컨택트시트 프레임 */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.sheet button{font-family:var(--mono);font-size:12px;padding:7px 0;text-align:center;
  border-radius:2px;color:var(--ink-dim)}
.sheet button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sheet button.flag{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.sheet button.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

/* 결과 */
.score{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.pass{color:var(--ok)}
.fail{color:var(--bad)}
.verdict{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.wrongitem{border-top:1px solid var(--line-soft);padding-top:14px;display:flex;flex-direction:column;gap:7px}
.opt{font-size:15px}
.opt .num{font-family:var(--mono);font-size:13px;color:var(--ink-dim);margin-right:7px}
.opt.is-right{color:var(--ok);font-weight:500}
.opt.is-picked{color:var(--bad)}
.after{font-family:var(--mono);font-size:11px;letter-spacing:.05em;margin-left:6px}

/* 확인창 - 샌드박스에서 막히는 시스템 창 대신 페이지 안에 그린다 */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(12,14,16,.55);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:20px;width:100%;max-width:430px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 10px 34px rgba(0,0,0,.28)}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.modal .actions button{flex:1 1 auto;min-width:110px}
@media (max-width:600px){ .keyhint{display:none} }

/* 표 */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:400}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
</style>
</head>

<script>window.EXAM_DATA = {"title": "사진기능사 필기 예상문제은행", "total": 398, "subjects": [{"no": 1, "name": "사진일반", "questions": [{"id": "S1-001", "topic": "사진사", "q": "카메라 옵스큐라(Camera Obscura)의 원리를 설명한 것으로 옳은 것은?", "c": ["은염의 감광성을 이용해 상을 고정한다", "렌즈의 색수차를 이용해 상을 분리한다", "빛의 직진성을 이용해 작은 구멍으로 들어온 상이 반대편에 거꾸로 맺힌다", "빛의 회절을 이용해 상을 확대한다"], "a": 3, "e": "카메라 옵스큐라는 '어두운 방'이라는 뜻으로, 빛의 직진성 때문에 작은 구멍을 통과한 빛이 반대편 벽에 상하좌우가 뒤집힌 상을 맺는 원리다. 감광재료가 없어 상을 고정하지는 못했고, 화가들의 밑그림 도구로 쓰였다.", "s": 1, "ch": 1}, {"id": "S1-002", "topic": "사진사", "q": "세계 최초의 사진술인 헬리오그래피(Heliography)에 대한 설명으로 틀린 것은?", "c": ["'태양의 그림'이라는 뜻을 가지고 있다", "감광재료로 유대역청(bitumen)을 사용하였다", "감광도가 높아 5초 정도의 짧은 노출로 촬영하였다", "니엡스가 발명하였다"], "a": 3, "e": "헬리오그래피는 유대역청을 백랍판에 발라 카메라 옵스큐라로 촬영한 니엡스의 사진술로, 노출에 8시간 이상이 걸릴 만큼 감광도가 매우 낮았다. 기출에 반복 출제되는 함정이 '노출시간이 짧았다'는 선택지다.", "s": 1, "ch": 1}, {"id": "S1-003", "topic": "사진사", "q": "다게레오타입(Daguerreotype)의 특징으로 옳지 않은 것은?", "c": ["네거티브를 이용해 여러 장을 복제할 수 있다", "상이 좌우 반대로 기록된다", "은판 위의 요오드화은을 감광재료로 사용한다", "수은 증기를 이용해 잠상을 현상한다"], "a": 1, "e": "다게레오타입은 은판에 직접 포지티브 상이 맺히는 직접 양화법이라 복제가 불가능했다. 네거티브-포지티브 방식으로 복제를 가능하게 한 것은 탤벗의 칼로타입이다.", "s": 1, "ch": 1}, {"id": "S1-004", "topic": "사진사", "q": "네거티브-포지티브 방식을 최초로 확립하여 한 장의 원판에서 여러 장을 인화할 수 있게 한 사진술은?", "c": ["헬리오그래피", "암브로타입", "칼로타입", "다게레오타입"], "a": 3, "e": "영국의 탤벗(W. H. F. Talbot)이 발표한 칼로타입(Talbotype)은 종이에 만든 네거티브에서 포지티브를 여러 장 뽑는 오늘날 사진의 기본 구조를 처음 세웠다.", "s": 1, "ch": 1}, {"id": "S1-005", "topic": "사진사", "q": "습판법(콜로디온 습판)에 대한 설명으로 옳은 것은?", "c": ["유제가 젖어 있는 동안 촬영과 현상을 끝내야 한다", "촬영 후 며칠이 지나도 현상 결과가 같다", "감광재료로 젤라틴을 사용한다", "유제가 마른 뒤에 촬영해야 감도가 높아진다"], "a": 1, "e": "아처가 발명한 콜로디온 습판법은 유리판에 콜로디온 유제를 바른 뒤 마르기 전에 촬영·현상까지 마쳐야 했다. 그래서 촬영 현장에 암실을 끌고 다녀야 하는 불편이 있었고, 이를 해결한 것이 매독스의 젤라틴 건판이다.", "s": 1, "ch": 1}, {"id": "S1-006", "topic": "사진사", "q": "젤라틴 건판(dry plate)의 등장이 사진에 가져온 변화로 가장 거리가 먼 것은?", "c": ["컬러 사진의 상업적 대량 생산이 시작되었다", "미리 만들어 두었다가 나중에 촬영할 수 있게 되었다", "감도가 높아져 손에 들고 찍는 촬영이 가능해졌다", "촬영 현장에 암실을 가지고 다닐 필요가 없어졌다"], "a": 1, "e": "건판은 보관·휴대성과 감도를 크게 높여 스냅 촬영을 가능하게 했다. 컬러 사진의 대량 보급은 1930년대 코다크롬 이후의 일이다.", "s": 1, "ch": 1}, {"id": "S1-007", "topic": "사진사", "q": "'버튼만 누르세요, 나머지는 우리가 합니다'라는 광고와 함께 롤필름 카메라를 보급하여 사진의 대중화를 이끈 인물은?", "c": ["오스카 바르낙", "에드윈 랜드", "루이 다게르", "조지 이스트먼"], "a": 4, "e": "조지 이스트먼은 롤필름과 코닥 카메라를 내놓아 전문가의 기술이던 사진을 일반인의 취미로 바꾸었다.", "s": 1, "ch": 1}, {"id": "S1-008", "topic": "사진사", "q": "35mm 소형 카메라(라이카)를 개발하여 소형 카메라 시대를 연 사람은?", "c": ["프레드릭 아처", "리처드 매독스", "오스카 바르낙", "윌리엄 탤벗"], "a": 3, "e": "라이츠사의 오스카 바르낙이 영화용 35mm 필름을 사진에 응용해 라이카를 만들었다. 작고 가벼워 보도·다큐멘터리 사진의 발전에 결정적 역할을 했다.", "s": 1, "ch": 1}, {"id": "S1-009", "topic": "사진사", "q": "촬영 후 즉시 사진을 볼 수 있는 즉석사진(인스턴트 사진) 방식을 개발한 사람은?", "c": ["니세포르 니엡스", "에드워드 머이브리지", "에드윈 랜드", "조지 이스트먼"], "a": 3, "e": "폴라로이드사의 에드윈 랜드가 1947년 즉석사진 시스템을 발표했다. 카메라 안에서 현상·정착·전사가 한꺼번에 이루어진다.", "s": 1, "ch": 1}, {"id": "S1-010", "topic": "사진사", "q": "달리는 말의 네 발이 모두 공중에 뜨는 순간을 연속 촬영으로 증명하여 동체 사진의 기초를 놓은 사람은?", "c": ["앤설 애덤스", "에드워드 머이브리지", "앙리 카르티에 브레송", "알프레드 스티글리츠"], "a": 2, "e": "머이브리지는 여러 대의 카메라를 늘어놓아 말의 보행을 연속 촬영했고, 이는 훗날 영화의 원리로 이어졌다.", "s": 1, "ch": 1}, {"id": "S1-011", "topic": "빛의 성질", "q": "빛의 성질에 대한 설명 중 틀린 것은?", "c": ["진동수가 변하지 않고 빛이 되돌아오는 현상을 반사라 한다", "빛은 균일한 매질 속에서 회절한다", "입사광에 대한 반사광의 비를 반사율이라 한다", "직진하는 빛이 다른 매질을 만나면 경계면에서 반사 또는 굴절한다"], "a": 2, "e": "회절은 빛이 장애물의 모서리나 좁은 틈을 만났을 때 그 뒤로 돌아 들어가는 현상이다. 균일한 매질 속에서 빛은 직진한다.", "s": 1, "ch": 2}, {"id": "S1-012", "topic": "빛의 성질", "q": "맑은 날 하늘이 파랗게 보이는 이유로 옳은 것은?", "c": ["대기가 파란색 색소를 포함하고 있기 때문", "장파장의 빛이 대기에서 더 많이 굴절되기 때문", "태양광 자체가 푸른색이기 때문", "대기 중 입자에 의해 단파장의 빛이 더 많이 산란되기 때문"], "a": 4, "e": "공기 분자에 의한 산란(레일리 산란)은 파장이 짧을수록 강해서 파란빛이 하늘 전체로 퍼진다. 반대로 해가 낮게 뜬 아침·저녁에는 빛이 대기를 길게 통과하며 단파장이 걸러져 붉게 보인다.", "s": 1, "ch": 2}, {"id": "S1-013", "topic": "빛의 성질", "q": "사람의 눈으로 볼 수 있는 가시광선의 파장 범위로 가장 적합한 것은?", "c": ["약 380~780nm", "약 100~380nm", "약 780~1400nm", "약 1~100nm"], "a": 1, "e": "가시광선은 대략 380nm(보라)에서 780nm(빨강)까지다. 그보다 짧으면 자외선, 길면 적외선이다.", "s": 1, "ch": 2}, {"id": "S1-014", "topic": "빛의 성질", "q": "태양광을 프리즘으로 분산시킬 때 굴절률이 가장 큰 광선은?", "c": ["녹색", "빨강", "보라", "노랑"], "a": 3, "e": "파장이 짧을수록 굴절률이 크다. 따라서 스펙트럼에서 보라가 가장 많이 꺾이고 빨강이 가장 적게 꺾인다.", "s": 1, "ch": 2}, {"id": "S1-015", "topic": "빛의 성질", "q": "점광원에서 나온 빛에서 광원과 피사체의 거리가 2배가 되면 피사체가 받는 빛의 세기는?", "c": ["변하지 않는다", "1/4로 줄어든다", "1/2로 줄어든다", "1/8로 줄어든다"], "a": 2, "e": "빛의 세기는 거리의 제곱에 반비례한다(역제곱 법칙). 거리가 2배면 1/4, 3배면 1/9이 된다. 노출로는 거리 2배가 2스톱 감소에 해당한다.", "s": 1, "ch": 2}, {"id": "S1-016", "topic": "빛의 성질", "q": "거울처럼 매끄러운 면에서 입사각과 반사각이 같게 빛이 되돌아오는 현상은?", "c": ["정반사", "난반사", "확산반사", "전반사"], "a": 1, "e": "매끄러운 면에서는 정반사가 일어나 빛이 한 방향으로 몰려 하이라이트가 생긴다. 거친 면에서는 난반사(확산반사)가 일어나 어느 방향에서 보아도 밝기가 비슷하다.", "s": 1, "ch": 2}, {"id": "S1-017", "topic": "빛의 성질", "q": "일반적인 사진 촬영에서 빛의 굴절과 반사의 영향을 가장 크게 받는 피사체는?", "c": ["고무 제품", "종이 제품", "유리 제품", "나무 제품"], "a": 3, "e": "투명하고 표면이 매끄러운 유리는 투과·굴절·정반사가 함께 일어나 촬영이 까다롭다. 이런 피사체에는 확산광이나 편광 필터를 쓴다.", "s": 1, "ch": 2}, {"id": "S1-018", "topic": "빛의 성질", "q": "물체가 특정 파장의 빛을 흡수하고 나머지를 반사하기 때문에 색으로 보인다고 할 때, 빨간 사과가 빨갛게 보이는 이유는?", "c": ["단파장 계열의 빛을 반사하기 때문", "빛을 전혀 반사하지 않기 때문", "장파장 계열의 빛을 반사하고 나머지를 흡수하기 때문", "모든 파장의 빛을 고르게 반사하기 때문"], "a": 3, "e": "물체색은 반사(또는 투과)한 빛의 파장으로 결정된다. 빨간 사과는 장파장(적색)을 반사하고 나머지는 흡수한다. 모든 파장을 고르게 반사하면 흰색, 모두 흡수하면 검정이다.", "s": 1, "ch": 2}, {"id": "S1-019", "topic": "빛의 성질", "q": "광원의 성질을 나타내는 빛의 3요소로 묶인 것은?", "c": ["광량, 색온도, 노출", "명도, 채도, 색상", "직진, 반사, 굴절", "광량, 광질, 빛의 방향"], "a": 4, "e": "사진 조명에서 다루는 빛의 3요소는 얼마나 밝은가(광량), 어떤 성질인가(직사광·확산광 등 광질), 어디에서 오는가(방향)이다.", "s": 1, "ch": 2}, {"id": "S1-020", "topic": "색온도", "q": "색온도(color temperature)에 대한 설명으로 틀린 것은?", "c": ["색온도는 날씨나 시간에 관계없이 일정하다", "단위는 K(켈빈)로 표시한다", "붉은 계열의 광원은 색온도가 낮다", "푸른 계열의 광원은 색온도가 높다"], "a": 1, "e": "색온도는 광원의 종류·시간·날씨에 따라 계속 변한다. 촛불 약 1800K, 백열전구 약 2800~3200K, 주광 약 5500K, 흐린 날 그늘 7000K 이상으로 올라간다.", "s": 1, "ch": 3}, {"id": "S1-021", "topic": "색채", "q": "빛의 3원색(가산혼합의 3원색)으로 옳은 것은?", "c": ["빨강, 초록, 파랑", "시안, 마젠타, 노랑", "빨강, 노랑, 파랑", "흰색, 검정, 회색"], "a": 1, "e": "빛의 3원색은 R(빨강)·G(초록)·B(파랑)이다. 색료의 3원색은 C(시안)·M(마젠타)·Y(노랑)로, 사진 인화와 인쇄에서 쓰인다.", "s": 1, "ch": 3}, {"id": "S1-022", "topic": "색채", "q": "가산혼합의 세 원색을 모두 같은 양으로 혼합하면 어떤 색이 되는가?", "c": ["노랑", "마젠타", "흰색", "검정"], "a": 3, "e": "빛은 더할수록 밝아진다. R+G+B=흰색이며, R+G=노랑, G+B=시안, B+R=마젠타가 된다. 반대로 색료 3원색을 모두 섞으면 검정에 가까워진다(감산혼합).", "s": 1, "ch": 3}, {"id": "S1-023", "topic": "색채", "q": "빛의 3원색과 색료의 3원색이 서로 보색 관계로 옳게 짝지어진 것은?", "c": ["파랑(Blue) - 빨강(Red)", "초록(Green) - 마젠타(Magenta)", "빨강(Red) - 노랑(Yellow)", "파랑(Blue) - 시안(Cyan)"], "a": 2, "e": "보색 쌍은 빨강↔시안, 초록↔마젠타, 파랑↔노랑이다. 컬러 인화의 색보정도 이 관계를 이용한다.", "s": 1, "ch": 3}, {"id": "S1-024", "topic": "색채", "q": "감산혼합(색료혼합)에 대한 설명으로 옳은 것은?", "c": ["색을 섞을수록 명도가 높아진다", "3원색을 모두 섞으면 흰색이 된다", "컬러 TV와 모니터가 이 방식을 사용한다", "색을 섞을수록 명도가 낮아진다"], "a": 4, "e": "감산혼합은 물감·잉크·필름의 색소처럼 빛을 흡수하는 방식이라 섞을수록 어두워진다. 모니터·무대조명은 가산혼합이다.", "s": 1, "ch": 3}, {"id": "S1-025", "topic": "색채", "q": "색의 3속성으로 옳게 묶인 것은?", "c": ["색상, 명도, 보색", "색상, 명도, 채도", "색상, 채도, 순도", "명도, 순도, 휘도"], "a": 2, "e": "색의 3속성은 색상(Hue)·명도(Value)·채도(Chroma)다. 무채색은 명도만 가지며, 유채색은 세 속성을 모두 가진다.", "s": 1, "ch": 3}, {"id": "S1-026", "topic": "색채", "q": "무채색이 가지고 있는 성질이 아닌 것은?", "c": ["명도만 가지고 있다", "검정, 회색, 흰색을 말한다", "반사율이 낮을수록 검정에 가까워진다", "빨강, 초록, 파랑을 포함한다"], "a": 4, "e": "무채색은 색상과 채도가 없고 명도만 있는 색이다. 빨강·초록·파랑은 색상이 있는 유채색이다.", "s": 1, "ch": 3}, {"id": "S1-027", "topic": "색채", "q": "먼셀 표색계의 5가지 기본 색상으로 옳은 것은?", "c": ["빨강, 노랑, 파랑, 흰색, 검정", "주황, 보라, 노랑, 자주, 연두", "시안, 마젠타, 노랑, 검정, 흰색", "빨강, 노랑, 초록, 파랑, 보라"], "a": 4, "e": "먼셀의 5주요색은 R·Y·G·B·P이고, 그 사이에 YR·GY·BG·PB·RP를 넣어 10색상으로 나눈다. 표기는 H V/C(예: 5R 4/14) 형식이다.", "s": 1, "ch": 3}, {"id": "S1-028", "topic": "색채", "q": "먼셀 기호 '5R 4/14'에서 숫자 14가 뜻하는 것은?", "c": ["색상 번호", "반사율", "채도", "명도"], "a": 3, "e": "먼셀 표기는 색상 명도/채도 순이다. 5R은 색상, 4는 명도, 14는 채도를 뜻한다.", "s": 1, "ch": 3}, {"id": "S1-029", "topic": "색채", "q": "국제조명위원회(CIE)가 제정한 것으로, 측색·표색기호·색명 등 색을 객관적 수치로 표시하는 색체계는?", "c": ["NCS 표색계", "오스트발트 표색계", "CIE 표색계", "PCCS 표색계"], "a": 3, "e": "CIE 표색계는 빛의 삼자극치(X, Y, Z)를 바탕으로 색을 수치로 나타내는 혼색계다. 반면 먼셀·NCS 등은 색표를 기준으로 하는 현색계다.", "s": 1, "ch": 3}, {"id": "S1-030", "topic": "색채", "q": "유행색이 아닌 보편적인 자연색을 기본으로, 인간이 색을 어떻게 지각하는가에 기초한 심리적 혼합비를 나타낸 표색계는?", "c": ["먼셀 표색계", "오스트발트 표색계", "NCS 표색계", "PCCS 표색계"], "a": 3, "e": "NCS(Natural Color System)는 흰색·검정과 노랑·빨강·파랑·초록의 6가지 심리 원색을 기준으로, 사람이 느끼는 비율로 색을 기술한다.", "s": 1, "ch": 3}, {"id": "S1-031", "topic": "색채", "q": "어떤 색을 본 뒤 잠시 후 다른 색을 볼 때 먼저 본 색의 영향으로 나중 색이 다르게 보이는 현상은?", "c": ["면적대비", "계시대비", "동시대비", "연변대비"], "a": 2, "e": "시간차를 두고 일어나므로 계시대비(연속대비)라 한다. 두 색을 나란히 놓고 동시에 볼 때 생기는 것은 동시대비다.", "s": 1, "ch": 3}, {"id": "S1-032", "topic": "색채", "q": "두 색이 맞닿은 경계 부분에서 대비가 더 강하게 느껴지는 현상은?", "c": ["한난대비", "보색대비", "연변대비", "면적대비"], "a": 3, "e": "연변대비는 경계선 부근에서 밝은 쪽은 더 밝게, 어두운 쪽은 더 어둡게 보이는 현상이다. 회색 계단을 나란히 놓았을 때 잘 나타난다.", "s": 1, "ch": 3}, {"id": "S1-033", "topic": "색채", "q": "색의 명시성(明視性)에 관한 설명 중 옳은 것은?", "c": ["검정 바탕의 노랑 글씨는 명시성이 가장 낮다", "명도 차이에 가장 큰 영향을 받는다", "색상 차이에 가장 큰 영향을 받는다", "주위 색과 관계없이 독립적으로 결정된다"], "a": 2, "e": "명시성(눈에 잘 띄는 정도)은 배경과의 명도 차가 가장 크게 좌우한다. 검정 바탕에 노랑이 명시성이 가장 높은 조합으로 알려져 안전표지에 쓰인다.", "s": 1, "ch": 3}, {"id": "S1-034", "topic": "색채", "q": "같은 크기·거리에서 실제보다 크고 가깝게 보이는 색의 성질로 옳은 것은?", "c": ["색과 진출감은 관계가 없다", "명도가 높은 난색 계열이 진출·팽창해 보인다", "명도가 낮은 한색 계열이 진출·팽창해 보인다", "채도가 낮을수록 진출해 보인다"], "a": 2, "e": "빨강·주황처럼 따뜻하고 밝은 색은 진출·팽창색, 파랑·청록처럼 차고 어두운 색은 후퇴·수축색으로 느껴진다.", "s": 1, "ch": 3}, {"id": "S1-035", "topic": "색채", "q": "하나의 순색에 무채색을 섞을 때 일어나는 변화로 옳은 것은?", "c": ["색상이 반대로 바뀐다", "명도만 변하고 채도는 그대로다", "채도가 낮아진다", "채도가 높아진다"], "a": 3, "e": "순색은 채도가 가장 높은 상태다. 흰색·회색·검정 등 무채색을 섞을수록 탁해지며 채도가 떨어진다.", "s": 1, "ch": 3}, {"id": "S1-036", "topic": "색채", "q": "파장이 가장 긴 색은?", "c": ["빨강", "노랑", "녹색", "파랑"], "a": 1, "e": "가시광선은 보라(단파장)에서 빨강(장파장) 순으로 파장이 길어진다. 파장이 길수록 굴절률과 산란은 작아진다.", "s": 1, "ch": 3}, {"id": "S1-037", "topic": "색채", "q": "오스트발트 표색계의 기본 구성으로 옳은 것은?", "c": ["백색량, 흑색량, 순색량의 합이 항상 100이 되도록 구성한다", "색상, 명도, 채도를 각각 독립된 축으로 구성한다", "빛의 삼자극치로 색을 수치화한다", "일본색채연구소가 배색 교육용으로 만들었다"], "a": 1, "e": "오스트발트 표색계는 W(백색량)+B(흑색량)+C(순색량)=100이라는 혼합비로 색을 나타낸다. 배색 교육용으로 만든 것은 PCCS다.", "s": 1, "ch": 3}, {"id": "S1-038", "topic": "색채", "q": "색의 온도감에 대한 설명으로 틀린 것은?", "c": ["녹색과 보라는 중성색으로 분류한다", "채도가 온도감을 결정하는 가장 큰 요인이다", "빨강·주황 계열은 따뜻하게 느껴진다", "파랑·청록 계열은 차갑게 느껴진다"], "a": 2, "e": "온도감을 좌우하는 가장 큰 요인은 색상이다. 장파장 계열은 난색, 단파장 계열은 한색으로 느껴진다.", "s": 1, "ch": 3}, {"id": "S1-039", "topic": "색채", "q": "조명이 달라져도 물체의 색을 원래 색으로 인지하는 시각의 성질은?", "c": ["푸르키녜 현상", "색순응(항상성)", "연색성", "조건등색"], "a": 2, "e": "백열등 아래에서도 흰 종이를 희다고 느끼는 것이 색순응(색의 항상성)이다. 반면 필름은 순응하지 못해 색온도 보정이 필요하다.", "s": 1, "ch": 3}, {"id": "S1-040", "topic": "색채", "q": "분광분포가 다른 두 색이 특정 광원 아래에서는 같은 색으로 보이다가 광원이 바뀌면 다르게 보이는 현상은?", "c": ["보색잔상", "연변대비", "조건등색(메타머리즘)", "색순응"], "a": 3, "e": "조건등색은 광원이 바뀌면 색이 일치하지 않게 되는 현상으로, 색 재현·인화 검수에서 표준광원을 쓰는 이유가 된다.", "s": 1, "ch": 3}, {"id": "S1-041", "topic": "시각", "q": "망막에 들어온 상이 명확히 맺히도록 두께를 바꿔 초점을 조절하는 눈의 기관은?", "c": ["수정체", "간상체", "추상체", "홍채"], "a": 1, "e": "수정체는 카메라의 렌즈에 해당하며 두께를 바꿔 초점을 맞춘다. 홍채는 조리개, 망막은 필름·센서에 해당한다.", "s": 1, "ch": 3}, {"id": "S1-042", "topic": "시각", "q": "어두운 곳에서 주로 작용하며 명암은 구별하지만 색은 구별하지 못하는 시세포는?", "c": ["시신경", "맹점", "간상체", "추상체"], "a": 3, "e": "간상체(막대세포)는 빛에 민감해 어두운 곳에서 작용하지만 색을 느끼지 못한다. 밝은 곳에서 색을 구별하는 것은 추상체(원뿔세포)다.", "s": 1, "ch": 3}, {"id": "S1-043", "topic": "시각", "q": "어두운 곳에서 시간이 지날수록 사물이 점차 보이게 되는 눈의 작용은?", "c": ["암순응", "명순응", "색순응", "잔상"], "a": 1, "e": "암순응은 완전히 이루어지는 데 약 30분이 걸린다. 반대로 어두운 곳에서 밝은 곳으로 나올 때의 적응은 명순응으로, 수십 초 안에 끝난다.", "s": 1, "ch": 3}, {"id": "S1-044", "topic": "시각", "q": "어두워질수록 빨간색은 어둡게, 파란색은 상대적으로 밝게 보이는 현상은?", "c": ["하레이션", "맥콜로 효과", "푸르키녜 현상", "베졸트 현상"], "a": 3, "e": "푸르키녜 현상은 밝을 때 추상체, 어두울 때 간상체가 작용하면서 최대 감도 파장이 단파장 쪽으로 옮겨가기 때문에 생긴다.", "s": 1, "ch": 3}, {"id": "S1-045", "topic": "시각", "q": "빨간색을 오래 본 뒤 흰 벽을 보면 청록색이 보이는 현상은?", "c": ["색순응", "보색잔상(음성잔상)", "양성잔상", "동시대비"], "a": 2, "e": "자극이 사라진 뒤 보색이 나타나는 것을 음성잔상(보색잔상)이라 한다. 수술실 가운을 청록색으로 쓰는 이유도 이 때문이다.", "s": 1, "ch": 3}, {"id": "S1-046", "topic": "색온도", "q": "다음 광원 중 색온도가 가장 낮은 것은?", "c": ["흐린 날의 야외광선", "맑은 날 그늘", "촛불이나 백열전구", "맑은 날의 야외광선"], "a": 3, "e": "촛불 약 1800K, 백열전구 약 2800~3200K로 가장 낮고 붉다. 맑은 날 주광 5500K, 흐린 날·그늘은 6500~8000K로 높고 푸르다.", "s": 1, "ch": 3}, {"id": "S1-047", "topic": "색온도", "q": "색온도 3200K용 텅스텐 필름을 주광(5500K) 아래에서 보정 없이 촬영하면 사진은 어떻게 되는가?", "c": ["변화가 없다", "푸르게 나온다", "붉게 나온다", "녹색이 돈다"], "a": 2, "e": "낮은 색온도용 필름을 높은 색온도 광원에서 쓰면 청색이 과다해진다. 이때는 앰버 계열(85 계통) 필터로 색온도를 낮춰준다.", "s": 1, "ch": 3}, {"id": "S1-048", "topic": "색온도", "q": "광원이 물체의 색을 얼마나 자연스럽게 보여주는가를 나타내는 지표는?", "c": ["휘도", "연색성(CRI)", "색온도", "조도"], "a": 2, "e": "연색성은 기준광과 비교해 색이 얼마나 충실히 재현되는지를 0~100의 지수로 나타낸다. 색온도가 같아도 연색성은 크게 다를 수 있다.", "s": 1, "ch": 3}, {"id": "S1-049", "topic": "측광 단위", "q": "단위 면적에 들어오는 빛의 양, 즉 조도의 단위로 옳은 것은?", "c": ["루멘(lm)", "켈빈(K)", "럭스(lx)", "칸델라(cd)"], "a": 3, "e": "칸델라는 광도, 루멘은 광속, 럭스는 조도, 니트(cd/㎡)는 휘도의 단위다. 켈빈은 색온도 단위다.", "s": 1, "ch": 2}, {"id": "S1-050", "topic": "사진일반", "q": "사진의 특성으로 보기 어려운 것은?", "c": ["순간을 정지시켜 포착할 수 있다", "복제와 전달이 쉽다", "작가의 주관이 개입될 수 없는 완전한 객관적 기록이다", "기록성과 재현성이 뛰어나다"], "a": 3, "e": "사진은 기계적 재현성이 뛰어나지만 프레이밍·시점·노출·순간 선택에서 촬영자의 주관이 반드시 개입한다.", "s": 1, "ch": 1}, {"id": "S1-051", "topic": "구도", "q": "화면을 가로·세로 3등분한 선의 교차점에 주 피사체를 배치하는 구도는?", "c": ["터널 구도", "3분할 구도", "대각선 구도", "방사선 구도"], "a": 2, "e": "3분할(황금분할) 구도는 주제를 중앙에서 벗어난 교차점에 두어 안정감과 여백을 함께 얻는 가장 기본적인 구도다.", "s": 1, "ch": 8}, {"id": "S1-052", "topic": "구도", "q": "인물의 시선 방향 앞쪽에 여백을 더 주는 구도상의 이유로 가장 옳은 것은?", "c": ["시선이 나아갈 심리적 공간이 생겨 안정감을 주기 때문", "화면의 채도를 높이기 위해서", "피사계심도를 깊게 하기 위해서", "노출을 정확히 맞추기 위해서"], "a": 1, "e": "시선·운동 방향 앞에 공간(노즈룸, 리드룸)을 두면 답답함이 줄고 움직임이 자연스럽게 읽힌다.", "s": 1, "ch": 8}, {"id": "S1-053", "topic": "사진일반", "q": "사진의 화면 비율에서 35mm 필름(라이카판)의 화면 크기로 옳은 것은?", "c": ["6×6cm", "4×5인치", "18×24mm", "24×36mm"], "a": 4, "e": "35mm 필름 한 컷은 24×36mm(3:2)다. 6×6cm는 중형, 4×5인치는 대형 판형이다.", "s": 1, "ch": 1}, {"id": "S1-054", "topic": "안전·환경", "q": "분말 약품을 용해할 때 주의할 점으로 옳은 것은?", "c": ["용해 순서는 어떤 약품부터 넣어도 상관없다", "통풍이 잘 되는 곳에서 분말가루를 흡입하지 않도록 한다", "아주 뜨거운 물을 써서 최대한 빨리 녹인다", "찬물에 한꺼번에 붓고 세게 저어준다"], "a": 2, "e": "분말 약품은 호흡기에 해로우므로 환기가 되는 곳에서 마스크를 쓰고 다룬다. 또 표기된 온도의 물에 정해진 순서대로 천천히 녹여야 한다.", "s": 1, "ch": 4}, {"id": "S1-055", "topic": "안전·환경", "q": "사진 폐액 처리 방법으로 바람직하지 않은 것은?", "c": ["수세조의 처리액 유출량을 줄인다", "산성 폐액과 알칼리성 폐액을 그대로 섞어 하수구에 버린다", "폐액 중의 유해 성분을 제거한 뒤 처리한다", "사용이 끝난 정착 폐액에서 은을 회수해 재이용한다"], "a": 2, "e": "사진 폐액은 중금속(은)과 유해 화합물을 포함해 그대로 방류하면 안 된다. 중화·은 회수 후 전문 업체에 위탁 처리하는 것이 원칙이다.", "s": 1, "ch": 4}, {"id": "S1-056", "topic": "안전·환경", "q": "암실 작업 시 안전 수칙으로 옳지 않은 것은?", "c": ["현상액·정지액·정착액용 집게를 구분해 사용한다", "작업 중에는 음식물을 두거나 먹지 않는다", "약품이 눈에 들어가면 문지른 뒤 나중에 병원에 간다", "약품이 손에 묻으면 즉시 깨끗이 씻는다"], "a": 3, "e": "약품이 눈에 들어가면 문지르지 말고 즉시 다량의 흐르는 물로 15분 이상 씻어낸 뒤 바로 진료를 받아야 한다.", "s": 1, "ch": 4}, {"id": "S1-057", "topic": "안전·환경", "q": "사진 오염(약품 오염) 방지를 위한 조치로 틀린 것은?", "c": ["현상액에 정착액이나 정지액이 섞이지 않게 특별히 주의한다", "사용한 탱크와 트레이는 사용 전후로 깨끗이 헹군다", "손에 약품이 묻으면 바로 씻는다", "현상한 필름은 수세를 여러 번 한 뒤 정착액에 넣는다"], "a": 4, "e": "현상-정지-정착은 정해진 순서로 이어지며, 정지 후 바로 정착에 넣는다. 정착 전에 수세를 오래 하면 현상이 계속되거나 유제가 손상될 수 있다.", "s": 1, "ch": 4}, {"id": "S1-058", "topic": "안전·환경", "q": "재해 발생 원인 중 물적 요인(불안전한 상태)에 해당하는 것은?", "c": ["보호구 미착용", "운전 중인 기계장치의 손질", "안전장치의 임의 해제", "안전 방호장치의 결함"], "a": 4, "e": "설비·장치 자체의 결함은 물적 요인(불안전한 상태), 사람의 행동에서 비롯된 것은 인적 요인(불안전한 행동)으로 구분한다.", "s": 1, "ch": 4}, {"id": "S1-059", "topic": "사진일반", "q": "사진의 표현 요소 중 '순간의 포착'을 가장 잘 설명한 개념은?", "c": ["다중노출", "결정적 순간", "심도 표현", "계조 표현"], "a": 2, "e": "앙리 카르티에 브레송이 말한 결정적 순간(the decisive moment)은 형식과 내용이 완벽히 맞아떨어지는 찰나를 뜻한다.", "s": 1, "ch": 1}, {"id": "S1-060", "topic": "사진일반", "q": "사진을 용도에 따라 분류할 때 성격이 다른 하나는?", "c": ["보도사진", "광고사진", "기록사진", "감광재료의 종류에 따른 분류"], "a": 4, "e": "보도·광고·기록은 용도에 따른 분류다. 감광재료 종류는 재료에 따른 분류로 기준이 다르다.", "s": 1, "ch": 1}, {"id": "S1-061", "topic": "사진사", "q": "사진을 회화처럼 보이게 하려고 인위적인 연출과 화면 조작을 사용한 19세기 말의 사진 사조는?", "c": ["다다이즘", "신즉물주의", "회화주의(픽토리얼리즘)", "순수사진(스트레이트 포토그래피)"], "a": 3, "e": "회화주의는 소프트포커스와 특수 인화로 회화를 흉내 냈다. 이에 반발해 사진 고유의 선명함과 기록성을 앞세운 것이 스티글리츠 이후의 순수사진 운동이다.", "s": 1, "ch": 1}, {"id": "S1-062", "topic": "사진사", "q": "사진을 독립된 예술로 인정받게 하는 데 앞장서고 잡지 '카메라 워크'를 발간한 사진가는?", "c": ["루이 다게르", "조지 이스트먼", "리처드 매독스", "알프레드 스티글리츠"], "a": 4, "e": "스티글리츠는 사진 분리파(Photo-Secession)를 이끌며 사진을 회화의 모방에서 떼어내 독자적 예술로 세우려 했다.", "s": 1, "ch": 1}, {"id": "S1-063", "topic": "사진사", "q": "흑백 필름 시대를 지나 1935년 이후 컬러 사진의 대중화를 이끈 대표적인 컬러 리버설 필름은?", "c": ["칼로타입", "코다크롬", "오소크로매틱", "콜로디온"], "a": 2, "e": "코다크롬은 여러 층의 유제를 겹친 다층 컬러 필름으로, 이후 반세기 동안 컬러 슬라이드의 기준이 되었다.", "s": 1, "ch": 1}, {"id": "S1-064", "topic": "사진사", "q": "존 시스템(Zone System)을 만들어 노출과 현상을 계획적으로 조절하는 방법을 정립한 사진가는?", "c": ["머이브리지", "탤벗", "앤설 애덤스", "앙리 카르티에 브레송"], "a": 3, "e": "애덤스는 화면의 밝기를 0부터 10까지의 존으로 나누고, 촬영 단계에서 최종 인화의 계조를 미리 설계하는 방법을 세웠다.", "s": 1, "ch": 1}, {"id": "S1-065", "topic": "사진사", "q": "사진의 발명이 공식적으로 세상에 공표된 해는?", "c": ["1839년", "1727년", "1888년", "1925년"], "a": 1, "e": "1839년 프랑스 학사원에서 다게레오타입이 공표되면서 이 해를 사진의 공식 탄생 연도로 본다.", "s": 1, "ch": 1}, {"id": "S1-066", "topic": "사진일반", "q": "사진이 회화와 구별되는 가장 본질적인 성격으로 옳은 것은?", "c": ["피사체에서 나온 빛이 직접 상을 만든다는 점", "색을 자유롭게 쓸 수 있다는 점", "크기를 마음대로 바꿀 수 있다는 점", "평면에 표현한다는 점"], "a": 1, "e": "사진은 실재하는 대상의 빛이 감광재료에 직접 기록된 결과라는 점에서 기록성과 증거력을 가진다. 이를 사진의 지표성이라 한다.", "s": 1, "ch": 1}, {"id": "S1-067", "topic": "광학", "q": "렌즈의 결상 공식 1/f = 1/a + 1/b 에서 f 가 뜻하는 것은?", "c": ["상까지의 거리", "렌즈의 초점거리", "조리개 값", "피사체까지의 거리"], "a": 2, "e": "a는 피사체 거리, b는 상 거리, f는 초점거리다. 피사체가 렌즈에 가까워질수록 b가 길어져 렌즈를 앞으로 빼야 초점이 맞는다.", "s": 1, "ch": 2}, {"id": "S1-068", "topic": "광학", "q": "초점거리가 같은 렌즈에서 화면(판형)이 커지면 화각은 어떻게 되는가?", "c": ["넓어진다", "좁아진다", "변하지 않는다", "초점거리에 반비례해 사라진다"], "a": 1, "e": "화각은 초점거리와 화면 대각선의 관계로 정해진다. 같은 50mm라도 대형 판형에서는 광각이 되고, 작은 센서에서는 망원처럼 보인다.", "s": 1, "ch": 2}, {"id": "S1-069", "topic": "광학", "q": "렌즈의 밝기(구경비)를 나타내는 f값의 정의로 옳은 것은?", "c": ["유효 구경을 초점거리로 나눈 값", "렌즈 매수를 곱한 값", "화각을 초점거리로 나눈 값", "초점거리를 유효 구경으로 나눈 값"], "a": 4, "e": "f = 초점거리 ÷ 유효 구경이다. 그래서 같은 구경이라도 초점거리가 길면 f값이 커져 어두워진다.", "s": 1, "ch": 2}, {"id": "S1-070", "topic": "광학", "q": "접사에서 배율이 1:1 이라는 표시가 뜻하는 것은?", "c": ["초점거리가 두 배가 된다", "피사체와 필름(센서)에 맺힌 상의 크기가 같다", "피사체가 실제의 절반 크기로 찍힌다", "피사체가 2배로 확대된다"], "a": 2, "e": "등배(1:1) 촬영이다. 배율이 커질수록 노출 배수가 늘고 피사계심도는 극단적으로 얕아진다.", "s": 1, "ch": 2}, {"id": "S1-071", "topic": "렌즈수차", "q": "렌즈 중심을 지난 빛과 주변을 지난 빛의 초점 위치가 달라 상이 흐려지는 수차는?", "c": ["구면수차", "색수차", "왜곡수차", "비점수차"], "a": 1, "e": "구면수차는 조리개를 조이면 주변 광선이 차단되어 크게 줄어든다. 개방 촬영에서 화질이 무른 주된 원인이다.", "s": 1, "ch": 2}, {"id": "S1-072", "topic": "렌즈수차", "q": "파장에 따라 굴절률이 달라 상의 윤곽에 색 테두리가 생기는 수차는?", "c": ["코마수차", "상면만곡", "왜곡수차", "색수차"], "a": 4, "e": "색수차는 조리개를 조여도 잘 없어지지 않아, 저분산 유리(ED)나 형석 같은 특수 광학재료로 보정한다.", "s": 1, "ch": 2}, {"id": "S1-073", "topic": "광학", "q": "화면 주변부가 중심보다 어둡게 나오는 현상은?", "c": ["할레이션", "플레어", "모아레", "비네팅(주변광량 저하)"], "a": 4, "e": "비네팅은 개방 조리개나 초광각에서 두드러지고, 조리개를 조이면 대체로 줄어든다. 맞지 않는 후드나 겹쳐 낀 필터도 원인이 된다.", "s": 1, "ch": 2}, {"id": "S1-074", "topic": "광학", "q": "강한 광원이 렌즈 내부에서 반사되어 화면에 뿌옇게 퍼지거나 밝은 반점이 생기는 현상은?", "c": ["할레이션", "회절", "플레어", "비네팅"], "a": 3, "e": "플레어는 콘트라스트를 떨어뜨린다. 후드 사용, 코팅 렌즈, 렌즈 청결 유지로 줄일 수 있다.", "s": 1, "ch": 2}, {"id": "S1-075", "topic": "사진사", "q": "사진술 발명 과정에서 니엡스와 다게르의 관계로 옳은 것은?", "c": ["니엡스와 다게르가 동업 계약을 맺었고, 니엡스가 죽은 뒤 다게르가 완성했다", "두 사람은 서로 만난 적이 없다", "다게르가 니엡스의 스승이었다", "두 사람은 같은 해에 각각 다른 나라에서 발표했다"], "a": 1, "e": "니엡스가 먼저 헬리오그래피를 만들었고, 다게르와 손잡아 연구를 이어가다 니엡스가 사망한 뒤 다게르가 다게레오타입을 완성해 발표했다.", "s": 1, "ch": 1}, {"id": "S1-076", "topic": "사진사", "q": "이민 노동자와 아동 노동의 현실을 찍어 사회 개혁에 영향을 준, 다큐멘터리 사진의 출발점으로 꼽히는 사진가는?", "c": ["프레드릭 아처", "루이스 하인", "앤설 애덤스", "오스카 바르낙"], "a": 2, "e": "루이스 하인의 아동 노동 사진은 법 개정을 이끌었다. 사진이 기록을 넘어 사회를 바꾸는 도구가 될 수 있음을 보여 준 사례다.", "s": 1, "ch": 1}, {"id": "S1-077", "topic": "사진사", "q": "한국에 사진술이 들어온 시기와 초기 상황으로 옳은 것은?", "c": ["일제강점기 이전에는 사진이 전혀 없었다", "1880년대에 촬영국이 세워지며 인물 사진을 중심으로 시작되었다", "1600년대에 궁중 화원이 사진을 찍기 시작했다", "1950년대 한국전쟁 이후에 처음 도입되었다"], "a": 2, "e": "개화기인 1880년대에 황철·지운영 등이 촬영국을 열면서 한국 사진이 시작되었다. 초기에는 초상 사진이 중심이었다.", "s": 1, "ch": 1}, {"id": "S1-078", "topic": "사진사", "q": "1930년대 미국에서 대공황기 농촌의 실상을 기록한 대규모 사진 사업은?", "c": ["FSA 사진 프로젝트", "포토 세세션", "바우하우스 사진", "f/64 그룹"], "a": 1, "e": "FSA(농업안정국)는 도로시아 랭, 워커 에번스 등을 고용해 농촌 빈곤을 기록했다. 보도·기록사진의 대표적 성과로 꼽힌다.", "s": 1, "ch": 1}, {"id": "S1-079", "topic": "광학", "q": "바늘구멍 사진기(핀홀 카메라)의 특징으로 옳지 않은 것은?", "c": ["구멍이 작을수록 심도가 깊어 원근 전체가 고르게 맺힌다", "노출 시간이 매우 길다", "상은 상하좌우가 뒤집혀 맺힌다", "렌즈보다 상이 선명하고 밝다"], "a": 4, "e": "핀홀은 렌즈가 없어 상이 부드럽고 어둡다. 대신 조리개 값이 극단적으로 작아 심도가 사실상 무한하고 왜곡이 없다.", "s": 1, "ch": 2}, {"id": "S1-080", "topic": "광학", "q": "35mm 판형에서 표준렌즈(50mm)의 대각선 화각으로 가장 가까운 것은?", "c": ["약 12도", "약 84도", "약 180도", "약 46도"], "a": 4, "e": "표준렌즈의 화각은 약 46도로 사람 눈의 자연스러운 시야에 가깝다. 28mm 광각은 약 75도, 200mm 망원은 약 12도다.", "s": 1, "ch": 2}, {"id": "S1-081", "topic": "광학", "q": "카메라의 심도 미리보기(preview) 버튼이 하는 일은?", "c": ["설정한 조리개까지 실제로 조여 심도를 눈으로 확인하게 해 준다", "셔터속도를 자동으로 계산해 준다", "초점을 자동으로 맞춰 준다", "노출을 한 단계 보정해 준다"], "a": 1, "e": "평소 뷰파인더는 개방 상태로 보인다. 미리보기를 누르면 실제 촬영 조리개로 조여져 화면이 어두워지는 대신 심도를 확인할 수 있다.", "s": 1, "ch": 2}, {"id": "S1-082", "topic": "광학", "q": "f/2 렌즈를 f/4로 조였을 때 통과하는 빛의 양은?", "c": ["1/8로 줄어든다", "2배로 늘어난다", "1/4로 줄어든다", "1/2로 줄어든다"], "a": 3, "e": "f/2 → f/2.8 → f/4 로 2스톱 차이다. 한 스톱마다 광량이 절반이 되므로 1/4이 된다.", "s": 1, "ch": 2}, {"id": "S1-083", "topic": "광학", "q": "볼록렌즈로 맺은 상 중 필름이나 스크린에 실제로 맺혀 기록할 수 있는 상은?", "c": ["가상", "실상", "허상", "정립상"], "a": 2, "e": "카메라가 기록하는 것은 실상이며 상하좌우가 뒤집힌 도립상이다. 돋보기로 확대해 보는 상은 스크린에 맺히지 않는 허상이다.", "s": 1, "ch": 2}, {"id": "S1-084", "topic": "광학", "q": "같은 자리에서 같은 피사체를 찍을 때 렌즈 초점거리를 2배로 늘리면 상의 크기는?", "c": ["변하지 않는다", "2배가 된다", "1/2이 된다", "4배가 된다"], "a": 2, "e": "상의 크기는 초점거리에 비례하고 촬영 거리에 반비례한다. 50mm에서 100mm로 바꾸면 피사체가 화면에서 두 배로 커진다.", "s": 1, "ch": 2}, {"id": "S1-085", "topic": "색채", "q": "같은 회색이라도 흰 바탕에서는 어둡게, 검은 바탕에서는 밝게 보이는 현상은?", "c": ["채도대비", "색상대비", "보색대비", "명도대비"], "a": 4, "e": "주위 색과의 관계로 밝기가 달라 보이는 동시대비의 하나다. 사진에서도 배경 밝기에 따라 피사체의 톤이 다르게 읽힌다.", "s": 1, "ch": 3}, {"id": "S1-086", "topic": "색채", "q": "같은 색이라도 채도가 낮은 바탕에 놓이면 더 선명해 보이는 현상은?", "c": ["명도대비", "연변대비", "계시대비", "채도대비"], "a": 4, "e": "회색 배경에 놓인 빨강이 빨강 배경에 놓인 빨강보다 선명해 보인다. 배경의 채도가 대비를 만들기 때문이다.", "s": 1, "ch": 3}, {"id": "S1-087", "topic": "색채", "q": "팽이처럼 색을 빠르게 회전시켰을 때 두 색의 중간 밝기로 보이는 혼합은?", "c": ["회전혼합(중간혼합)", "가산혼합", "감산혼합", "병치혼합"], "a": 1, "e": "회전혼합은 명도가 두 색의 평균이 되는 중간혼합이다. 점을 촘촘히 찍어 멀리서 섞여 보이게 하는 병치혼합도 중간혼합에 속한다.", "s": 1, "ch": 3}, {"id": "S1-088", "topic": "색채", "q": "인쇄물의 망점이나 모니터의 화소처럼 작은 색점이 나란히 놓여 섞여 보이는 혼합은?", "c": ["병치혼합", "감산혼합", "회전혼합", "보색혼합"], "a": 1, "e": "눈이 분해하지 못할 만큼 작은 점들이 시각적으로 섞이는 현상이다. 인쇄와 디스플레이의 색 재현이 모두 이 원리를 쓴다.", "s": 1, "ch": 3}, {"id": "S1-089", "topic": "색채", "q": "색의 주목성(눈길을 끄는 정도)이 가장 높은 색 계열은?", "c": ["고명도·고채도의 난색 계열", "저명도·저채도의 한색 계열", "중명도의 무채색", "저채도의 중성색"], "a": 1, "e": "빨강·주황처럼 밝고 선명한 난색이 가장 눈에 잘 띈다. 명시성이 배경과의 관계라면 주목성은 색 자체의 성질이다.", "s": 1, "ch": 3}, {"id": "S1-090", "topic": "색채", "q": "산업안전보건 기준에서 '금지'를 나타내는 안전색으로 옳은 것은?", "c": ["노랑", "파랑", "녹색", "빨강"], "a": 4, "e": "빨강은 금지·정지·소방, 노랑은 경고, 파랑은 지시, 녹색은 안내·안전을 뜻한다. 암실과 스튜디오 안전표지도 이 기준을 따른다.", "s": 1, "ch": 3}, {"id": "S1-091", "topic": "색채", "q": "명도와 채도를 함께 묶어 색의 인상을 나타내는 개념으로, 밝은 톤·어두운 톤처럼 부르는 것은?", "c": ["순색", "톤(색조)", "색상환", "보색"], "a": 2, "e": "PCCS 표색계는 톤을 12가지로 나누어 배색 교육에 쓴다. 페일·라이트·비비드·다크 같은 이름이 톤의 구분이다.", "s": 1, "ch": 3}, {"id": "S1-092", "topic": "색채", "q": "백색광을 프리즘으로 분산했을 때 나타나는 스펙트럼의 순서로 옳은 것은?", "c": ["초록 - 노랑 - 빨강 - 보라 - 파랑 - 주황 - 남색", "빨강 - 주황 - 노랑 - 초록 - 파랑 - 남색 - 보라", "보라 - 파랑 - 빨강 - 노랑 - 초록 - 주황 - 남색", "빨강 - 노랑 - 초록 - 보라 - 파랑 - 주황 - 남색"], "a": 2, "e": "파장이 긴 빨강에서 짧은 보라 순으로 늘어선다. 굴절은 반대로 보라가 가장 크다.", "s": 1, "ch": 3}, {"id": "S1-093", "topic": "사진사", "q": "프리즘을 이용해 눈앞의 실제 풍경이 종이 위에 겹쳐 보이도록 만들어, 화가들이 윤곽을 따라 그리는 데 쓴 장치는?", "c": ["카메라 루시다", "카메라 옵스큐라", "전동식 초상 제작기", "박스형 카메라"], "a": 1, "e": "카메라 루시다는 울러스턴이 만든 스케치 보조 도구로, 어두운 방이 필요 없다는 뜻에서 '밝은 방'이라는 이름이 붙었다. 상을 감광재료에 고정하지는 못했다.", "s": 1, "ch": 1}, {"id": "S1-094", "topic": "사진사", "q": "은(Ag) 화합물이 빛을 받으면 검게 변한다는 사실을 실험으로 밝혀 감광 원리의 기초를 놓은 학자는?", "c": ["아우구스트 잔더", "니엡스", "슐체", "레오나르도 다빈치"], "a": 3, "e": "슐체는 질산은 혼합물이 열이 아니라 빛에 반응해 검어진다는 것을 증명했다. 이 발견이 훗날 할로겐화은 감광재료의 출발점이 되었다.", "s": 1, "ch": 1}, {"id": "S1-095", "topic": "사진사", "q": "'photography'라는 용어를 널리 퍼뜨리고 네거티브·포지티브라는 말을 처음 쓴 인물은?", "c": ["리처드 매독스", "알프레드 스티글리츠", "존 프레드릭 허셜", "조지 이스트먼"], "a": 3, "e": "허셜은 티오황산나트륨(하이포)이 할로겐화은을 녹인다는 사실을 알려 정착의 길도 열었다. 오늘날 정착액의 원리가 여기서 나왔다.", "s": 1, "ch": 1}, {"id": "S1-096", "topic": "사진사", "q": "'포토그래피(photography)'라는 말의 어원으로 옳은 것은?", "c": ["어두운 방이라는 뜻의 라틴어", "태양의 그림이라는 뜻의 그리스어", "기록한다는 뜻의 프랑스어", "빛(photos)과 그리다(graphos)의 합성어"], "a": 4, "e": "빛으로 그린 그림이라는 뜻이다. '태양의 그림'은 니엡스의 헬리오그래피가 가진 뜻이다.", "s": 1, "ch": 1}, {"id": "S1-097", "topic": "사진사", "q": "크림전쟁을 촬영해 최초의 종군(전쟁) 사진가로 꼽히는 사람은?", "c": ["에드워드 머이브리지", "로저 펜튼", "매튜 브래디", "루이스 하인"], "a": 2, "e": "로저 펜튼은 콜로디온 습판법을 쓰느라 암실 마차를 끌고 전장에 갔다. 미국 남북전쟁을 기록한 사람은 매튜 브래디다.", "s": 1, "ch": 1}, {"id": "S1-098", "topic": "사진사", "q": "미국 남북전쟁의 참상을 대규모로 기록한 사진가는?", "c": ["앤설 애덤스", "매튜 브래디", "로저 펜튼", "앙리 카르티에 브레송"], "a": 2, "e": "브래디는 촬영팀을 조직해 전장을 기록했다. 전쟁의 실상을 대중에게 처음으로 사진으로 전한 작업으로 평가받는다.", "s": 1, "ch": 1}, {"id": "S1-099", "topic": "사진사", "q": "상대가 의식하지 못한 상태에서 자연스러운 표정과 동작을 포착하는 캔디드 포토의 선구자로 꼽히는 사진가는?", "c": ["에리히 살로몬", "마이너 화이트", "앤설 애덤스", "헨리 피치 로빈슨"], "a": 1, "e": "살로몬은 소형 카메라를 들고 회의장과 사교장에 들어가 연출되지 않은 순간을 찍었다. 캔디드 포토의 아버지로 불린다.", "s": 1, "ch": 1}, {"id": "S1-100", "topic": "사진사", "q": "여러 장의 네거티브를 겹쳐 인화해 한 화면을 만드는 조합인화로 회화주의 사진을 대표한 인물은?", "c": ["헨리 피치 로빈슨", "에드워드 머이브리지", "조지 이스트먼", "루이스 하인"], "a": 1, "e": "로빈슨과 레일랜더는 여러 원판을 합성해 회화 같은 장면을 만들었다. 사진 고유의 기록성을 앞세운 순수사진과 대립한 흐름이다.", "s": 1, "ch": 1}, {"id": "S1-101", "topic": "사진사", "q": "1929년 우리나라에서 최초로 개인 사진전을 연 사진가는?", "c": ["정해창", "임응식", "최민식", "지운영"], "a": 1, "e": "정해창은 경성에서 첫 개인 사진전을 열어 한국 예술사진의 출발점을 만들었다. 임응식과 최민식은 광복 이후에 활동한 사진가다.", "s": 1, "ch": 1}, {"id": "S1-102", "topic": "사진사", "q": "생활주의 리얼리즘을 내세워 한국 사진을 살롱풍에서 현실 기록으로 돌려세운 사진가는?", "c": ["황철", "오스카 바르낙", "임응식", "정해창"], "a": 3, "e": "임응식은 꾸민 살롱사진 대신 사람들의 삶의 현장을 찍자고 주장했다. 최민식은 서민의 일상을 평생 기록한 휴먼 다큐멘터리로 알려져 있다.", "s": 1, "ch": 1}, {"id": "S1-103", "topic": "사진사", "q": "우리나라에 사진술을 들여와 초기 촬영국을 연 인물로 묶인 것은?", "c": ["니엡스와 다게르", "황철과 지운영", "정해창과 임응식", "최민식과 김기찬"], "a": 2, "e": "개화기인 1880년대에 황철과 지운영 등이 촬영국을 열어 인물 사진을 찍었다. 한국 사진의 시작으로 본다.", "s": 1, "ch": 1}, {"id": "S1-104", "topic": "사진사", "q": "사진술의 발명 순서를 이른 것부터 바르게 나열한 것은?", "c": ["습판법 - 건판법 - 헬리오그래피 - 다게레오타입 - 칼로타입 - 롤필름", "헬리오그래피 - 다게레오타입 - 칼로타입 - 습판법 - 건판법 - 롤필름", "다게레오타입 - 헬리오그래피 - 습판법 - 칼로타입 - 롤필름 - 건판법", "칼로타입 - 다게레오타입 - 헬리오그래피 - 건판법 - 습판법 - 롤필름"], "a": 2, "e": "니엡스의 헬리오그래피에서 시작해 다게레오타입과 칼로타입으로 갈라지고, 콜로디온 습판을 거쳐 젤라틴 건판과 롤필름으로 이어진다. 순서를 묻는 문제가 자주 나온다.", "s": 1, "ch": 1}, {"id": "S1-105", "topic": "사진사", "q": "칼로타입이 다게레오타입과 비교했을 때 가진 특징으로 옳은 것은?", "c": ["상이 더 선명하고 세밀하다", "은판에 직접 양화가 맺힌다", "좌우가 반대로 기록된다", "복사성이 있어 한 원판에서 여러 장을 뽑을 수 있다"], "a": 4, "e": "선명도는 다게레오타입이 앞섰지만 한 장뿐이었다. 종이 네거티브를 쓴 칼로타입은 화질이 무른 대신 복제가 가능해 오늘날 사진의 뿌리가 되었다.", "s": 1, "ch": 1}, {"id": "S1-106", "topic": "사진사", "q": "콜로디온 습판법의 특징으로 옳지 않은 것은?", "c": ["유리 원판을 써서 상이 선명하다", "네거티브를 얻어 여러 장 복제할 수 있다", "감도가 비교적 높아 노출시간이 짧아졌다", "유제가 완전히 건조된 뒤에 노광해야 한다"], "a": 4, "e": "습판이라는 이름 그대로 유제가 젖어 있는 동안 촬영과 현상을 끝내야 한다. 마르면 감도가 급격히 떨어진다.", "s": 1, "ch": 1}, {"id": "S1-107", "topic": "사진사", "q": "다게레오타입에서 염화금 용액으로 상을 처리한 이유로 옳은 것은?", "c": ["노출시간을 늘리기 위해", "은판을 얇게 만들기 위해", "색을 입히기 위해", "상을 견고하게 하고 콘트라스트를 높이기 위해"], "a": 4, "e": "피조가 도입한 금도금 처리로 약한 은상이 단단해지고 화질도 좋아졌다. 요오드에 이어 브롬을 함께 써서 감도를 올린 개량도 이 시기의 일이다.", "s": 1, "ch": 1}, {"id": "S1-108", "topic": "사진사", "q": "조지 이스트먼이 발명한 필름에 관한 설명으로 옳지 않은 것은?", "c": ["박스형 카메라에 처음 쓰였다", "아마추어 사진가의 등장을 이끌었다", "유리 건판을 그대로 사용하는 방식이다", "셀룰로이드를 베이스로 한 롤필름이다"], "a": 3, "e": "이스트먼의 공은 무겁고 깨지는 유리 원판을 유연한 롤필름으로 바꾼 데 있다. 카메라째 보내면 현상해 돌려주는 방식으로 대중화를 이끌었다.", "s": 1, "ch": 1}, {"id": "S1-109", "topic": "사진사", "q": "한 장의 화면에 연속 동작을 겹쳐 기록하는 크로노포토그래피로 동체 사진을 연구한 사람은?", "c": ["허셜", "매독스", "마레", "레일랜더"], "a": 3, "e": "마레는 총 모양의 사진기로 새의 비행을 한 화면에 기록했다. 여러 대의 카메라를 늘어놓은 머이브리지와 방법이 다르다.", "s": 1, "ch": 1}, {"id": "S1-110", "topic": "사진사", "q": "젤라틴 건판을 실용화해 습판 시대를 끝낸 인물은?", "c": ["프레드릭 스콧 아처", "윌리엄 헨리 폭스 탤벗", "루이 자크 망데 다게르", "리처드 리치 매독스"], "a": 4, "e": "매독스가 젤라틴 유제를 제안하면서 미리 만들어 보관하는 건판이 가능해졌다. 아처는 그 앞 단계인 콜로디온 습판법을 발명했다.", "s": 1, "ch": 1}, {"id": "S1-111", "topic": "사진사", "q": "사진 분리파(Photo-Secession)를 이끌며 잡지 '카메라 워크'를 낸 인물과 그 활동의 성격으로 옳은 것은?", "c": ["브래디 - 전쟁 기록을 남겼다", "랜드 - 즉석사진을 개발했다", "스티글리츠 - 사진을 회화의 모방에서 떼어내 독립된 예술로 세우려 했다", "이스트먼 - 사진기의 대량 생산을 이끌었다"], "a": 3, "e": "스티글리츠는 초기에 회화주의에 가까웠지만 점차 사진 고유의 표현으로 옮겨가며 순수사진의 길을 열었다.", "s": 1, "ch": 1}, {"id": "S1-112", "topic": "사진사", "q": "사진의 역사에서 '결정적 순간'을 이야기하며 소형 카메라로 삶의 찰나를 포착한 사진가는?", "c": ["오스카 바르낙", "앙리 카르티에 브레송", "앤설 애덤스", "루이스 하인"], "a": 2, "e": "브레송은 라이카를 들고 다니며 형식과 내용이 맞아떨어지는 순간을 기다렸다. 매그넘 창립자 중 한 사람이다.", "s": 1, "ch": 1}, {"id": "S1-113", "topic": "색채", "q": "빨강-초록, 노랑-파랑, 흰색-검정이 서로 대립하며 지각된다고 본 반대색설(4원색설)을 주장한 사람은?", "c": ["오스트발트", "헤링", "영·헬름홀츠", "먼셀"], "a": 2, "e": "헤링은 대립하는 색이 동시에 지각되지 않는다는 점에서 반대색설을 세웠다. 빛의 3원색으로 설명하는 3원색설은 영과 헬름홀츠가 주장했다.", "s": 1, "ch": 3}, {"id": "S1-114", "topic": "색채", "q": "빨강·초록·파랑 세 가지 감각의 혼합으로 색을 지각한다고 본 3원색설을 주장한 사람으로 묶인 것은?", "c": ["맥아담과 문셀", "영과 헬름홀츠", "헤링과 먼셀", "오스트발트와 저드"], "a": 2, "e": "영·헬름홀츠의 3원색설은 망막의 세 가지 추상체로 설명된다. 오늘날에는 3원색설과 반대색설을 단계적으로 함께 설명하는 단계설이 받아들여진다.", "s": 1, "ch": 3}, {"id": "S1-115", "topic": "색채", "q": "CIE L*a*b* 색공간에서 a* 축이 나타내는 색상 정보로 옳은 것은?", "c": ["적색 - 녹색 축", "황색 - 청색 축", "명도", "채도"], "a": 1, "e": "L*은 명도, a*는 적색과 녹색, b*는 황색과 청색의 축이다. 장치에 의존하지 않는 색공간이라 색관리의 기준으로 쓰인다.", "s": 1, "ch": 3}, {"id": "S1-116", "topic": "색채", "q": "명시성(시인성)이 가장 높아 안전표지에 널리 쓰이는 배색은?", "c": ["흰 바탕에 노랑", "흰 바탕에 파랑", "검정 바탕에 빨강", "검정 바탕에 노랑"], "a": 4, "e": "명시성은 배경과의 명도 차가 가장 크게 좌우한다. 검정과 노랑은 명도 차가 커서 멀리서도 잘 보인다. KS 용어로는 시인성이라고도 한다.", "s": 1, "ch": 3}, {"id": "S1-117", "topic": "빛의 성질", "q": "가시광선보다 파장이 길고 투과력이 좋아 문서나 회화의 감정·감식 촬영, 안개 투과 촬영에 쓰이는 광선은?", "c": ["자외선", "감마선", "X선", "적외선"], "a": 4, "e": "적외선은 780nm보다 긴 파장으로 열선이라고도 한다. 자외선은 가시광선보다 짧으며 형광 반응을 이용한 감식에 쓰인다.", "s": 1, "ch": 2}, {"id": "S1-118", "topic": "빛의 성질", "q": "파장이 짧은 것부터 순서대로 바르게 나열한 것은?", "c": ["적외선 - 가시광선 - 자외선 - X선", "자외선 - X선 - 적외선 - 가시광선", "가시광선 - 자외선 - X선 - 적외선", "X선 - 자외선 - 가시광선 - 적외선"], "a": 4, "e": "전자기파는 파장이 짧을수록 에너지가 크다. 감마선과 X선이 가장 짧고, 자외선·가시광선을 지나 적외선·전파로 갈수록 길어진다.", "s": 1, "ch": 2}, {"id": "S1-119", "topic": "색채", "q": "색상이 비슷한 색끼리 배색해 안정감을 주는 조화 방식은?", "c": ["유사조화", "대비조화", "보색조화", "분열보색조화"], "a": 1, "e": "유사조화는 차분하고 통일감이 있으나 단조로울 수 있다. 대비조화는 색상 차가 커서 강렬하지만 자칫 산만해진다.", "s": 1, "ch": 3}, {"id": "S1-120", "topic": "색채", "q": "같은 색상 안에서 명도 차이를 두어 배색하는 방식은?", "c": ["톤 인 톤", "까마이외", "세퍼레이션", "톤 온 톤"], "a": 4, "e": "톤 온 톤은 같은 색상에서 밝고 어두움으로 층을 만든다. 톤 인 톤은 색상은 다르되 톤을 비슷하게 맞추는 배색이다.", "s": 1, "ch": 3}, {"id": "S1-121", "topic": "색채", "q": "색의 중량감(무겁고 가벼운 느낌)에 가장 큰 영향을 주는 속성은?", "c": ["명도", "색상", "채도", "면적"], "a": 1, "e": "명도가 높으면 가볍게, 낮으면 무겁게 느껴진다. 포장 디자인에서 위쪽에 밝은 색을 쓰는 이유도 여기에 있다.", "s": 1, "ch": 3}, {"id": "S1-122", "topic": "색채", "q": "색의 경연감에서 부드럽게 느껴지는 색의 조건으로 옳은 것은?", "c": ["명도가 높고 채도가 낮은 난색 계열", "명도가 낮고 채도가 높은 한색 계열", "명도와 채도가 모두 낮은 색", "순색에 검정을 섞은 색"], "a": 1, "e": "밝고 부드러운 파스텔 계열이 유연한 느낌을 준다. 반대로 어둡고 채도가 높은 한색은 딱딱하게 느껴진다.", "s": 1, "ch": 3}, {"id": "S1-123", "topic": "색채", "q": "같은 색이라도 면적이 넓어질수록 나타나는 변화로 옳은 것은?", "c": ["명도와 채도가 더 높아 보인다", "명도와 채도가 더 낮아 보인다", "색상이 반대로 바뀐다", "변화가 없다"], "a": 1, "e": "면적대비 때문에 작은 색표로 고른 색을 넓은 면에 칠하면 예상보다 밝고 진해 보인다. 배색을 정할 때 유의해야 한다.", "s": 1, "ch": 3}, {"id": "S1-124", "topic": "광학", "q": "필름면이나 센서면 쪽에서 상이 선명하게 맺히는 것으로 인정되는 범위를 뜻하는 것은?", "c": ["초점심도", "피사계심도", "과초점거리", "이미지 서클"], "a": 1, "e": "피사계심도는 피사체 쪽, 초점심도는 결상면 쪽의 허용 범위다. 조리개를 조이면 둘 다 깊어진다.", "s": 1, "ch": 2}, {"id": "S1-125", "topic": "광학", "q": "렌즈의 밝기가 f/1.4 인 렌즈와 f/2.8 인 렌즈를 같은 조건에서 개방해 쓸 때의 차이로 옳은 것은?", "c": ["f/1.4 렌즈가 2스톱 밝아 더 빠른 셔터속도를 쓸 수 있다", "f/2.8 렌즈가 2스톱 밝다", "두 렌즈의 밝기는 같다", "f/1.4 렌즈가 4스톱 밝다"], "a": 1, "e": "f/1.4 → f/2 → f/2.8 로 2스톱 차이다. 밝은 렌즈는 어두운 곳에서 유리하고 심도를 더 얕게 만들 수 있다.", "s": 1, "ch": 2}, {"id": "S1-126", "topic": "광학", "q": "거울을 이용해 광로를 접어 길이를 줄인 망원렌즈의 특징으로 옳은 것은?", "c": ["조리개를 자유롭게 조절할 수 있다", "화각이 매우 넓다", "접사 전용으로 쓰인다", "가볍고 짧지만 조리개가 고정되고 배경 흐림이 고리 모양으로 나타난다"], "a": 4, "e": "반사망원(미러) 렌즈는 반사경으로 광로를 접어 부피를 줄인다. 대신 조리개가 고정이고 도넛 모양 보케가 생긴다.", "s": 1, "ch": 2}, {"id": "S1-127", "topic": "사진사", "q": "사진가들이 스스로 만든 국제 사진가 그룹으로, 브레송과 카파 등이 참여해 저작권을 작가가 갖도록 한 조직은?", "c": ["사진 분리파", "바우하우스", "FSA", "매그넘 포토스"], "a": 4, "e": "매그넘은 1947년 설립되어 사진가의 권리와 취재의 자율성을 지켰다. 보도사진의 수준을 끌어올린 조직으로 평가된다.", "s": 1, "ch": 1}, {"id": "S1-128", "topic": "사진사", "q": "카메라 없이 감광재료 위에 물체를 올리고 빛을 주어 만드는 이미지는?", "c": ["포토몽타주", "솔라리제이션", "릴리프", "포토그램"], "a": 4, "e": "모홀리나기와 만 레이가 실험적으로 다뤘다. 물체가 빛을 가린 자리가 하얗게 남는 원리다.", "s": 1, "ch": 1}, {"id": "S1-129", "topic": "사진사", "q": "작은 조리개로 화면 전체를 선명하게 담는 순수사진을 지향하며 결성된 미국의 사진가 그룹은?", "c": ["다다", "포토 세세션", "f/64 그룹", "회화주의 그룹"], "a": 3, "e": "애덤스와 웨스턴 등이 참여했다. 이름 그대로 극단적으로 조인 조리개로 얻는 선예한 묘사를 내세웠다.", "s": 1, "ch": 1}, {"id": "S1-130", "topic": "사진일반", "q": "일상의 사건이나 이야기를 작가의 주관적인 시각으로 기록하여 표현하는 사진을 무엇이라 하는가?", "c": ["순수 사진", "커머셜 사진", "저널리즘 사진", "다큐멘터리 사진"], "a": 4, "e": "다큐멘터리는 사실을 기록하되 작가의 시각과 해석이 들어간다. 저널리즘 사진은 보도라는 목적과 즉시성이 앞선다.", "s": 1, "ch": 1}]}, {"no": 2, "name": "사진재료 및 현상", "questions": [{"id": "S2-001", "topic": "필름구조", "q": "흑백 필름의 층 구조를 표면부터 순서대로 나열한 것으로 옳은 것은?", "c": ["할레이션 방지층 - 유제층 - 지지체 - 보호막 - 하지층", "보호막 - 유제층 - 하지층 - 지지체 - 할레이션 방지층", "유제층 - 보호막 - 지지체 - 하지층 - 할레이션 방지층", "지지체 - 유제층 - 보호막 - 하지층 - 할레이션 방지층"], "a": 2, "e": "맨 위 보호막이 유제를 긁힘에서 지키고, 유제층이 실제로 빛을 받는다. 하지층(접착층)은 유제와 지지체를 붙이며, 지지체 뒷면의 할레이션 방지층이 통과한 빛의 반사를 막는다.", "s": 2, "ch": 7}, {"id": "S2-002", "topic": "필름구조", "q": "필름 뒷면의 할레이션 방지층(anti-halation layer)의 역할은?", "c": ["현상 시간을 단축시킨다", "지지체를 통과한 빛이 되반사되어 상 주위에 번짐이 생기는 것을 막는다", "필름의 감광도를 높인다", "정전기 발생을 완전히 차단한다"], "a": 2, "e": "밝은 광원을 찍을 때 빛이 베이스를 통과해 뒷면에서 반사되면 상 둘레에 후광 같은 번짐(할레이션)이 생긴다. 이를 흡수하는 층이 할레이션 방지층이며 현상 과정에서 씻겨 나간다.", "s": 2, "ch": 7}, {"id": "S2-003", "topic": "감광재료", "q": "사진 유제에서 실제로 빛을 받아 잠상을 만드는 감광 물질은?", "c": ["탄산나트륨", "할로겐화은", "젤라틴", "티오황산나트륨"], "a": 2, "e": "염화은·브롬화은·요오드화은 같은 할로겐화은 결정이 감광 물질이고, 젤라틴은 이 결정을 고르게 붙잡아 두는 매체다.", "s": 2, "ch": 7}, {"id": "S2-004", "topic": "감광재료", "q": "사진 유제에서 젤라틴이 하는 역할로 거리가 먼 것은?", "c": ["현상액이 유제층 안으로 스며들게 한다", "할로겐화은의 감도를 높이는 데 기여한다", "빛을 받아 직접 은으로 환원된다", "할로겐화은 결정을 고르게 분산시켜 유지한다"], "a": 3, "e": "빛을 받아 은으로 환원되는 것은 할로겐화은이다. 젤라틴은 결정을 붙들고 약액이 드나들 통로가 되는 보호 콜로이드 역할을 한다.", "s": 2, "ch": 7}, {"id": "S2-005", "topic": "잠상", "q": "잠상(latent image)에 대한 설명으로 옳은 것은?", "c": ["인화지에 맺힌 최종 상", "빛을 받은 할로겐화은에 생긴 눈에 보이지 않는 상", "현상까지 끝나 눈으로 볼 수 있게 된 상", "정착까지 마쳐 안정된 상"], "a": 2, "e": "노광으로 할로겐화은 결정에 극히 작은 은핵이 생기는데, 이것이 눈에 보이지 않는 잠상이다. 현상은 이 잠상핵을 중심으로 은을 증폭시켜 눈에 보이게 만드는 과정이다.", "s": 2, "ch": 7}, {"id": "S2-006", "topic": "감광도", "q": "필름이 일정한 빛에 대해 얼마나 민감하게 반응하는가를 나타내는 것은?", "c": ["감광도", "입상성", "관용도", "해상력"], "a": 1, "e": "감광도(감도)는 ISO·ASA·DIN 등으로 표시한다. 입상성은 알갱이의 거칠기, 관용도는 노출 허용 범위, 해상력은 세부 묘사 능력이다.", "s": 2, "ch": 7}, {"id": "S2-007", "topic": "감광도", "q": "ISO 100 필름과 비교할 때 ISO 400 필름의 특성으로 옳은 것은?", "c": ["감도는 2스톱 낮고 입자는 더 곱다", "감도는 4스톱 높고 입자는 더 곱다", "감도는 같고 관용도만 넓다", "감도는 2스톱 높고 입자는 더 거칠다"], "a": 4, "e": "ISO 수치가 2배가 되면 1스톱 높아진다. 100→200→400이므로 2스톱 차이다. 일반적으로 고감도일수록 입자가 거칠고 해상력·계조가 떨어진다.", "s": 2, "ch": 7}, {"id": "S2-008", "topic": "감광도", "q": "감광도 표시 방식 중 산술급수적으로 표시하는 것과 대수적(로그)으로 표시하는 것을 옳게 짝지은 것은?", "c": ["ISO - 대수식, DIN - 산술급수식", "ASA와 DIN 모두 대수식", "ASA - 산술급수식, DIN - 대수식", "ASA - 대수식, DIN - 산술급수식"], "a": 3, "e": "ASA는 감도가 2배면 수치도 2배가 되는 산술식, DIN은 감도 2배에 3이 더해지는 대수식이다. ISO는 둘을 함께 표기한다(예: ISO 100/21°).", "s": 2, "ch": 7}, {"id": "S2-009", "topic": "필름특성", "q": "입상성(graininess)에 대한 설명으로 옳지 않은 것은?", "c": ["확대 배율이 클수록 입자가 눈에 잘 띈다", "현상액의 종류와 현상 시간에 따라 달라진다", "증감현상을 하면 입자가 거칠어진다", "고감도 필름일수록 입자가 고와진다"], "a": 4, "e": "고감도 필름은 할로겐화은 결정이 커서 입자가 거칠다. 곱고 매끄러운 묘사를 원하면 저감도 필름을 쓴다.", "s": 2, "ch": 7}, {"id": "S2-010", "topic": "필름특성", "q": "필름의 관용도(latitude)에 대한 설명으로 옳은 것은?", "c": ["알갱이가 눈에 띄는 정도다", "현상액이 유제에 침투하는 속도다", "노출 오차를 허용하는 범위로, 넓을수록 노출 실수에 강하다", "화면의 세부를 분해해 내는 능력이다"], "a": 3, "e": "관용도는 적정 노출에서 벗어나도 쓸 만한 상을 얻는 범위다. 일반적으로 흑백 네거티브가 가장 넓고, 컬러 리버설이 가장 좁다.", "s": 2, "ch": 7}, {"id": "S2-011", "topic": "필름특성", "q": "관용도가 가장 좁아 노출을 정확히 맞춰야 하는 감광재료는?", "c": ["컬러 리버설(슬라이드) 필름", "흑백 네거티브 필름", "컬러 네거티브 필름", "고감도 흑백 필름"], "a": 1, "e": "리버설 필름은 촬영한 필름 자체가 최종 결과물이라 보정 여지가 거의 없다. 보통 ±1/2스톱 이내로 맞춘다.", "s": 2, "ch": 7}, {"id": "S2-012", "topic": "특성곡선", "q": "필름의 특성곡선(characteristic curve)에서 가로축과 세로축이 나타내는 것은?", "c": ["가로축은 현상 시간, 세로축은 감도", "가로축은 파장, 세로축은 반사율", "가로축은 노광량의 대수, 세로축은 농도", "가로축은 농도, 세로축은 노광량"], "a": 3, "e": "특성곡선(H&D 곡선)은 노광량(log E)에 따라 농도(D)가 어떻게 변하는지를 나타내며, 발부·직선부·어깨부·반전부로 이어진다.", "s": 2, "ch": 7}, {"id": "S2-013", "topic": "특성곡선", "q": "특성곡선에서 노광량과 농도가 비례하여 계조가 충실하게 재현되는 부분은?", "c": ["직선부", "발부(toe)", "어깨부(shoulder)", "반전부"], "a": 1, "e": "직선부는 노광이 늘어난 만큼 농도도 늘어나는 구간으로, 적정 노출은 주요 피사체가 이 구간에 오도록 맞춘다.", "s": 2, "ch": 7}, {"id": "S2-014", "topic": "특성곡선", "q": "특성곡선의 직선부 기울기로 나타내며 필름의 콘트라스트 정도를 뜻하는 것은?", "c": ["감마(γ)", "포그(fog)", "최대농도(Dmax)", "관용도"], "a": 1, "e": "감마는 직선부의 기울기다. 감마가 크면 경조(하드), 작으면 연조(소프트)한 상이 된다. 현상 시간이 길어질수록 감마는 커진다.", "s": 2, "ch": 7}, {"id": "S2-015", "topic": "특성곡선", "q": "노광을 전혀 주지 않은 부분에도 나타나는 최소한의 농도를 뜻하는 것은?", "c": ["카브리(포그)", "최대농도", "감마", "할레이션"], "a": 1, "e": "카브리(fog)는 베이스 농도와 유제의 자연 발생 농도를 합한 것으로, 필름의 유효기간이 지나거나 고온에 보관하면 커진다.", "s": 2, "ch": 7}, {"id": "S2-016", "topic": "상반칙불궤", "q": "상반칙불궤(相反則不軌) 현상이 나타나기 쉬운 조건은?", "c": ["감도가 낮은 필름을 쓸 때", "극단적으로 길거나 짧은 노출을 줄 때", "1/125초 정도의 일반적인 노출을 줄 때", "조리개만 바꾸고 셔터속도를 유지할 때"], "a": 2, "e": "조리개와 셔터속도의 상반 법칙은 통상 범위에서만 성립한다. 수 초 이상의 장노출이나 1/10000초 수준의 극단적 단노출에서는 유효 감도가 떨어지고 컬러 밸런스도 무너진다.", "s": 2, "ch": 7}, {"id": "S2-017", "topic": "필름종류", "q": "가시광선 전 영역에 고르게 감광하여 오늘날 일반 흑백 필름에 쓰이는 유제는?", "c": ["블루 센서티브", "적외선 필름", "팬크로매틱", "오소크로매틱"], "a": 3, "e": "팬크로매틱은 전 색광에 감광해 색을 자연스러운 밝기로 옮긴다. 오소크로매틱은 적색에 감광하지 않아 암실 적색등 아래서 다룰 수 있다.", "s": 2, "ch": 7}, {"id": "S2-018", "topic": "필름종류", "q": "오소크로매틱 필름의 특징으로 옳은 것은?", "c": ["청색광에만 감광한다", "적색광에 감광하지 않아 붉은색이 검게 재현된다", "모든 색에 고르게 감광한다", "적외선 영역까지 감광한다"], "a": 2, "e": "오소크로매틱은 청색·녹색에는 감광하지만 적색에는 감광하지 않는다. 그래서 붉은 입술이 검게 나오는 특징이 있다.", "s": 2, "ch": 7}, {"id": "S2-019", "topic": "필름보관", "q": "필름 보관 방법으로 옳지 않은 것은?", "c": ["유효기간 내에 사용한다", "고온다습한 곳에 오래 두어도 감도 변화는 없다", "냉장 보관한 필름은 사용 전에 상온에 두어 결로를 피한다", "방사선·엑스선을 피해 보관한다"], "a": 2, "e": "고온다습은 카브리를 키우고 감도와 색 균형을 무너뜨린다. 장기 보관은 저온·저습이 원칙이다.", "s": 2, "ch": 7}, {"id": "S2-020", "topic": "디지털", "q": "디지털 카메라에서 필름의 역할을 대신하는 촬상소자는?", "c": ["셔터막", "로우패스 필터", "이미지 센서(CCD·CMOS)", "펜타프리즘"], "a": 3, "e": "CCD와 CMOS는 빛을 전기 신호로 바꾸는 반도체 소자다. 최근에는 소비전력과 처리속도에서 유리한 CMOS가 주로 쓰인다.", "s": 2, "ch": 6}, {"id": "S2-021", "topic": "흑백현상", "q": "흑백 필름 현상의 기본 공정 순서로 옳은 것은?", "c": ["현상 - 수세 - 정지 - 정착 - 건조", "현상 - 정지 - 정착 - 수세 - 건조", "현상 - 정착 - 정지 - 수세 - 건조", "정지 - 현상 - 정착 - 건조 - 수세"], "a": 2, "e": "현상으로 잠상을 은상으로 키우고, 정지로 현상을 멈추며, 정착으로 남은 할로겐화은을 녹여내고, 수세로 약품을 씻어낸 뒤 건조한다.", "s": 2, "ch": 7}, {"id": "S2-022", "topic": "현상액", "q": "흑백 현상액의 5대 성분에 해당하지 않는 것은?", "c": ["촉진제", "티오황산나트륨", "현상 주약", "보항제"], "a": 2, "e": "현상액은 현상 주약·보항제·촉진제·억제제·용매(물)로 이루어진다. 티오황산나트륨(하이포)은 정착액의 주성분이다.", "s": 2, "ch": 7}, {"id": "S2-023", "topic": "현상액", "q": "흑백 현상액의 현상 주약으로 널리 쓰이는 약품끼리 묶인 것은?", "c": ["아황산나트륨과 탄산나트륨", "초산과 티오황산나트륨", "브롬화칼륨과 명반", "메톨과 하이드로퀴논"], "a": 4, "e": "메톨은 저농도에서 부드러운 계조를, 하이드로퀴논은 높은 농도와 콘트라스트를 만든다. 둘을 섞은 MQ 현상액이 대표적이다.", "s": 2, "ch": 7}, {"id": "S2-024", "topic": "현상액", "q": "현상액에서 아황산나트륨이 하는 주된 역할은?", "c": ["현상을 촉진하는 알칼리 역할", "카브리를 억제하는 역할", "현상을 정지시키는 역할", "현상 주약의 산화를 막는 보항제 역할"], "a": 4, "e": "아황산나트륨은 공기 중 산소에 의한 현상액 산화를 막아 수명을 늘린다. 촉진제는 탄산나트륨 등 알칼리, 억제제는 브롬화칼륨이다.", "s": 2, "ch": 7}, {"id": "S2-025", "topic": "현상액", "q": "현상액에 브롬화칼륨(KBr)을 넣는 이유로 옳은 것은?", "c": ["유제를 단단하게 굳힌다", "정착 시간을 줄인다", "노광되지 않은 부분이 현상되는 것을 억제해 카브리를 줄인다", "현상 속도를 빠르게 한다"], "a": 3, "e": "브롬화칼륨은 억제제(감마제)로, 잠상이 없는 부분까지 현상되는 것을 막아 맑은 흰 부분을 얻게 해 준다.", "s": 2, "ch": 7}, {"id": "S2-026", "topic": "현상", "q": "흑백 필름 현상액의 표준 온도로 가장 널리 쓰이는 것은?", "c": ["30℃", "38℃", "20℃", "10℃"], "a": 3, "e": "흑백 현상의 표준은 20℃다. 온도가 높으면 현상이 빨라져 농도와 콘트라스트가 올라가고 입자도 거칠어지므로 시간을 줄여 보정한다.", "s": 2, "ch": 7}, {"id": "S2-027", "topic": "현상", "q": "현상 시간을 표준보다 길게 했을 때 네거티브에 나타나는 변화로 옳은 것은?", "c": ["감도가 낮아지고 관용도가 넓어진다", "변화가 없다", "농도와 콘트라스트가 높아지고 입자가 거칠어진다", "농도가 낮아지고 연조가 된다"], "a": 3, "e": "현상 시간이 길수록 감마가 커져 경조해진다. 이 성질을 이용해 저조도 상황에서 감도를 올리는 것이 증감현상(푸싱)이다.", "s": 2, "ch": 7}, {"id": "S2-028", "topic": "현상", "q": "현상 중 교반(agitation)을 하는 이유로 가장 옳은 것은?", "c": ["현상액의 온도를 낮추기 위해", "필름의 감도를 높이기 위해", "정착 시간을 줄이기 위해", "유제 표면의 소모된 약액을 새 약액으로 바꿔 얼룩을 막기 위해"], "a": 4, "e": "교반하지 않으면 현상 부산물이 유제 표면에 머물러 줄무늬 얼룩이 생긴다. 반대로 지나치게 교반하면 가장자리 농도가 높아진다.", "s": 2, "ch": 7}, {"id": "S2-029", "topic": "정지액", "q": "정지액의 주성분과 역할로 옳은 것은?", "c": ["초산 - 알칼리성 현상액을 중화해 현상을 즉시 멈춘다", "티오황산나트륨 - 미노광 할로겐화은을 제거한다", "탄산나트륨 - 현상을 촉진한다", "명반 - 유제를 굳힌다"], "a": 1, "e": "현상액은 알칼리성이므로 약산성인 초산액에 담그면 현상이 곧바로 멈춘다. 정지액을 쓰면 정착액의 수명도 길어진다.", "s": 2, "ch": 7}, {"id": "S2-030", "topic": "정착액", "q": "정착액의 주된 작용으로 옳은 것은?", "c": ["현상되지 않고 남은 할로겐화은을 녹여내 상을 안정시킨다", "은을 금속은으로 환원시킨다", "유제층의 팽윤을 촉진한다", "필름의 감도를 높인다"], "a": 1, "e": "정착의 주약은 티오황산나트륨(하이포)이나 티오황산암모늄이며, 남은 할로겐화은을 수용성 착염으로 만들어 씻어낼 수 있게 한다.", "s": 2, "ch": 7}, {"id": "S2-031", "topic": "정착액", "q": "정착이 부족했을 때 사진에 나타나는 현상으로 옳은 것은?", "c": ["감도가 올라간다", "시간이 지나면서 변색되고 상이 누렇게 흐려진다", "콘트라스트가 지나치게 높아진다", "입자가 고와진다"], "a": 2, "e": "미정착 할로겐화은이 남으면 빛과 습기에 반응해 갈변한다. 반대로 정착이 지나치게 길면 은상까지 녹아 농도가 떨어진다.", "s": 2, "ch": 7}, {"id": "S2-032", "topic": "수세", "q": "수세(washing)를 충분히 하지 않으면 생기는 문제로 옳은 것은?", "c": ["할레이션이 생긴다", "잔류 티오황산염 때문에 상이 변색되고 보존성이 나빠진다", "현상이 계속 진행되어 농도가 높아진다", "입상성이 거칠어진다"], "a": 2, "e": "수세는 정착액과 반응 생성물을 씻어내는 과정이다. 수세촉진제(하이포 클리어링)를 쓰면 시간과 물을 아낄 수 있다.", "s": 2, "ch": 7}, {"id": "S2-033", "topic": "증감현상", "q": "어두운 곳에서 ISO 400 필름을 ISO 1600으로 설정해 촬영한 뒤 현상 시간을 늘리는 처리는?", "c": ["감감현상(pull)", "반전현상", "리터칭", "증감현상(push)"], "a": 4, "e": "푸싱은 노출 부족분을 현상 시간을 늘려 보완하는 방법이다. 대신 입자가 거칠어지고 콘트라스트가 올라가며 그림자 부분의 계조가 손실된다.", "s": 2, "ch": 7}, {"id": "S2-034", "topic": "인화", "q": "확대기(enlarger)의 구성 요소로 거리가 먼 것은?", "c": ["펜타프리즘", "광원(램프)", "집광장치(콘덴서)", "확대 렌즈"], "a": 1, "e": "펜타프리즘은 일안 반사식 카메라에서 상을 정립시키는 부품이다. 확대기는 광원·집광장치·네거티브 캐리어·확대렌즈·이젤로 구성된다.", "s": 2, "ch": 7}, {"id": "S2-035", "topic": "인화", "q": "인화지의 호수(계조 번호)에 대한 설명으로 옳은 것은?", "c": ["번호가 클수록 콘트라스트가 높은(경조) 인화지다", "번호가 클수록 부드러운(연조) 인화지다", "번호는 인화지의 크기를 뜻한다", "번호는 인화지의 두께를 뜻한다"], "a": 1, "e": "보통 0~5호로 나뉘며 숫자가 커질수록 경조하다. 연조한 네거티브에는 높은 호수를, 경조한 네거티브에는 낮은 호수를 써서 균형을 맞춘다.", "s": 2, "ch": 7}, {"id": "S2-036", "topic": "인화", "q": "한 종류의 인화지로 필터만 바꿔 여러 단계의 콘트라스트를 얻을 수 있는 인화지는?", "c": ["광택 인화지", "멀티그레이드(가변계조) 인화지", "바리타 인화지", "RC 인화지"], "a": 2, "e": "멀티그레이드지는 콘트라스트가 다른 두 유제를 함께 발라, 마젠타·옐로 계열 필터로 계조를 조절한다.", "s": 2, "ch": 7}, {"id": "S2-037", "topic": "인화", "q": "RC(Resin Coated) 인화지가 바리타(FB) 인화지에 비해 갖는 장점으로 옳은 것은?", "c": ["보존성이 훨씬 뛰어나 작품 보관에 유리하다", "농도 재현 범위가 훨씬 넓다", "약품 소모가 전혀 없다", "수세와 건조가 빠르고 취급이 간편하다"], "a": 4, "e": "RC지는 종이 양면을 수지로 코팅해 약액이 종이에 스미지 않아 수세·건조가 빠르다. 다만 장기 보존성과 최대 농도는 바리타지가 낫다.", "s": 2, "ch": 7}, {"id": "S2-038", "topic": "인화", "q": "인화 시 화면의 특정 부분만 노광을 줄여 밝게 만드는 기법은?", "c": ["리터칭", "닷징(dodging)", "버닝(burning)", "솔라리제이션"], "a": 2, "e": "닷징은 손이나 도구로 빛을 가려 그 부분을 밝게 하고, 버닝은 반대로 특정 부분에 노광을 더 주어 어둡게 만든다.", "s": 2, "ch": 7}, {"id": "S2-039", "topic": "인화", "q": "확대 인화에서 본 인화 전에 여러 단계의 노광을 시험해 적정 노광 시간을 찾는 작업은?", "c": ["테스트 스트립(시험 인화)", "드라이 다운", "브라케팅", "증감현상"], "a": 1, "e": "인화지 한 조각에 노광 시간을 단계별로 주어 현상해 보고 가장 적절한 시간을 고르는 방법이다.", "s": 2, "ch": 7}, {"id": "S2-040", "topic": "암실", "q": "흑백 인화 작업 시 사용하는 안전등(safelight)의 색으로 가장 적절한 것은?", "c": ["녹색", "암적색", "청색", "백색"], "a": 2, "e": "일반 흑백 인화지는 청·녹색에만 감광하므로 암적색등 아래에서 다룰 수 있다. 반면 팬크로매틱 필름은 전 색광에 감광해 완전 암흑에서 다뤄야 한다.", "s": 2, "ch": 7}, {"id": "S2-041", "topic": "컬러현상", "q": "컬러 네거티브 필름의 표준 현상 처리 방식은?", "c": ["D-76", "RA-4", "C-41", "E-6"], "a": 3, "e": "C-41은 컬러 네거티브 필름, E-6는 컬러 리버설 필름, RA-4는 컬러 인화지의 처리 방식이다. D-76은 흑백 현상액 이름이다.", "s": 2, "ch": 7}, {"id": "S2-042", "topic": "컬러현상", "q": "컬러 리버설(슬라이드) 필름의 현상 처리 방식은?", "c": ["RA-4", "P-3", "E-6", "C-41"], "a": 3, "e": "E-6 처리는 1차 흑백현상 후 반전노광(또는 반전욕)을 거쳐 발색현상을 하여 포지티브 상을 얻는다.", "s": 2, "ch": 7}, {"id": "S2-043", "topic": "컬러현상", "q": "컬러 필름의 3층 유제가 각각 감광하는 색과 발색하는 색을 옳게 짝지은 것은?", "c": ["청감층 - 노랑, 녹감층 - 마젠타, 적감층 - 시안", "청감층 - 시안, 녹감층 - 노랑, 적감층 - 마젠타", "청감층 - 마젠타, 녹감층 - 시안, 적감층 - 노랑", "세 층 모두 같은 색으로 발색한다"], "a": 1, "e": "각 층은 자신이 감광한 색의 보색으로 발색한다. 청색을 받은 층은 노랑, 녹색을 받은 층은 마젠타, 적색을 받은 층은 시안 색소를 만든다.", "s": 2, "ch": 7}, {"id": "S2-044", "topic": "컬러현상", "q": "컬러 현상에서 흑백 현상보다 온도 관리가 훨씬 엄격한 이유로 가장 옳은 것은?", "c": ["세 유제층의 발색 균형이 온도 차에 따라 무너져 색이 틀어지기 때문", "현상액이 폭발할 위험이 있기 때문", "필름이 녹기 때문", "정착이 되지 않기 때문"], "a": 1, "e": "C-41은 약 38℃에서 ±0.3℃ 수준의 관리를 요구한다. 온도가 어긋나면 층별 현상 속도가 달라져 컬러 캐스트가 생긴다.", "s": 2, "ch": 7}, {"id": "S2-045", "topic": "컬러현상", "q": "컬러 인화에서 인화물이 전체적으로 노랗게 나왔을 때의 보정 방법으로 옳은 것은?", "c": ["마젠타 필터 값을 높인다", "시안 필터 값을 낮춘다", "노광 시간을 늘린다", "옐로 필터 값을 높여 노랑을 줄인다"], "a": 4, "e": "감색법 인화에서는 과다한 색과 같은 색 필터를 더해 그 색을 뺀다. 노랗게 나오면 옐로 필터를 더하고, 붉게 나오면 마젠타와 옐로를 함께 조정한다.", "s": 2, "ch": 7}, {"id": "S2-046", "topic": "디지털", "q": "디지털 이미지에서 화소(pixel)에 대한 설명으로 옳은 것은?", "c": ["렌즈의 최소 조리개 값", "센서의 감도 단위", "이미지를 구성하는 가장 작은 단위의 점", "인화지의 표면 입자"], "a": 3, "e": "픽셀은 picture element의 줄임말로, 디지털 이미지의 최소 구성 단위다. 가로×세로 픽셀 수가 이미지의 화소 수가 된다.", "s": 2, "ch": 6}, {"id": "S2-047", "topic": "디지털", "q": "채널당 8비트인 RGB 이미지가 표현할 수 있는 색의 수는?", "c": ["1024색", "약 1677만 색", "256색", "65536색"], "a": 2, "e": "채널당 8비트면 각 채널 256단계이므로 256의 3제곱, 약 1677만 색이 된다. 16비트로 촬영·편집하면 계조가 훨씬 풍부해진다.", "s": 2, "ch": 6}, {"id": "S2-048", "topic": "디지털", "q": "RAW 파일의 특징으로 옳지 않은 것은?", "c": ["센서가 받은 데이터를 거의 그대로 담고 있다", "화이트밸런스와 노출을 사후에 손실 없이 조정하기 유리하다", "현상(변환) 과정을 거쳐야 일반 이미지로 쓸 수 있다", "파일 용량이 작고 어떤 프로그램에서나 바로 열린다"], "a": 4, "e": "RAW는 용량이 크고 제조사별 전용 포맷이라 전용 변환 소프트웨어가 필요하다. 대신 화질 손실 없이 보정할 수 있는 폭이 넓다.", "s": 2, "ch": 6}, {"id": "S2-049", "topic": "디지털", "q": "JPEG 파일 형식에 대한 설명으로 옳은 것은?", "c": ["무손실 압축이라 몇 번을 저장해도 화질이 같다", "레이어를 그대로 저장할 수 있다", "인쇄용 CMYK만 지원한다", "손실 압축 방식이라 저장을 반복할수록 화질이 나빠진다"], "a": 4, "e": "JPEG은 사람 눈이 둔감한 정보를 버리는 손실 압축이라 재저장할 때마다 열화된다. 무손실이 필요하면 TIFF나 PNG를 쓴다.", "s": 2, "ch": 6}, {"id": "S2-050", "topic": "디지털", "q": "디지털 카메라에서 광원의 색온도에 맞춰 흰색이 희게 나오도록 맞추는 기능은?", "c": ["노출보정", "다이내믹 레인지", "화이트밸런스", "히스토그램"], "a": 3, "e": "필름에서 색온도 변환 필터가 하던 일을 디지털에서는 화이트밸런스가 한다. 정확히 맞추려면 그레이카드로 커스텀 화이트밸런스를 잡는다.", "s": 2, "ch": 6}, {"id": "S2-051", "topic": "디지털", "q": "히스토그램에서 그래프가 오른쪽 끝에 붙어 잘려 있다면 어떤 상태인가?", "c": ["화이트밸런스가 틀어진 상태", "하이라이트가 날아가 밝은 부분의 계조가 손실된 상태", "그림자가 뭉개진 상태", "노출이 부족한 상태"], "a": 2, "e": "오른쪽 끝은 순백, 왼쪽 끝은 순흑을 뜻한다. 오른쪽에 몰려 잘리면 노출 과다로 하이라이트 정보가 복구 불가능하게 손실된 것이다.", "s": 2, "ch": 6}, {"id": "S2-052", "topic": "디지털", "q": "디지털 사진에서 노이즈가 가장 많이 발생하는 조건은?", "c": ["고감도(ISO)로 장시간 노출할 때", "저감도로 짧게 노출할 때", "조리개를 조였을 때", "화이트밸런스를 자동으로 둘 때"], "a": 1, "e": "ISO를 올리면 신호와 함께 잡음도 증폭되고, 장노출은 센서 발열로 노이즈가 늘어난다. 필름의 입상성에 대응하는 개념이다.", "s": 2, "ch": 6}, {"id": "S2-053", "topic": "디지털", "q": "색공간 중 표현 범위(색역)가 더 넓어 인쇄·출력용 작업에 유리한 것은?", "c": ["비트맵", "Adobe RGB", "sRGB", "그레이스케일"], "a": 2, "e": "Adobe RGB는 sRGB보다 특히 청록 계열의 색역이 넓다. 다만 웹 게시용으로는 sRGB로 변환해야 색이 제대로 보인다.", "s": 2, "ch": 6}, {"id": "S2-054", "topic": "디지털", "q": "해상도 단위에 대한 설명으로 옳은 것은?", "c": ["dpi는 파일 용량의 단위다", "ppi는 감도 단위다", "ppi는 모니터 표시 해상도, dpi는 출력물의 인쇄 해상도를 뜻한다", "ppi와 dpi는 완전히 같은 말이다"], "a": 3, "e": "ppi는 pixels per inch, dpi는 dots per inch다. 일반적인 사진 인화 출력에는 약 300dpi가 기준으로 쓰인다.", "s": 2, "ch": 6}, {"id": "S2-055", "topic": "디지털", "q": "3000×2000 픽셀 이미지를 300dpi로 인화할 때의 출력 크기는?", "c": ["100×67인치", "10×6.7인치", "30×20인치", "3×2인치"], "a": 2, "e": "픽셀 수를 dpi로 나누면 인치 크기가 된다. 3000÷300=10인치, 2000÷300≒6.7인치다.", "s": 2, "ch": 6}, {"id": "S2-056", "topic": "디지털", "q": "이미지 센서 크기가 촬영 결과에 미치는 영향으로 옳은 것은?", "c": ["센서가 작을수록 같은 렌즈에서 화각이 좁아지는 효과가 난다", "센서가 작을수록 화각이 넓어진다", "센서 크기는 화각과 무관하다", "센서가 작을수록 피사계심도가 얕아진다"], "a": 1, "e": "APS-C 센서는 35mm 판형 대비 약 1.5배의 환산계수를 가져 50mm 렌즈가 약 75mm 화각으로 보인다. 또 작은 센서일수록 같은 화각에서 심도가 깊어진다.", "s": 2, "ch": 6}, {"id": "S2-057", "topic": "디지털", "q": "필름의 감도(ISO)와 디지털 카메라의 ISO 감도의 관계로 옳은 것은?", "c": ["디지털에서는 ISO를 올려도 노출이 변하지 않는다", "같은 노출 기준을 쓰며, 수치가 2배면 1스톱 밝아진다", "서로 다른 기준이라 비교할 수 없다", "디지털 ISO는 2배가 2스톱에 해당한다"], "a": 2, "e": "두 체계는 같은 노출 기준을 공유한다. ISO 100→200은 1스톱 증가이고, 그만큼 셔터속도를 빠르게 하거나 조리개를 조일 수 있다.", "s": 2, "ch": 6}, {"id": "S2-058", "topic": "보존", "q": "현상이 끝난 필름을 건조할 때 주의할 점으로 옳지 않은 것은?", "c": ["먼지가 적은 곳에 매달아 자연 건조한다", "물기 제거를 위해 수적 방지제를 사용한다", "필름끼리 달라붙지 않게 간격을 둔다", "빠르게 말리기 위해 뜨거운 바람을 직접 강하게 쐬어준다"], "a": 4, "e": "급격한 고온 건조는 유제를 손상시키고 필름을 말리거나 변형시킨다. 먼지 없는 곳에서 서서히 말리는 것이 원칙이다.", "s": 2, "ch": 7}, {"id": "S2-059", "topic": "보존", "q": "완성된 사진과 필름의 장기 보존을 위한 조건으로 가장 적절한 것은?", "c": ["자외선이 잘 드는 창가에 보관한다", "산성 종이 봉투에 넣어 보관한다", "저온·저습에 직사광선을 피하고 중성지 보관용품을 사용한다", "고온·고습한 곳에 밀폐 보관한다"], "a": 3, "e": "산성 재질과 습기, 자외선은 은상과 색소를 열화시킨다. 아카이벌(중성) 재질의 슬리브와 항온항습 보관이 권장된다.", "s": 2, "ch": 7}, {"id": "S2-060", "topic": "필름특성", "q": "해상력(resolving power)에 대한 설명으로 옳은 것은?", "c": ["알갱이가 눈에 띄는 정도를 뜻한다", "노출 허용 범위를 뜻한다", "최대 농도의 크기를 뜻한다", "1mm 안에 몇 개의 선을 분해해 나타낼 수 있는가로 표시한다"], "a": 4, "e": "해상력은 보통 line/mm로 나타내며, 유제의 입자가 고울수록 높아진다. 실제 사진의 선예도는 필름 해상력과 렌즈 성능이 함께 좌우한다.", "s": 2, "ch": 7}, {"id": "S2-061", "topic": "디지털", "q": "디지털 카메라의 컬러 이미지 센서에서 화소마다 하나의 색만 받아들이게 하는 색필터 배열은?", "c": ["베이어 배열", "로우패스 배열", "펜타 배열", "할로겐 배열"], "a": 1, "e": "베이어 배열은 R:G:B 를 1:2:1 로 배치한다. 사람 눈이 녹색에 민감해 녹색 화소가 두 배다. 나머지 색은 보간(디모자이킹)으로 계산한다.", "s": 2, "ch": 6}, {"id": "S2-062", "topic": "디지털", "q": "이미지를 원래 크기보다 크게 늘릴 때 없던 화소를 계산해 채워 넣는 처리는?", "c": ["압축", "샤프닝", "캘리브레이션", "보간(interpolation)"], "a": 4, "e": "보간으로 늘린 이미지는 화소 수만 늘 뿐 실제 정보량은 늘지 않아 흐려진다. 큰 출력이 필요하면 처음부터 높은 화소로 찍어야 한다.", "s": 2, "ch": 6}, {"id": "S2-063", "topic": "색관리", "q": "모니터 캘리브레이션을 하는 이유로 가장 옳은 것은?", "c": ["화면의 색과 밝기를 표준에 맞춰 출력물과의 차이를 줄이기 위해", "모니터 수명을 늘리기 위해", "파일 용량을 줄이기 위해", "화소 수를 늘리기 위해"], "a": 1, "e": "보정하지 않은 모니터로 색을 맞추면 출력에서 전혀 다른 색이 나온다. 측색기로 프로파일을 만들어 색온도·감마·휘도를 표준화한다.", "s": 2, "ch": 6}, {"id": "S2-064", "topic": "색관리", "q": "ICC 프로파일이 하는 일로 옳은 것은?", "c": ["장치마다 다른 색 표현 특성을 기술해 장치 사이의 색을 맞춰 준다", "이미지의 화소 수를 늘려 준다", "파일을 압축해 준다", "노출을 자동으로 보정해 준다"], "a": 1, "e": "카메라·모니터·프린터의 색 특성을 기술한 파일이 ICC 프로파일이다. 이것을 기준으로 색을 변환해야 장치가 바뀌어도 색이 유지된다.", "s": 2, "ch": 6}, {"id": "S2-065", "topic": "디지털편집", "q": "이미지 보정에서 원본 화소를 직접 바꾸지 않고 되돌릴 수 있게 작업하는 방식은?", "c": ["해상도 축소", "일괄 자동 보정", "레이어와 마스크를 이용한 비파괴 편집", "JPEG으로 반복 저장"], "a": 3, "e": "조정 레이어와 마스크를 쓰면 원본은 그대로 두고 효과만 얹었다 뺄 수 있다. RAW 현상도 원본을 건드리지 않는 비파괴 편집이다.", "s": 2, "ch": 6}, {"id": "S2-066", "topic": "디지털편집", "q": "언샵 마스크(unsharp mask)로 선예도를 높일 때 지나치게 적용하면 나타나는 대표적인 문제는?", "c": ["화소 수가 줄어든다", "경계에 흰 테두리(헤일로)가 생기고 노이즈가 강조된다", "전체가 흐려진다", "색이 반전된다"], "a": 2, "e": "샤프닝은 경계의 명암 차를 키우는 처리라 과하면 윤곽에 테두리가 생기고 잡티까지 도드라진다. 출력 크기에 맞춰 마지막 단계에 적용한다.", "s": 2, "ch": 6}, {"id": "S2-067", "topic": "디지털", "q": "한 장면의 밝은 부분부터 어두운 부분까지 담을 수 있는 밝기 범위를 뜻하는 것은?", "c": ["비트 심도", "색역", "다이내믹 레인지", "해상도"], "a": 3, "e": "다이내믹 레인지가 좁으면 하이라이트가 날아가거나 그림자가 뭉갠다. 노출을 달리한 여러 장을 합치는 HDR 기법으로 넓히기도 한다.", "s": 2, "ch": 6}, {"id": "S2-068", "topic": "디지털", "q": "사진 파일에 촬영 일시, 조리개, 셔터속도, ISO 등이 자동으로 기록되는 정보는?", "c": ["CMYK", "EXIF", "ICC", "RAW"], "a": 2, "e": "EXIF는 촬영 조건이 그대로 남아 실패 원인을 되짚을 때 유용하다. 위치 정보가 함께 저장될 수 있어 공개 전에 확인이 필요하다.", "s": 2, "ch": 6}, {"id": "S2-069", "topic": "디지털", "q": "규칙적인 무늬의 피사체(옷감, 창살 등)를 찍을 때 화면에 물결 무늬가 생기는 현상은?", "c": ["할레이션", "비네팅", "포스터리제이션", "모아레"], "a": 4, "e": "피사체의 주기와 화소 배열의 주기가 간섭해 생긴다. 촬영 거리나 각도를 바꾸거나 로우패스 필터로 줄인다.", "s": 2, "ch": 6}, {"id": "S2-070", "topic": "디지털", "q": "8비트 이미지를 과도하게 보정했을 때 하늘처럼 완만한 계조에 띠가 생기는 현상은?", "c": ["모아레", "노이즈", "비네팅", "포스터리제이션(계조 단절)"], "a": 4, "e": "단계 수가 부족한 상태에서 계조를 늘려 벌리면 층이 눈에 보인다. RAW를 16비트로 현상해 보정하면 크게 줄어든다.", "s": 2, "ch": 6}, {"id": "S2-071", "topic": "디지털", "q": "조명이 섞인 실내에서 색을 정확히 맞추려 할 때 커스텀 화이트밸런스를 잡는 방법으로 옳은 것은?", "c": ["가장 밝은 부분을 찍어 기준으로 삼는다", "가장 어두운 부분을 찍어 기준으로 삼는다", "빨간색 물체를 찍어 기준으로 삼는다", "촬영할 조명 아래에서 무채색 그레이카드나 흰 종이를 찍어 기준으로 삼는다"], "a": 4, "e": "실제 광원 아래의 무채색을 기준으로 삼아야 카메라가 색 편차를 상쇄할 수 있다. 색이 있는 대상을 기준으로 잡으면 전체 색이 그 보색으로 틀어진다.", "s": 2, "ch": 6}, {"id": "S2-072", "topic": "디지털", "q": "히스토그램이 왼쪽 끝에 몰려 잘려 있다면 어떤 상태인가?", "c": ["노출이 과다한 상태", "화이트밸런스가 맞지 않는 상태", "초점이 맞지 않는 상태", "노출이 부족해 어두운 부분의 계조가 손실된 상태"], "a": 4, "e": "왼쪽은 순흑을 뜻한다. 왼쪽에 몰려 잘리면 그림자가 뭉개져 정보가 사라진 것이므로 노출을 더 주어야 한다.", "s": 2, "ch": 6}, {"id": "S2-073", "topic": "디지털", "q": "RGB 와 CMYK 색상 모드의 용도로 옳은 것은?", "c": ["RGB 는 인쇄용, CMYK 는 웹용이다", "둘 다 인쇄 전용이다", "둘 다 표현 가능한 색의 범위가 완전히 같다", "RGB 는 모니터·웹 표시용, CMYK 는 인쇄용이다"], "a": 4, "e": "RGB는 빛의 가산혼합, CMYK는 잉크의 감산혼합이다. RGB에서 표현되던 선명한 색이 CMYK로 변환하면 탁해질 수 있어 인쇄 전 확인이 필요하다.", "s": 2, "ch": 6}, {"id": "S2-074", "topic": "디지털", "q": "광학 줌과 디지털 줌의 차이로 옳은 것은?", "c": ["광학 줌은 렌즈로 확대해 화질 손실이 없고, 디지털 줌은 화면을 잘라 키워 화질이 떨어진다", "디지털 줌이 광학 줌보다 화질이 좋다", "둘은 원리가 같다", "광학 줌은 화소를 보간해서 만든다"], "a": 1, "e": "디지털 줌은 결국 크롭과 확대다. 나중에 편집에서 잘라내는 것과 다르지 않으므로 촬영 시에는 광학 줌을 쓰는 편이 낫다.", "s": 2, "ch": 6}, {"id": "S2-075", "topic": "디지털", "q": "촬영 데이터를 안전하게 관리하는 방법으로 가장 적절한 것은?", "c": ["작업이 끝나면 원본을 지우고 보정본만 남긴다", "한 하드디스크 안에 폴더를 나누어 두 번 저장한다", "원본을 서로 다른 매체 두 곳 이상에 복사해 두고 한 벌은 다른 장소에 둔다", "메모리카드에만 보관한다"], "a": 3, "e": "같은 장치 안의 복사본은 그 장치가 고장 나면 함께 사라진다. 매체를 나누고 장소를 나누는 것이 백업의 기본이다.", "s": 2, "ch": 6}, {"id": "S2-076", "topic": "디지털", "q": "보정 중간 저장이나 인쇄 원고용으로 적합한, 손실 없이 저장되는 파일 형식은?", "c": ["TIFF", "JPEG", "GIF", "기본 화질 JPEG"], "a": 1, "e": "TIFF는 무손실이라 반복 저장해도 열화가 없고 레이어·16비트를 담을 수 있다. 대신 용량이 크다.", "s": 2, "ch": 6}, {"id": "S2-077", "topic": "필름종류", "q": "흔히 쓰이는 필름 규격의 이름으로 옳은 것은?", "c": ["135 필름은 35mm, 120 필름은 중형용이다", "135 필름은 중형, 120 필름은 35mm 용이다", "135 필름은 대형 시트필름이다", "120 필름은 영화용 필름이다"], "a": 1, "e": "135는 35mm 판형(24×36mm), 120은 6×4.5·6×6·6×7 등 중형에 쓴다. 대형은 4×5인치 같은 낱장 시트필름이다.", "s": 2, "ch": 7}, {"id": "S2-078", "topic": "현상", "q": "현상 탱크에 필름을 감을 때 지켜야 할 사항으로 옳은 것은?", "c": ["젖은 손으로 빠르게 감는다", "릴에 두 롤을 겹쳐 감아 시간을 아낀다", "완전한 암흑에서 감고, 유제면이 겹치거나 눌리지 않게 한다", "암적색 안전등 아래에서 감는다"], "a": 3, "e": "팬크로매틱 필름은 모든 색광에 감광하므로 안전등도 쓸 수 없다. 필름끼리 붙으면 그 부분이 현상되지 않아 얼룩이 남는다.", "s": 2, "ch": 7}, {"id": "S2-079", "topic": "현상액", "q": "입자를 곱게 만들기 위해 사용하는 현상액의 특징으로 옳은 것은?", "c": ["현상 작용이 완만해 입상성이 좋아지는 대신 현상 시간이 길다", "현상이 매우 빨라 시간이 짧다", "콘트라스트를 극단적으로 높인다", "정착 작용을 함께 한다"], "a": 1, "e": "미립자 현상액은 은 입자를 잘게 만들어 확대에 유리하다. 대신 감도가 다소 떨어지고 시간이 길어진다.", "s": 2, "ch": 7}, {"id": "S2-080", "topic": "정착액", "q": "정착액이 다 되었는지 판정하는 실용적인 방법으로 옳은 것은?", "c": ["온도가 올라가면 새것이다", "필름 조각이 맑아지는 데 걸리는 시간이 처음의 두 배가 되면 교체한다", "색이 변하면 무조건 새것이다", "냄새로 판단한다"], "a": 2, "e": "클리어링 타임이 두 배로 늘면 수명이 다한 것으로 본다. 소진된 정착액을 계속 쓰면 미정착이 남아 사진이 변색된다.", "s": 2, "ch": 7}, {"id": "S2-081", "topic": "인화", "q": "네거티브를 인화지에 직접 겹쳐 놓고 빛을 주어 원본 크기 그대로 뽑는 인화 방법은?", "c": ["합성인화", "밀착인화(콘택트 프린트)", "확대인화", "반전인화"], "a": 2, "e": "한 롤을 한 장에 모아 뽑으면 셀렉트용 콘택트 시트가 된다. 어떤 컷을 확대할지 고르는 데 쓴다.", "s": 2, "ch": 7}, {"id": "S2-082", "topic": "인화", "q": "집광식 확대기와 산광식 확대기의 차이로 옳은 것은?", "c": ["둘의 결과는 완전히 같다", "집광식은 콘트라스트가 높고 흠집이 잘 드러나며, 산광식은 부드럽고 흠집이 덜 보인다", "집광식이 더 부드럽다", "산광식이 콘트라스트가 더 높다"], "a": 2, "e": "집광식은 평행에 가까운 빛을 모아 선예하지만 먼지와 상처까지 또렷하다. 산광식은 확산광이라 계조가 부드럽다.", "s": 2, "ch": 7}, {"id": "S2-083", "topic": "인화", "q": "흑백 확대 인화의 공정 순서로 옳은 것은?", "c": ["노광 - 현상 - 정지 - 정착 - 수세 - 건조", "현상 - 노광 - 정착 - 정지 - 수세 - 건조", "노광 - 정착 - 현상 - 정지 - 건조 - 수세", "노광 - 현상 - 정착 - 정지 - 수세 - 건조"], "a": 1, "e": "필름 현상과 같은 흐름이다. 인화지는 노광이 먼저이며, 정지를 건너뛰면 현상액이 정착액에 섞여 수명이 짧아진다.", "s": 2, "ch": 7}, {"id": "S2-084", "topic": "암실", "q": "암실 안전등이 인화지에 영향을 주는지 확인하는 방법으로 옳은 것은?", "c": ["인화지 일부를 가린 채 안전등 아래 일정 시간 두었다가 현상해 농도 차를 본다", "안전등을 눈으로 보고 밝기를 판단한다", "인화지를 햇빛에 노출시켜 본다", "현상액 온도를 재어 본다"], "a": 1, "e": "안전등도 오래 쬐면 인화지를 감광시킨다. 가린 부분과 노출된 부분의 농도가 다르면 등이 너무 밝거나 거리가 가까운 것이다.", "s": 2, "ch": 7}, {"id": "S2-085", "topic": "인화", "q": "인화한 사진에 생긴 흰 점(먼지 자국)을 붓과 물감으로 메우는 후처리 작업은?", "c": ["솔라리제이션", "스포팅", "닷징", "버닝"], "a": 2, "e": "네거티브에 붙은 먼지는 인화에서 흰 점으로 나온다. 애초에 먼지가 붙지 않게 관리하는 것이 최선이다.", "s": 2, "ch": 7}, {"id": "S2-086", "topic": "현상", "q": "현상한 필름에 일정한 간격의 줄무늬 얼룩이 생겼다면 가장 유력한 원인은?", "c": ["정착 시간이 길었다", "건조 온도가 낮았다", "필름 감도가 높았다", "교반이 부족하거나 한 방향으로만 반복되었다"], "a": 4, "e": "스프로킷 구멍 부근에서 약액 흐름이 생겨 줄무늬가 나타난다. 교반 방향을 바꿔 가며 규칙적으로 하는 것이 해결책이다.", "s": 2, "ch": 7}, {"id": "S2-087", "topic": "필름종류", "q": "일반 사진 필름이 빛의 색에 대해 반응하는 감색성의 유형으로 옳지 않은 것은?", "c": ["정색성(Orthochromatic)", "전정색성(Panchromatic)", "자외선 감광(Ultraviolet)", "레귤러형(Blue Sensitive)"], "a": 3, "e": "감색성은 레귤러(청감성)·정색성·전정색성으로 나눈다. 오늘날 일반 흑백 필름은 전 색광에 반응하는 전정색성이다. 자외선 감광은 특수 목적 필름이다.", "s": 2, "ch": 7}, {"id": "S2-088", "topic": "필름종류", "q": "정색성(오소크로매틱) 필름의 특징으로 옳은 것은?", "c": ["청색광에만 감광한다", "적외선까지 감광한다", "적색광에 감광하지 않아 붉은 안전등 아래에서 다룰 수 있다", "모든 색광에 고르게 감광한다"], "a": 3, "e": "정색성은 청색과 녹색에는 반응하지만 적색에는 반응하지 않는다. 전정색성(팬크로매틱) 필름은 전 색광에 반응해 완전 암흑에서 다뤄야 한다.", "s": 2, "ch": 7}, {"id": "S2-089", "topic": "잠상", "q": "촬영한 필름을 현상하지 않고 오랫동안 방치하면 기록된 잠상이 서서히 소실되는 현상은?", "c": ["잠상흡수", "잠상퇴행", "잠상현상", "잠상손실"], "a": 2, "e": "잠상은 시간이 지날수록 약해지므로 촬영 후 되도록 빨리 현상해야 한다. 고온다습한 환경에서 더 빨리 진행된다.", "s": 2, "ch": 7}, {"id": "S2-090", "topic": "정착액", "q": "현상 과정에서 젤라틴이 팽윤되어 물러지는 것을 막아 주는 약품은?", "c": ["보력제", "정지액", "촉진제", "경막제"], "a": 4, "e": "경막제(명반 계열)는 정착액에 넣어 유제층을 단단하게 한다. 보력제는 옅은 상의 농도를 올리는 약품으로 역할이 다르다.", "s": 2, "ch": 7}, {"id": "S2-091", "topic": "현상", "q": "고온에서 현상한 필름을 저온에서 급격히 정착시켰을 때 유제 표면에 주름 모양의 요철이 생기는 현상은?", "c": ["솔라리제이션", "릴리프포토", "포토그램", "레티큘레이션"], "a": 4, "e": "공정 사이의 온도 차가 크면 유제가 급격히 수축해 그물 같은 무늬가 생긴다. 현상·정지·정착·수세의 온도를 비슷하게 맞춰야 한다.", "s": 2, "ch": 7}, {"id": "S2-092", "topic": "인화", "q": "컬러 사진을 인화할 때 확대기에 내장되어 색보정에 사용하는 필터는?", "c": ["폴리콘트라스트 필터", "멀티그레이드 필터", "색온도 변환용 필터", "다이크로익 필터"], "a": 4, "e": "다이크로익 필터는 특정 파장만 반사·투과시켜 시안·마젠타·옐로 값을 무단계로 조절한다. 멀티그레이드·폴리콘트라스트는 흑백 인화지의 계조 조절용이다.", "s": 2, "ch": 7}, {"id": "S2-093", "topic": "인화", "q": "컬러 인화용 색보정 필터 표기에서 CC30R 이 뜻하는 것은?", "c": ["컬러 보정용 0.3 농도의 레드 필터", "색온도를 3000K로 낮추는 레드 필터", "노출을 30% 줄이는 중성 필터", "붉은색을 3스톱 줄이는 필터"], "a": 1, "e": "CC는 Color Compensating, 30은 농도 0.30, R은 레드를 뜻한다. 농도 0.30은 약 1스톱에 해당한다.", "s": 2, "ch": 7}, {"id": "S2-094", "topic": "디지털", "q": "디지털 카메라의 이미지 센서에 해당하지 않는 것은?", "c": ["CMOS", "포베온 X3", "CMS", "CCD"], "a": 3, "e": "CMS는 Color Management System, 즉 색관리 시스템이라 센서가 아니다. 포베온 X3는 한 화소에서 세 색을 층으로 받아들이는 센서다.", "s": 2, "ch": 6}, {"id": "S2-095", "topic": "디지털", "q": "세계 최초의 디지털 카메라를 만든 회사와 개발자로 옳은 것은?", "c": ["코닥 - 스티븐 새슨", "소니 - 아카오 마사루", "라이카 - 안드레아스 카우프만", "핫셀블라드 - 빅토르 핫셀블라드"], "a": 1, "e": "1975년 코닥의 기술자 스티븐 새슨이 CCD를 이용한 시제품을 만들었다. 정작 코닥은 필름 사업을 지키려다 디지털 전환에 뒤처졌다.", "s": 2, "ch": 6}, {"id": "S2-096", "topic": "디지털", "q": "가로축은 밝기의 정도, 세로축은 각 밝기에 해당하는 화소 수를 기록하는 그래프는?", "c": ["커브", "브라이트니스", "히스토그램", "다이내믹 레인지"], "a": 3, "e": "히스토그램으로 노출 과다·부족을 객관적으로 판단한다. 커브는 입출력 밝기를 조절하는 보정 도구다.", "s": 2, "ch": 6}, {"id": "S2-097", "topic": "사진편집", "q": "포토샵에서 히스토그램을 보면서 암부·중간 농도·명부 슬라이더를 좌우로 옮겨 밝기를 조절하는 기능은?", "c": ["커브(Curves)", "컬러 밸런스(Color Balance)", "휴/새추레이션(Hue/Saturation)", "레벨(Levels)"], "a": 4, "e": "레벨은 검정점·중간점·흰점 세 슬라이더로 계조를 조절한다. 커브는 곡선으로 더 세밀하게 다루고, 휴/새추레이션은 색상과 채도를 다룬다.", "s": 2, "ch": 6}, {"id": "S2-098", "topic": "사진편집", "q": "포토샵의 커브(Curves)에 대한 설명으로 옳지 않은 것은?", "c": ["원본 대각선 그래프에서 곡선을 위쪽으로 들어 올리면 톤이 어두워진다", "대각선 그래프는 보정되기 전의 값을 나타낸다", "각 채널마다 곡선을 개별적으로 조절할 수 있다", "곡선의 형태로 콘트라스트를 알 수 있다"], "a": 1, "e": "곡선을 위로 올리면 밝아지고 아래로 내리면 어두워진다. S자 곡선은 콘트라스트를 높이는 대표적인 형태다.", "s": 2, "ch": 6}, {"id": "S2-099", "topic": "사진편집", "q": "포토샵에서 비슷한 색을 가진 영역을 클릭 한 번으로 선택할 수 있는 도구는?", "c": ["라소 툴", "마키 툴", "펜 툴", "매직완드 툴"], "a": 4, "e": "매직완드는 허용치(Tolerance) 안의 비슷한 색을 자동으로 묶어 선택한다. 라소는 자유 곡선, 마키는 사각·원형, 펜은 패스로 선택한다.", "s": 2, "ch": 6}, {"id": "S2-100", "topic": "사진편집", "q": "포토샵의 Image - Adjustments 항목에 들어 있지 않은 것은?", "c": ["Color Balance", "Desaturate", "Invert", "Artistic"], "a": 4, "e": "Artistic은 Filter 메뉴에 있는 예술 효과다. Adjustments에는 색과 톤을 다루는 명령이 모여 있다.", "s": 2, "ch": 6}, {"id": "S2-101", "topic": "사진편집", "q": "어도비 카메라 로우(ACR)와 비슷한 역할을 하는 RAW 현상·관리 프로그램은?", "c": ["일러스트레이터(Illustrator)", "라이트룸(Lightroom)", "브릿지(Bridge)", "인디자인(InDesign)"], "a": 2, "e": "라이트룸은 RAW 현상과 사진 관리를 함께 하는 프로그램이다. 브릿지는 파일 탐색, 인디자인은 편집 출판, 일러스트레이터는 벡터 그래픽용이다.", "s": 2, "ch": 6}, {"id": "S2-102", "topic": "사진편집", "q": "노출을 달리해 촬영한 여러 장을 한 장으로 합쳐, 밝은 곳과 어두운 곳이 모두 살아 있는 사진을 만드는 기능은?", "c": ["HDR 병합", "EES 병합", "HTS 병합", "EIS 병합"], "a": 1, "e": "HDR은 High Dynamic Range의 줄임말이다. 한 번의 노출로 담기 어려운 밝기 차가 큰 장면에 쓴다.", "s": 2, "ch": 6}, {"id": "S2-103", "topic": "사진편집", "q": "여러 장의 사진을 이어 붙여 파노라마를 만드는 포토샵 기능은?", "c": ["Panorama Filter", "Photomerge", "HDR", "ACR"], "a": 2, "e": "Photomerge는 겹치는 부분을 자동으로 정렬해 한 장으로 잇는다. 촬영할 때 30% 정도 겹치게 찍어 두어야 잘 붙는다.", "s": 2, "ch": 6}, {"id": "S2-104", "topic": "디지털", "q": "비트맵 이미지에 대한 설명으로 옳지 않은 것은?", "c": ["비트심도 정보를 가진 픽셀로 구성된 디지털 이미지다", "해상도를 표시할 때 주로 PPI 단위를 사용한다", "벡터 방식으로 선과 도형을 수학적 함수로 정의하여 구성된다", "확대하면 픽셀이 나타나며 모자이크처럼 구성되어 있다"], "a": 3, "e": "수학적 함수로 정의하는 것은 벡터 이미지다. 비트맵은 화소의 집합이라 확대하면 계단 현상이 나타난다.", "s": 2, "ch": 6}, {"id": "S2-105", "topic": "감광재료", "q": "다음 중 은(Ag)과 결합하여 감광성 유제를 이룰 수 없는 물질은?", "c": ["아이오딘(I)", "브로민(Br)", "질소(N)", "염소(Cl)"], "a": 3, "e": "감광재료는 염화은·브롬화은·요오드화은처럼 은과 할로겐 원소가 결합한 할로겐화은이다. 질소는 할로겐이 아니다.", "s": 2, "ch": 7}, {"id": "S2-106", "topic": "디지털", "q": "디지털 카메라에서 다이내믹 레인지에 관한 설명으로 옳지 않은 것은?", "c": ["더 넓은 다이내믹 레인지를 갖는 카메라는 고대비 상황에서 더 많은 디테일을 담을 수 있다", "센서의 크기와 품질이 작거나 낮아야 다이내믹 레인지가 좋다", "촬영한 사진의 밝은 영역과 어두운 영역의 디테일을 얼마나 보존할 수 있는지를 나타내는 용어다", "사진의 어두운 그림자부터 밝은 하이라이트까지 촬영할 수 있는 밝기 범위다"], "a": 2, "e": "센서가 크고 성능이 좋을수록 다이내믹 레인지가 넓다. 좁으면 하이라이트가 날아가거나 그림자가 뭉갠다.", "s": 2, "ch": 6}, {"id": "S2-107", "topic": "안전·환경", "q": "암실에서 작업할 때 안전을 위해 반드시 갖추어야 할 시설은?", "c": ["인화지 절단기", "냉온수 급수시설", "필름 건조기", "공기순환장치"], "a": 4, "e": "암실은 밀폐된 공간에서 약품을 다루므로 환기가 가장 중요하다. 절단기·급수시설·건조기는 작업 편의를 위한 설비다.", "s": 2, "ch": 4}, {"id": "S2-108", "topic": "안전·환경", "q": "현상 약품을 저장하는 용기로 적절하지 않은 것은?", "c": ["뚜껑이 있는 것", "약품량에 따라 저장 용기의 부피를 조절할 수 있는 것", "내용물보다 훨씬 큰 직육면체 용기", "갈색 병"], "a": 3, "e": "용기가 지나치게 크면 남는 공간의 공기 때문에 약액이 산화된다. 빛을 막는 갈색 병에 공기가 닿지 않게 채워 보관한다.", "s": 2, "ch": 4}, {"id": "S2-109", "topic": "디지털", "q": "촬영한 사진을 인쇄소에 넘길 때 색이 크게 달라지는 것을 줄이는 방법으로 가장 적절한 것은?", "c": ["프로파일을 지우고 넘긴다", "JPEG 최저 품질로 저장해 넘긴다", "해상도를 72ppi로 낮춰 넘긴다", "작업 색공간을 밝히고 ICC 프로파일을 파일에 포함해 전달한다"], "a": 4, "e": "프로파일이 없으면 받는 쪽에서 임의의 색공간으로 해석해 색이 틀어진다. 인쇄용은 대체로 300dpi, CMYK 변환 조건을 함께 확인한다.", "s": 2, "ch": 6}, {"id": "S2-110", "topic": "디지털", "q": "잉크젯 프린터로 사진을 출력할 때 용지 종류에 따른 특성으로 옳은 것은?", "c": ["무광지는 광택지보다 색이 더 진하게 나온다", "용지 종류는 출력 색에 영향을 주지 않는다", "광택지는 반사가 적어 전시용으로 가장 알맞다", "광택지는 색이 진하고 선명하지만 지문과 반사에 약하다"], "a": 4, "e": "광택지는 최대 농도가 높아 선명하지만 조명이 반사된다. 전시에는 반사가 적은 무광이나 반광을 쓰는 경우가 많다.", "s": 2, "ch": 6}, {"id": "S2-111", "topic": "디지털", "q": "메모리카드 관리 방법으로 옳지 않은 것은?", "c": ["촬영 데이터를 옮긴 뒤에는 백업을 확인하고 포맷한다", "접점 부위에 손을 대지 않고 케이스에 보관한다", "촬영이 끝나면 컴퓨터에서 파일을 잘라내기로 옮겨 카드를 비운다", "포맷은 컴퓨터가 아니라 카메라에서 한다"], "a": 3, "e": "잘라내기로 옮기면 복사 도중 오류가 났을 때 원본까지 사라진다. 복사한 뒤 확인하고 카메라에서 포맷하는 것이 안전하다.", "s": 2, "ch": 6}, {"id": "S2-112", "topic": "디지털", "q": "노이즈 리덕션을 지나치게 적용했을 때 나타나는 문제로 옳은 것은?", "c": ["세부 묘사가 뭉개져 사진이 밀랍처럼 매끈해진다", "입자가 더 거칠어진다", "색이 반전된다", "해상도가 높아진다"], "a": 1, "e": "노이즈와 세부는 모두 미세한 신호라 함께 지워진다. 감도를 낮추고 노출을 정확히 주는 것이 근본적인 해결이다.", "s": 2, "ch": 6}, {"id": "S2-113", "topic": "디지털", "q": "화이트밸런스 프리셋 가운데 색온도가 가장 낮은 광원에 대응하는 것은?", "c": ["그늘", "주광", "백열등(텅스텐)", "흐림"], "a": 3, "e": "백열등은 약 3200K로 가장 낮다. 프리셋은 그 광원의 붉은 기를 상쇄하도록 푸른 쪽으로 보정한다.", "s": 2, "ch": 6}, {"id": "S2-114", "topic": "디지털", "q": "이미지 센서 앞에 두어 규칙적 무늬로 생기는 모아레를 줄이는 부품은?", "c": ["IR 컷 필터", "로우패스 필터", "ND 필터", "편광 필터"], "a": 2, "e": "로우패스 필터는 미세한 무늬를 약간 흐려 모아레를 억제한다. 해상력을 위해 이를 뺀 기종도 있다.", "s": 2, "ch": 6}, {"id": "S2-115", "topic": "컬러현상", "q": "컬러 리버설 필름의 E-6 처리에서 흑백 현상 다음에 이어지는 공정으로 옳은 것은?", "c": ["곧바로 정착", "곧바로 수세", "곧바로 건조", "반전 처리 후 발색 현상"], "a": 4, "e": "1차 흑백현상으로 네거티브 은상을 만든 뒤, 반전 처리로 남은 할로겐화은을 활성화하고 발색현상에서 색소를 만든다. 그래서 포지티브가 된다.", "s": 2, "ch": 7}, {"id": "S2-116", "topic": "현상액", "q": "현상액을 1회용으로 쓰는 방식과 반복 사용하는 방식에 대한 설명으로 옳은 것은?", "c": ["1회용은 매번 같은 조건을 얻기 쉽고, 반복 사용은 소모된 만큼 시간을 늘려야 한다", "1회용은 결과가 매번 달라진다", "반복 사용해도 현상 시간은 항상 같다", "반복 사용이 1회용보다 항상 일정하다"], "a": 1, "e": "반복 사용하면 현상 주약이 소모되어 능력이 떨어지므로 보충액을 넣거나 시간을 늘려 보정한다. 일정한 결과를 원하면 1회용이 편하다.", "s": 2, "ch": 7}, {"id": "S2-117", "topic": "인화", "q": "인화지의 감도가 필름보다 훨씬 낮게 만들어진 이유로 옳은 것은?", "c": ["색을 재현하기 위해서", "보존성을 높이기 위해서", "안전등 아래에서 다루고 확대기의 강한 빛으로 노광하기 때문", "현상 시간을 줄이기 위해서"], "a": 3, "e": "인화지는 확대기 아래에서 몇 초에서 몇십 초를 노광한다. 감도가 높으면 안전등에도 감광해 다룰 수 없다.", "s": 2, "ch": 7}, {"id": "S2-118", "topic": "정지액", "q": "정지액이 없을 때 흐르는 물로 대신할 경우의 결과로 옳은 것은?", "c": ["현상은 멈추지만 정착액이 빨리 소모되고 얼룩이 생기기 쉽다", "현상이 더 잘 멈춘다", "정착액 수명이 길어진다", "농도가 높아진다"], "a": 1, "e": "물은 알칼리성 현상액을 중화하지 못하고 씻어낼 뿐이다. 남은 현상액이 정착액을 오염시켜 수명을 줄인다.", "s": 2, "ch": 7}, {"id": "S2-119", "topic": "보존", "q": "필름을 스캔해 디지털로 보관할 때 유의할 점으로 옳지 않은 것은?", "c": ["먼지를 제거한 뒤 스캔해야 후보정이 줄어든다", "넉넉한 해상도와 비트 심도로 받아 둔다", "무손실 포맷으로 저장하고 백업을 나눠 둔다", "스캔이 끝나면 원본 필름은 버려도 된다"], "a": 4, "e": "원본 필름은 기술이 좋아지면 다시 더 좋은 품질로 스캔할 수 있는 마스터다. 디지털 사본이 있다고 버리지 않는다.", "s": 2, "ch": 7}, {"id": "S2-120", "topic": "디지털", "q": "사진 파일을 관리할 때 권장되는 방법으로 가장 적절한 것은?", "c": ["용량을 아끼려고 압축률을 최대로 올려 저장한다", "촬영 날짜와 내용을 규칙적으로 담은 폴더·파일 이름 체계를 정해 둔다", "카메라가 붙인 이름을 그대로 두고 한 폴더에 모아 둔다", "보정본만 남기고 원본은 지운다"], "a": 2, "e": "일관된 이름 규칙이 있어야 나중에 찾을 수 있다. 원본은 보관하고 보정은 사본이나 비파괴 방식으로 한다.", "s": 2, "ch": 6}, {"id": "S2-121", "topic": "사진편집", "q": "포토샵에서 이미지 전체의 채도를 없애 흑백으로 만드는 명령은?", "c": ["Desaturate", "Invert", "Color Balance", "Levels"], "a": 1, "e": "Desaturate는 채도를 0으로 만든다. Invert는 명암과 색을 반전시켜 네거티브처럼 만든다.", "s": 2, "ch": 6}, {"id": "S2-122", "topic": "사진편집", "q": "사진의 일부만 잘라내어 구도를 다시 잡는 작업을 뜻하는 것은?", "c": ["브라케팅", "필터링", "트리밍", "스포팅"], "a": 3, "e": "트리밍(크롭)은 불필요한 부분을 잘라 주제를 강조한다. 다만 잘라낼수록 화소가 줄어 확대 출력에 불리해진다.", "s": 2, "ch": 6}]}, {"no": 3, "name": "사진기계 및 촬영", "questions": [{"id": "S3-001", "topic": "카메라구조", "q": "일안 반사식(SLR) 카메라에서 빛이 지나는 순서로 옳은 것은?", "c": ["렌즈 → 반사경 → 펜타프리즘 → 뷰파인더", "렌즈 → 펜타프리즘 → 반사경 → 뷰파인더", "반사경 → 렌즈 → 펜타프리즘 → 뷰파인더", "반사경 → 펜타프리즘 → 뷰파인더 → 렌즈"], "a": 1, "e": "렌즈를 통과한 빛이 반사경에서 위로 꺾여 초점판을 거쳐 펜타프리즘에서 상하좌우가 바로잡힌 뒤 뷰파인더로 간다. 촬영 순간에는 반사경이 올라가고 빛이 필름·센서로 간다.", "s": 3, "ch": 4}, {"id": "S3-002", "topic": "카메라구조", "q": "일안 반사식 카메라에서 상의 상하좌우를 바로잡아 주는 부품은?", "c": ["조리개", "반사경", "펜타프리즘", "셔터막"], "a": 3, "e": "반사경만 거치면 상이 좌우 반대로 보인다. 펜타프리즘(또는 펜타미러)이 이를 정립 정상으로 바꿔 준다.", "s": 3, "ch": 4}, {"id": "S3-003", "topic": "카메라구조", "q": "일안 반사식 카메라의 가장 큰 장점으로 옳은 것은?", "c": ["뷰파인더로 본 상과 촬영되는 상이 거의 같아 시차가 없다", "기계식이라 셔터 소리가 전혀 없다", "항상 상이 거꾸로 보인다", "렌즈 교환이 불가능하다"], "a": 1, "e": "촬영 렌즈를 그대로 들여다보므로 시차(패럴랙스)가 없고 심도·필터 효과도 그대로 확인된다. 대신 반사경 때문에 소리와 진동이 있다.", "s": 3, "ch": 4}, {"id": "S3-004", "topic": "카메라구조", "q": "레인지파인더(거리계 연동) 카메라의 단점으로 옳은 것은?", "c": ["심도가 항상 얕다", "뷰파인더와 렌즈의 위치 차이로 근접 촬영 시 시차가 생긴다", "셔터 소리가 매우 크다", "렌즈 교환이 불가능하다"], "a": 2, "e": "별도의 뷰파인더로 보기 때문에 가까운 거리일수록 실제 촬영 범위와 어긋난다. 대신 반사경이 없어 조용하고 진동이 적다.", "s": 3, "ch": 4}, {"id": "S3-005", "topic": "카메라구조", "q": "뷰카메라(대형 카메라)의 단점으로 옳지 않은 것은?", "c": ["신속하게 조작하기 어렵다", "초점판에 상이 상하좌우 거꾸로 보인다", "크고 무거워 삼각대가 반드시 필요하다", "눈으로 본 이미지와 필름에 기록되는 이미지가 달라 시차가 생긴다"], "a": 4, "e": "뷰카메라는 촬영 렌즈를 통해 초점판에서 직접 상을 보므로 시차가 없다. 상이 거꾸로 보이고 조작이 느린 것이 단점이다.", "s": 3, "ch": 4}, {"id": "S3-006", "topic": "카메라구조", "q": "카메라 셔터의 기능을 옳게 설명한 것은?", "c": ["빛을 받아들이는 시간을 조절한다", "빛의 양을 면적으로 조절한다", "촬영 범위를 결정한다", "피사체의 반사광을 모아 상을 만든다"], "a": 1, "e": "셔터는 시간, 조리개는 광량(면적)을 담당한다. 상을 맺는 것은 렌즈, 촬영 범위를 정하는 것은 초점거리와 판형이다.", "s": 3, "ch": 4}, {"id": "S3-007", "topic": "셔터", "q": "렌즈 셔터(lens shutter)의 특징으로 옳은 것은?", "c": ["고속에서 움직이는 피사체가 기울어져 찍힌다", "모든 셔터속도에서 플래시 동조가 가능하다", "최고 셔터속도가 매우 빠르다", "포컬플레인 방식이라 필름 바로 앞에 있다"], "a": 2, "e": "렌즈 셔터는 조리개 근처에서 화면 전체를 동시에 열고 닫으므로 전 속도 동조가 가능하다. 다만 최고속도가 1/500초 정도로 제한된다.", "s": 3, "ch": 4}, {"id": "S3-008", "topic": "셔터", "q": "포컬플레인 셔터의 특징으로 옳지 않은 것은?", "c": ["렌즈 교환식 카메라에 널리 쓰인다", "모든 셔터속도에서 플래시가 동조된다", "필름(센서) 바로 앞에서 두 장의 막이 움직이며 노광한다", "고속 셔터에서는 좁은 슬릿이 지나가며 노광한다"], "a": 2, "e": "포컬플레인 셔터는 동조속도(보통 1/125~1/250초) 이하에서만 화면이 완전히 열린다. 그보다 빠르면 슬릿이 지나가므로 플래시 광이 화면 일부만 비춘다.", "s": 3, "ch": 4}, {"id": "S3-009", "topic": "셔터", "q": "셔터 다이얼의 B(벌브)에 대한 설명으로 옳은 것은?", "c": ["자동으로 적정 노출을 계산한다", "연사 모드를 뜻한다", "셔터 버튼을 누르고 있는 동안 셔터가 열려 있다", "1초 고정으로 노광된다"], "a": 3, "e": "B는 누르는 동안 열려 있고, T는 한 번 누르면 열리고 다시 누르면 닫힌다. 야경·불꽃놀이 같은 장노출에 쓰며 삼각대와 릴리즈가 필요하다.", "s": 3, "ch": 4}, {"id": "S3-010", "topic": "렌즈", "q": "35mm 판형에서 표준렌즈의 초점거리로 가장 적절한 것은?", "c": ["약 200mm", "약 8mm", "약 50mm", "약 24mm"], "a": 3, "e": "표준렌즈의 초점거리는 화면 대각선 길이와 비슷하다. 24×36mm의 대각선이 약 43mm이므로 50mm 전후를 표준으로 본다. 사람 눈에 가까운 원근감을 준다.", "s": 3, "ch": 4}, {"id": "S3-011", "topic": "렌즈", "q": "광각렌즈의 특징으로 옳지 않은 것은?", "c": ["같은 조리개에서 심도가 깊다", "피사계심도가 얕아 배경이 크게 흐려진다", "화각이 넓어 좁은 공간에서 유리하다", "원근감이 과장되어 표현된다"], "a": 2, "e": "광각렌즈는 초점거리가 짧아 심도가 깊다. 배경을 크게 날리려면 망원렌즈에 밝은 조리개를 쓴다.", "s": 3, "ch": 4}, {"id": "S3-012", "topic": "렌즈", "q": "망원렌즈의 특징으로 옳은 것은?", "c": ["최단 촬영거리가 매우 짧다", "원근감이 압축되어 앞뒤 거리가 좁아 보인다", "화각이 넓어 풍경 전체를 담기에 좋다", "심도가 매우 깊다"], "a": 2, "e": "망원렌즈는 화각이 좁고 심도가 얕으며 원근 압축 효과가 크다. 흔들림에 민감해 대체로 1/초점거리보다 빠른 셔터속도가 필요하다.", "s": 3, "ch": 4}, {"id": "S3-013", "topic": "렌즈", "q": "어안렌즈(fish-eye lens)의 특징으로 옳은 것은?", "c": ["접사 전용 렌즈다", "원근을 압축한다", "화각이 180도 안팎으로 매우 넓고 직선이 크게 휘어 보인다", "화각이 좁고 왜곡이 전혀 없다"], "a": 3, "e": "어안렌즈는 극단적인 초광각으로 왜곡을 그대로 살리는 렌즈다. 왜곡을 보정한 초광각은 일반 광각렌즈로 분류한다.", "s": 3, "ch": 4}, {"id": "S3-014", "topic": "렌즈", "q": "건축 사진에서 카메라를 기울이지 않고도 높은 건물의 윗부분까지 담아 수직선이 모이는 현상을 막을 수 있는 렌즈는?", "c": ["ND 렌즈", "시프트(TS) 렌즈", "어안렌즈", "매크로 렌즈"], "a": 2, "e": "시프트(티프트 시프트) 렌즈는 렌즈 광축을 평행 이동시켜 뷰카메라의 라이즈 무브먼트와 같은 효과를 낸다.", "s": 3, "ch": 4}, {"id": "S3-015", "topic": "렌즈", "q": "색수차를 보정하기 위해 초저분산 유리로 만든 렌즈는?", "c": ["ED 렌즈", "시프트 렌즈", "줌 렌즈", "마이크로 렌즈"], "a": 1, "e": "ED(Extra-low Dispersion) 렌즈는 파장별 굴절률 차이를 줄여 색수차를 억제한다. 특히 망원렌즈에서 효과가 크다.", "s": 3, "ch": 4}, {"id": "S3-016", "topic": "렌즈", "q": "렌즈의 수차 중 화면 주변부의 직선이 안쪽이나 바깥쪽으로 휘어 보이는 것은?", "c": ["색수차", "비점수차", "왜곡수차", "구면수차"], "a": 3, "e": "안쪽으로 휘면 술통형(배럴), 바깥쪽으로 휘면 실패형(핀쿠션) 왜곡이다. 광각에서는 배럴, 망원에서는 핀쿠션이 나타나기 쉽다.", "s": 3, "ch": 4}, {"id": "S3-017", "topic": "렌즈", "q": "렌즈 표면에 코팅을 하는 가장 큰 이유는?", "c": ["조리개 수치를 바꾸기 위해", "표면 반사를 줄여 플레어를 억제하고 투과율을 높이기 위해", "렌즈를 무겁게 하기 위해", "초점거리를 늘리기 위해"], "a": 2, "e": "코팅은 반사로 잃는 빛을 줄여 콘트라스트와 색 재현을 개선한다. 코팅면은 약하므로 청소할 때 전용 용품을 쓴다.", "s": 3, "ch": 4}, {"id": "S3-018", "topic": "렌즈", "q": "렌즈 후드(hood)를 사용하는 주된 목적은?", "c": ["노출을 자동으로 맞추기 위해", "화각 밖에서 들어오는 유해광선을 차단해 플레어를 막기 위해", "초점거리를 연장하기 위해", "심도를 깊게 하기 위해"], "a": 2, "e": "후드는 잡광을 막아 콘트라스트 저하를 방지하고, 렌즈 앞면 보호 효과도 있다. 화각에 맞는 후드를 써야 비네팅이 생기지 않는다.", "s": 3, "ch": 4}, {"id": "S3-019", "topic": "렌즈", "q": "카메라 몸체와 렌즈 사이에 끼워 초점거리를 배율만큼 늘려주는 부속은?", "c": ["컨버터", "후드", "릴리즈", "데이터 백"], "a": 1, "e": "2배 컨버터를 쓰면 200mm 렌즈가 400mm가 된다. 대신 밝기가 2스톱 어두워지고 화질이 다소 떨어진다.", "s": 3, "ch": 4}, {"id": "S3-020", "topic": "렌즈", "q": "접사(근접) 촬영에 사용하는 기구로 가장 거리가 먼 것은?", "c": ["벨로즈", "접사링(중간링)", "클로즈업 렌즈", "ND 필터"], "a": 4,
